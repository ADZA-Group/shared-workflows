# Manual smoke for reusable-security-scan. Runnable only AFTER dev is pushed
# (the reusable references composites at adza-group/shared-workflows/...@dev,
# which must resolve remotely). Validates wiring + composite resolution, not
# deep app findings (use a real app caller in Phase 4 for that).
name: "🧪 Smoke — Security Scan"

on:
  workflow_dispatch:
    inputs:
      blocking-scanners:
        description: "Opt-in Dual-Gate-Beweis (2026-09-04): kommagetrennt aus semgrep,trivy-fs,pip-audit — leer = advisory"
        required: false
        type: string
        default: ""
      force-blocking:
        description: "Dual-Gate auch ausserhalb main/tags scharf schalten (wie risky-Pfad) — noetig, damit blocking-scanners auf einem Nicht-main-Ref greifen"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 5 3 * *"   # monatlicher Drift-Wächter (Smoke war Mai–Juli 2026 unbemerkt kaputt; schedule feuert vom Default-Branch = dev)

permissions:
  contents: read
  security-events: write
  actions: read   # codeql-Job claimt actions:read (github/codeql-action#2117) — Called-Job > Caller = startup_failure, auch wenn run-codeql:false (Plan-Zeit-Check). App-Caller haben es seit v1.3.8, der Smoke fehlte.

jobs:
  security:
    uses: ./.github/workflows/reusable-security-scan.yml
    with:
      runner-label: '["ubuntu-latest"]'   # validate on ubuntu (bypasses LXC-104 block)
      run-dependency-review: false   # needs a pull_request event
      run-pip-audit: false           # shared-workflows has no requirements.txt
      run-codeql: false              # finicky on a non-app repo; validate via real app in P4
      # Beweisweg fuer das Opt-in-Gate: auf einem Wegwerf-Branch mit Semgrep-Kanarienvogel dispatchen —
      # blocking-scanners=semgrep + force-blocking=true ⇒ Semgrep-Job ROT; ohne ⇒ gruen mit "N Finding(s)".
      blocking-scanners: ${{ inputs.blocking-scanners || '' }}
      force-blocking: ${{ inputs.force-blocking == true }}
    secrets: inherit
