name: actionlint
# Workflow-Dateien-Gate: fängt Schema-Fehler, verwaiste needs:-Referenzen und
# Expression-Bugs VOR dem Schaden. Gerade HIER kritisch: ein dev-Push auf
# reusable-*.yml triggerte bisher KEINEN einzigen Workflow — ein Strukturfehler
# landete still auf dev und flog erst beim nächsten Release auf, dann fleet-weit.
# Läuft NUR bei Änderungen an Workflow-Dateien, auf GitHub-Runnern (104 frei).
# Nutzt die vorhandene Config .github/actionlint.yaml.
on:
  push:
    branches: [dev]
    paths: [".github/workflows/**", "scripts/gate_matrix.py", "scripts/check_docs.py", "README.md"]
  pull_request:
    paths: [".github/workflows/**", "scripts/gate_matrix.py", "scripts/check_docs.py", "README.md"]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint v1.7.12
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8   # actionlint_1.7.12_linux_amd64.tar.gz (Audit 2026-09-03, Fund 7)
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tgz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c --quiet - || { echo "::error::actionlint checksum mismatch"; exit 1; }
          tar xz -f "$RUNNER_TEMP/actionlint.tgz" actionlint
          # -shellcheck=/-pyflakes= leer: Gate prueft Workflow-STRUKTUR (Schema,
          # verwaiste needs:, Expressions) — Shell-Stil-Kosmetik ist kein
          # Gate-Thema und haengt sonst am zufaellig vorinstallierten shellcheck.
          ./actionlint -color -shellcheck= -pyflakes=
      # Deploy-Gate-Invariante (Audit 2026-09-03): liest den echten docker-build-
      # if-Ausdruck aus reusable-ci.yml und beweist per Brute-Force, dass kein
      # hartes Gate bei failure/cancelled einen Push zulaesst. Exit 1 = Verstoss.
      - name: Deploy-gate matrix (scripts/gate_matrix.py)
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 scripts/gate_matrix.py
      # Doku-Drift-Waechter (Etappe D, 2026-09-04): README-Input-Tabelle muss exakt die
      # reusable-ci-Inputs nennen — drei Doku-Luegen an einem Tag waren der Ausloeser.
      - name: Docs drift (scripts/check_docs.py)
        run: python3 scripts/check_docs.py
