# ═══════════════════════════════════════════════════════════════
# Reusable Notification Workflow — ADZA-Group
#
# Sends CI/CD failure alerts to Discord, Slack, Telegram.
# Usage:
#   uses: ADZA-Group/shared-workflows/.github/workflows/reusable-notify.yml@v1
#   with:
#     app-name: "MyApp"
#     status: "failure"
#   secrets: inherit
# ═══════════════════════════════════════════════════════════════

name: "🚨 Notify"

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
        description: "Application name for alert title"
      status:
        required: true
        type: string
        description: "Pipeline status (success/failure)"
      branch:
        required: false
        type: string
        default: ""
      sha:
        required: false
        type: string
        default: ""
      run-url:
        required: false
        type: string
        default: ""
      runner-label:
        required: false
        type: string
        default: '["self-hosted", "linux", "proxmox"]'
    secrets:
      DISCORD_WEBHOOK:
        required: false
      SLACK_WEBHOOK:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

jobs:
  notify:
    name: "🚨 Alert"
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 5
    permissions:
      actions: read            # Transition-Detektor liest die Run-Historie; Webhooks brauchen weiterhin kein Token
    steps:
      # Notify-Intelligenz: nur ZUSTANDS-ÜBERGÄNGE melden. Dauer-Rot spammt nicht
      # (Alarm kam beim grün→rot-Übergang), Dauer-Grün ist still, rot→grün gibt
      # eine Recovery-Meldung. Vergleich: letzter ABGESCHLOSSENER Lauf desselben
      # Workflows auf gleichem Branch UND event_name (push vergleicht mit push,
      # schedule mit schedule), nur ältere run_numbers, nur success/failure als
      # Vergleichswert (cancelled/skipped/neutral sind keine Transition).
      # API-Fehler ⇒ fail-open Richtung Alarm (lieber doppelt als nie).
      - name: Transition check (state changes only)
        id: trans
        env:
          GH_TOKEN: ${{ github.token }}
          CUR: ${{ inputs.status }}
          EV: ${{ github.event_name }}
          BR: ${{ inputs.branch || github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          send=false; kind=none; prev=unknown
          if [ "$CUR" = "failure" ] || [ "$CUR" = "success" ]; then
            WF_ID=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .workflow_id 2>/dev/null || echo "")
            if [ -n "$WF_ID" ]; then
              prev=$(gh api "repos/$REPO/actions/workflows/$WF_ID/runs?branch=$BR&event=$EV&status=completed&per_page=50" \
                --jq "[.workflow_runs[] | select(.run_number < $RUN_NUMBER) | select(.conclusion==\"success\" or .conclusion==\"failure\")] | sort_by(-.run_number) | (.[0].conclusion // \"none\")" 2>/dev/null || echo unknown)
            fi
            case "$CUR:$prev" in
              failure:success|failure:none|failure:unknown) send=true; kind=alarm ;;
              success:failure)                              send=true; kind=recovery ;;
            esac
          fi
          echo "prev=$prev cur=$CUR -> send=$send kind=$kind"
          { echo "send=$send"; echo "kind=$kind"; } >> "$GITHUB_OUTPUT"

      - name: Build alert context
        if: steps.trans.outputs.send == 'true'
        id: ctx
        # SECURITY: untrusted context (ref_name/actor können Shell-Metazeichen
        # enthalten — git-Refs erlauben $ ( ) ` ' " ; | &) NIE per ${{ }} direkt
        # in run: interpolieren. Über env einlesen, im Skript nur "$VAR" nutzen.
        env:
          IN_BRANCH: ${{ inputs.branch || github.ref_name }}
          IN_SHA: ${{ inputs.sha || github.sha }}
          IN_RUN_URL: ${{ inputs.run-url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          IN_ACTOR: ${{ github.actor }}
          IN_STATUS: ${{ inputs.status }}
          IN_APP: ${{ inputs.app-name }}
          IN_KIND: ${{ steps.trans.outputs.kind }}
          IN_REF: ${{ github.ref }}
        run: |
          BRANCH="$IN_BRANCH"
          SHA="$IN_SHA"
          SHORT_SHA="${SHA:0:7}"
          RUN_URL="$IN_RUN_URL"
          ACTOR="$IN_ACTOR"
          STATUS="$IN_STATUS"
          APP="$IN_APP"

          # Severity: main/tags = Produktionspfad → [PROD] im Titel (alle Kanäle,
          # kein Kanal-Routing — Ponytail). Recovery überschreibt Text + Farbe.
          SEV=""
          case "$BRANCH" in main) SEV=" [PROD]";; esac
          case "$IN_REF" in refs/tags/*) SEV=" [PROD]";; esac
          if [ "$IN_KIND" = "recovery" ]; then
            ICON="🟢${SEV}"
            COLOR="3066993"
            STATUS="RECOVERED — wieder grün (war rot)"
          else
            ICON="🔴${SEV}"
            COLOR="15158332"
          fi

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "url=$RUN_URL" >> $GITHUB_OUTPUT
          echo "actor=$ACTOR" >> $GITHUB_OUTPUT
          echo "icon=$ICON" >> $GITHUB_OUTPUT
          echo "color=$COLOR" >> $GITHUB_OUTPUT
          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: "Discord"
        if: steps.trans.outputs.send == 'true' && env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          O_BRANCH: ${{ steps.ctx.outputs.branch }}
        run: |
          curl -sSf -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
              "username": "${{ steps.ctx.outputs.app }} CI",
              "embeds": [{
                "title": "${{ steps.ctx.outputs.icon }} CI/CD Pipeline — ${{ steps.ctx.outputs.status }}",
                "color": ${{ steps.ctx.outputs.color }},
                "fields": [
                  {"name": "App", "value": "`${{ steps.ctx.outputs.app }}`", "inline": true},
                  {"name": "Branch", "value": "`'"$O_BRANCH"'`", "inline": true},
                  {"name": "Commit", "value": "`${{ steps.ctx.outputs.sha }}`", "inline": true},
                  {"name": "Author", "value": "${{ steps.ctx.outputs.actor }}", "inline": true},
                  {"name": "Details", "value": "[View Run](${{ steps.ctx.outputs.url }})"}
                ],
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]
            }'

      - name: "Slack"
        if: steps.trans.outputs.send == 'true' && env.SLACK_WEBHOOK != ''
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          O_BRANCH: ${{ steps.ctx.outputs.branch }}
        run: |
          curl -sSf -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "${{ steps.ctx.outputs.icon }} ${{ steps.ctx.outputs.app }} CI/CD — ${{ steps.ctx.outputs.status }}",
              "blocks": [
                {"type": "header", "text": {"type": "plain_text", "text": "${{ steps.ctx.outputs.icon }} ${{ steps.ctx.outputs.app }} — ${{ steps.ctx.outputs.status }}"}},
                {"type": "section", "fields": [
                  {"type": "mrkdwn", "text": "*Branch:*\n`'"$O_BRANCH"'`"},
                  {"type": "mrkdwn", "text": "*Commit:*\n`${{ steps.ctx.outputs.sha }}`"},
                  {"type": "mrkdwn", "text": "*Author:*\n${{ steps.ctx.outputs.actor }}"}
                ]},
                {"type": "actions", "elements": [{"type": "button", "text": {"type": "plain_text", "text": "View Run"}, "url": "${{ steps.ctx.outputs.url }}"}]}
              ]
            }'

      - name: "Telegram"
        if: steps.trans.outputs.send == 'true' && env.BOT_TOKEN != ''
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          O_BRANCH: ${{ steps.ctx.outputs.branch }}
        run: |
          MSG="${{ steps.ctx.outputs.icon }} <b>${{ steps.ctx.outputs.app }} CI/CD — ${{ steps.ctx.outputs.status }}</b>%0A"
          MSG+="<b>Branch:</b> <code>${O_BRANCH}</code>%0A"
          MSG+="<b>Commit:</b> <code>${{ steps.ctx.outputs.sha }}</code>%0A"
          MSG+="<b>Author:</b> ${{ steps.ctx.outputs.actor }}%0A"
          MSG+="<a href='${{ steps.ctx.outputs.url }}'>View Run</a>"
          curl -sSf -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d parse_mode=HTML -d text="$MSG"
