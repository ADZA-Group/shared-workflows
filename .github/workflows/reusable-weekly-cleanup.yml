# =================================================================
# Reusable Weekly Cleanup — ADZA-Group
#
# Cleans up: OLD CI runs (age-based), Docker on LXC, temp files.
# Audit 2026-09-03 (Fund C): KEIN Loeschen nach Status mehr. Das fruehere
# "failed + cancelled weg" nahm pipeline-analytics/monitoring-dashboard die
# roten Runs aus der Datenbasis (Success-Rate ueber die Ueberlebenden =
# geschoent) und dem Flake-Radar seine Artefakte. Jetzt: nur Runs aelter
# als `retention-days`, und nie unter die neuesten `keep-runs`.
# Usage:
#   uses: ADZA-Group/shared-workflows/.github/workflows/reusable-weekly-cleanup.yml@v1
#   with:
#     app-name: "RecyclageApp"
#     keep-runs: 10
#     retention-days: 30
# =================================================================

name: "🧹 Weekly Cleanup"

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      keep-runs:
        required: false
        type: number
        default: 10
        description: "Untergrenze: die neuesten N Runs bleiben immer, egal wie alt"
      retention-days:
        required: false
        type: number
        default: 30
        description: "Runs aelter als N Tage werden geloescht (unabhaengig vom Ergebnis)"
      runner-label:
        required: false
        type: string
        default: '["self-hosted", "linux", "proxmox"]'

jobs:
  cleanup-runs:
    name: "🗑️ Clean CI Runs"
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    permissions:
      actions: write           # gh run list/delete
    steps:
      - name: "Delete runs older than retention (keep newest keep-runs)"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          APP: ${{ inputs.app-name }}
          KEEP: ${{ inputs.keep-runs }}
          DAYS: ${{ inputs.retention-days }}
        run: |
          CUTOFF=$(date -u -d "-${DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          DELETED=0
          # Neueste zuerst; ab Index KEEP und aelter als CUTOFF -> loeschen. Status egal.
          OLD=$(gh run list --repo "$REPO" --status completed --limit 200 --json databaseId,createdAt \
                  --jq ".[${KEEP}:] | map(select(.createdAt < \"${CUTOFF}\")) | .[].databaseId" 2>/dev/null || echo "")
          for ID in $OLD; do
            gh run delete "$ID" --repo "$REPO" 2>/dev/null && DELETED=$((DELETED + 1))
          done
          REMAINING=$(gh run list --repo "$REPO" --limit 100 --json databaseId --jq 'length' 2>/dev/null || echo "?")
          {
            echo "## 🧹 ${APP} Weekly Cleanup"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Runs deleted (older than ${DAYS}d) | $DELETED |"
            echo "| Runs remaining | $REMAINING |"
            echo "| Keep floor | $KEEP |"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup-runner:
    name: "🐳 Clean Runner"
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 5
    permissions: {}            # local docker/temp cleanup only — no token use
    steps:
      - name: "Docker cleanup"
        run: |
          BEFORE=$(docker system df --format '{{.Size}}' 2>/dev/null | head -1 || echo "0")
          docker container prune -f 2>/dev/null | tail -1
          docker image prune -af --filter "until=48h" 2>/dev/null | tail -1
          docker volume prune -f 2>/dev/null | tail -1
          docker builder prune -f --filter "until=48h" 2>/dev/null | tail -1
          AFTER=$(docker system df --format '{{.Size}}' 2>/dev/null | head -1 || echo "0")

          echo "### 🐳 Docker" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Before | $BEFORE |" >> $GITHUB_STEP_SUMMARY
          echo "| After | $AFTER |" >> $GITHUB_STEP_SUMMARY

      - name: "Temp + cache cleanup"
        run: |
          find /tmp -type f -mtime +2 -delete 2>/dev/null || true
          find /home/runner/actions-runner*/_work/_temp -mindepth 1 -mtime +1 -delete 2>/dev/null || true
          # Nur KALTE Cache-Dateien (>30 Tage unbenutzt) räumen: der lokale
          # pip-/npm-Cache ist auf den self-hosted Runnern die einzige echte
          # Cache-Quelle (der Actions-Cache ist restore-only) — das frühere
          # rm -rf erzwang jeden Montag Cold-Start-Installs in allen Jobs.
          find /home/runner/.cache/pip /home/runner/.cache/uv /home/runner/.npm/_cacache -type f -atime +30 -delete 2>/dev/null || true
          find /home/runner/.cache/pip /home/runner/.cache/uv /home/runner/.npm/_cacache -type d -empty -delete 2>/dev/null || true

          DISK=$(df -h / | tail -1 | awk '{print $3, "/", $2, "(" $5 ")"}')
          echo "### 💾 Disk" >> $GITHUB_STEP_SUMMARY
          echo "| Disk Used | $DISK |" >> $GITHUB_STEP_SUMMARY
