# ═══════════════════════════════════════════════════════════════
# Reusable CI Orchestrator (CORE) — ADZA-Group
#
# The one canonical pipeline. Apps call this with ~10 inputs.
# CORE: changes → lint-python + security → pytest-matrix →
#       coverage + test-results → docker-build → telemetry.
# Composites + sub-reusables referenced by full path on floating @v1 (no drift).
#
# Usage (app build.yml):
#   jobs:
#     ci:
#       uses: adza-group/shared-workflows/.github/workflows/reusable-ci.yml@v1
#       with:
#         app-name: rechnungsapp
#         coverage-threshold: 49
#         test-shards: >-
#           [{"name":"backend","paths":"tests/test_models.py tests/test_auth.py"},
#            {"name":"integration","paths":"tests/integration/"}]
#         test-env: '{"RECHNUNG_TESTING":"1","RECHNUNG_DATABASE_URL":"postgresql://postgres:postgres@localhost:5432/test"}'
#       secrets: inherit
# ═══════════════════════════════════════════════════════════════

name: "🚀 CI"

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      runner-label:
        required: false
        type: string
        default: '["self-hosted", "linux", "proxmox"]'
      cloud-runner-label:
        # Runner fuer die LAN-unabhaengige Fan-out-Phase (Lints/Tests/Security/Quality).
        # HYBRID DORMANT: Default = self-hosted, weil GitHub-hosted Runner fuer diesen
        # Account billing-gesperrt sind ("payments failed / spending limit"). Sobald
        # Billing gefixt ist: Caller setzt cloud-runner-label: '["ubuntu-latest"]' ->
        # Fan-out laeuft voll parallel auf GitHubs Infra (loest GHCR-Flakes + CodeQL-OOM).
        required: false
        type: string
        default: '["self-hosted", "linux", "proxmox"]'
      python-version:
        required: false
        type: string
        default: "3.11"
      test-shards:
        required: true
        type: string
        description: 'JSON array of {name, paths, markers?, cov?}'
      test-env:
        required: false
        type: string
        default: "{}"
        description: "JSON of env vars for test jobs (include the DB URL here)"
      coverage-threshold:
        required: false
        type: number
        default: 50
      diff-coverage-threshold:
        required: false
        type: number
        default: 80
        description: "Min coverage % on changed lines (PR/dev advisory, main/tags hard); 0 disables"
      postgres-version:
        required: false
        type: string
        default: "16-alpine"
      enable-redis:
        required: false
        type: boolean
        default: false
        description: "Reserved — a redis service is always provided to test jobs; accepted for caller compatibility"
      install-system-deps:
        required: false
        type: boolean
        default: false
      image-name:
        required: false
        type: string
        default: ""
      image-size-limit-mb:
        required: false
        type: number
        default: 800
      multi-arch:
        required: false
        type: boolean
        default: false
      allow-multiarch-rebuild:
        required: false
        type: boolean
        default: false
        description: "Nur mit multi-arch: erlaubt den ZWEITEN (ungescannten) buildx-Build fuer arm64. Ohne Opt-in ist multi-arch bei push fail-closed (Audit 2026-09-03, Fund 3)."
      sign-image:
        required: false
        type: boolean
        default: true
      enable-push:
        required: false
        type: boolean
        default: true
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"
      docker-context:
        required: false
        type: string
        default: "."
      has-frontend:
        required: false
        type: boolean
        default: false
        description: "Enable frontend lane (reusable-frontend.yml)"
      frontend-dir:
        required: false
        type: string
        default: "frontend"
      a11y-url:
        required: false
        type: string
        default: ""
        description: "Forwarded to the frontend lane: base URL for pa11y a11y scan (empty = serve build output locally)"
      a11y-paths:
        required: false
        type: string
        default: "/"
        description: "Forwarded to the frontend lane: space-separated paths to a11y-scan"
      a11y-threshold:
        required: false
        type: number
        default: 0
        description: "Forwarded to the frontend lane: max allowed pa11y errors per page (ratchet for known debt; 0 = strict)"
      enable-property-tests:
        required: false
        type: boolean
        default: true
      enable-mutation:
        required: false
        type: boolean
        default: true
      full-ci-on-dev-push:
        required: false
        type: boolean
        default: false
        description: "true = Security-Suite + Property-Tests auch auf dev-/Feature-Pushes (Verhalten vor v1.9.0). Default false: dort skippen — PR, main-Push, dispatch und schedule laufen immer voll (CI-Diät, Runner-104-Entlastung)"
      risky-paths:
        required: false
        type: string
        default: "[]"
        description: "Risk-adaptives Gating: JSON-Array zusätzlicher Globs, die IMMER mit den eingebauten Defaults (auth/security/permissions/migrations/models/payment/billing/price/delete/purge, Dockerfile, docker-compose*) UNIONiert werden — nie ersetzen. Berührt ein Push einen riskanten Pfad, läuft auch auf dev die volle CI (light aus) und property-tests/hadolint/bandit werden BLOCKING."
      full-ci-paths:
        required: false
        type: string
        default: "[]"
        description: "Stufe D (Audit 2026-09-03): JSON-Array von Globs, die die vollen Code-Lanes (Test-Matrix, Build, Frontend) erzwingen, OHNE die Gates zu haerten oder die CI-Diaet auszuschalten. Fuer test-relevante Pfade wie templates/**, static/**, translations/** — `risky-paths` bleibt fuer sicherheitsrelevante Pfade (bandit/property/hadolint blocking + Diaet aus)."
      enable-load-test:
        required: false
        type: boolean
        default: false
      staging-url:
        required: false
        type: string
        default: ""
        description: "Staging health-check URL (empty = skip deploy-tail)"
      prod-url:
        required: false
        type: string
        default: ""
        description: "Prod health-check URL (empty = skip verify-prod)"
      prod-environment:
        required: false
        type: string
        default: ""
        description: "GitHub Environment for the verify-prod job (empty = none). Gives a Deployments tab; required-reviewer approval needs a paid plan on private repos."
      staging-environment:
        required: false
        type: string
        default: ""
        description: "GitHub Environment for the verify-staging job (empty = none)."
      deploy-prod:
        required: false
        type: boolean
        default: true
        description: "Master switch for prod push+verify (set false to disable)"
      enable-dast:
        required: false
        type: boolean
        default: false
        description: "Enable DAST scan after staging verify (wired in Cycle B)"
      run-dependency-review:
        required: false
        type: boolean
        default: true
        description: "Run GHAS dependency-review on PRs. Since v1.10.2 the job additionally auto-skips on PRIVATE repos (no GHAS in the fleet — the action hard-errors there), so this switch only matters for public repos. Passed through to reusable-security-scan."
      enable-ghcr-prune:
        required: false
        type: boolean
        default: false
        description: "⚠️ VALIDIERT UNSICHER (2026-06-05, Rechnungsapp): buildx pusht mit provenance/SBOM IMMER einen OCI-Index — dessen Children (auch single-arch!) erscheinen in GHCR als untagged versions → der Sweep löscht sie und zerstört die im SELBEN Run gepushten Tags (manifest unknown / not found beim Pull). NICHT aktivieren, bis der Prune referenced-digest-aware ist (Risk #2)"
      ghcr-keep-versions:
        required: false
        type: number
        default: 3
        description: "Recent tagged GHCR versions to keep (reserved — wired in the validated tagged-prune phase)"
      openapi-spec:
        required: false
        type: string
        default: ""
        description: "OpenAPI spec path/URL for schemathesis api-contract (empty = skip the job)"
      api-boot-command:
        required: false
        type: string
        default: ""
        description: "Command to start the app for api-contract testing"
      api-health-url:
        required: false
        type: string
        default: ""
        description: "Health URL polled before api-contract testing"
      api-base-url:
        required: false
        type: string
        default: ""
        description: "Base URL of the running app for schemathesis (empty = derive from health-url origin)"
      api-requirements:
        required: false
        type: string
        default: ""
        description: "Optional requirements file installed before api-contract boot"
      enable-e2e:
        required: false
        type: boolean
        default: false
        description: "Enable the pre-merge Playwright e2e job (opt-in; needs e2e-boot-command + e2e-health-url)"
      e2e-boot-command:
        required: false
        type: string
        default: ""
        description: "Foreground command to start the app for e2e (uses the venv on PATH)"
      e2e-health-url:
        required: false
        type: string
        default: ""
        description: "Health URL polled before e2e (localhost:<port>)"
      e2e-dir:
        required: false
        type: string
        default: "e2e"
      e2e-command:
        required: false
        type: string
        default: "npx playwright test"
      staging-version-url:
        required: false
        type: string
        default: ""
        description: "C2: URL reporting running version on staging (empty = 200-only verify)"
      prod-version-url:
        required: false
        type: string
        default: ""
        description: "C2: URL reporting running version on prod (empty = 200-only verify)"
      enforce-branch-policy:
        required: false
        type: boolean
        default: true
        description: "Hard gate: main pushes must come via dev (ff- or --no-ff-merge); violations block docker-build/promote"
      gated-promotion:
        required: false
        type: boolean
        default: false
        description: "Opt-in: main builds :candidate-<sha>; promote-prod retags to :latest only after require-staging-green. REQUIRES staging-url."
      enable-candidate-prune:
        required: false
        type: boolean
        default: false
        description: "Opt-in: delete GHCR versions tagged ONLY candidate-*/main-<sha> older than 14 days (referenced-safe; promoted candidates carry :latest/:main on the same version and are skipped). Note: for packages under a personal account (e.g. ghcr.io/azad-ahmed/*) the org-scoped GITHUB_TOKEN may lack DELETE permission — the step then fails loudly, no deletions."

    # Nur die Notify-Webhooks sind echte Secrets (alles andere nutzt den
    # automatisch bereitgestellten GITHUB_TOKEN). Expliziter Block, damit Caller
    # named statt `secrets: inherit` übergeben können → ihr cross-repo
    # RUNNER_SWITCH_PAT leakt dann nicht mehr in diese Reusable + Sub-Reusables.
    # required:false → bestehende inherit-Caller (Smoke/Alt) laufen unverändert. (Audit P2)
    secrets:
      DISCORD_WEBHOOK:
        required: false
      SLACK_WEBHOOK:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

permissions:
  contents: read

jobs:
  changes:
    name: "🔍 Detect Changes"
    runs-on: ${{ fromJSON(inputs.cloud-runner-label) }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # dorny/paths-filter queries the API; without this → "Resource not accessible by integration"
    outputs:
      # Alle Outputs kommen aus dem NORMALISIERUNGS-Step (norm) — Single Source:
      # - Promote-Override (v1.7.1): jeder main-PUSH validiert VOLL (leerer dev...main-
      #   Diff → Kaskaden-Skip → Promote-Block; Incident Rechnungsapp Run 27258300405).
      # - CI-Diät (v1.9.0): dev-Pushes light — ABER risky-Pfade übersteuern light.
      # - Fail-closed (Risk-Gating): schlägt der paths-filter selbst fehl, werden ALLE
      #   Kategorien + risky auf true gesetzt statt den Job (und damit via needs die
      #   ganze Pipeline) zu kaskaden-skippen. Ein Filterfehler erzeugt MEHR CI, nie weniger.
      python: ${{ steps.norm.outputs.python }}
      docker: ${{ steps.norm.outputs.docker }}
      frontend: ${{ steps.norm.outputs.frontend }}
      ci: ${{ steps.norm.outputs.ci }}
      any_code: ${{ steps.norm.outputs.any_code }}
      risky: ${{ steps.norm.outputs.risky }}
      fullci: ${{ steps.norm.outputs.fullci }}
      light: ${{ steps.norm.outputs.light }}
      start_time: ${{ steps.t.outputs.epoch }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0   # paths-filter diffs locally via git (avoids restricted compare API → "Resource not accessible")
      - id: t
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Compose filters (validated — no raw YAML injection from caller input)
        id: rf
        env:
          RISKY_EXTRA: ${{ inputs.risky-paths }}
          FULLCI_EXTRA: ${{ inputs.full-ci-paths }}
        run: |
          python3 - <<'PY'
          import json, os, re
          # Caller-Globs werden validiert (nur schlichte Glob-Strings) und mit den
          # Defaults UNIONiert — ein kaputter Input degradiert zu Defaults + Warnung,
          # er kann den Filter nie strukturell zerstoeren (Codex-Review Lane A).
          base = {
              "python": ["**/*.py", "requirements*.txt", "pytest.ini", ".coveragerc"],
              "docker": ["Dockerfile", "docker-compose*.yml"],
              "frontend": ["frontend/**", "templates/**", "static/**", "translations/**"],
              "ci": [".github/**"],
              "risky": [
                  "**/auth*", "**/security*", "**/permissions*",
                  "**/migrations/**", "**/models*",
                  "**/payment*", "**/billing*", "**/price*",
                  "**/*delete*", "**/*purge*",
                  "Dockerfile", "docker-compose*",
              ],
              # Stufe D: Caller-Globs, die nur die Code-Lanes erzwingen (kein Gate-Haerten).
              # Leere Liste ist fuer dorny/paths-filter ungueltig → Platzhalter, der nie trifft.
              "fullci": ["__adza_never_matches__/**"],
          }
          def add_globs(env_name, key, label):
              try:
                  extra = json.loads(os.environ.get(env_name) or "[]")
                  if not isinstance(extra, list):
                      raise ValueError("not a list")
              except Exception as e:
                  print(f"::warning::{label} ist kein JSON-Array ({e}) — Defaults gelten trotzdem")
                  extra = []
              for g in extra:
                  if isinstance(g, str) and g and not re.search(r"[\n'\"]", g):
                      base[key].append(g)
                  else:
                      print(f"::warning::{label}-Eintrag ignoriert (kein schlichter Glob): {g!r}")
          add_globs("RISKY_EXTRA", "risky", "risky-paths")
          add_globs("FULLCI_EXTRA", "fullci", "full-ci-paths")
          lines = []
          for key, globs in base.items():
              lines.append(f"{key}:")
              lines.extend(f"  - '{g}'" for g in globs)
          out = "\n".join(lines) + "\n"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("filters<<FILTERS_EOF\n" + out + "FILTERS_EOF\n")
          PY
      - id: filter
        # continue-on-error: der norm-Step unten behandelt einen Filter-Fehler
        # fail-closed (alles true). Ohne das wuerde der changes-Job failen und
        # ALLE Downstream-Jobs kaskaden-skippen — das Gegenteil von Haerte.
        continue-on-error: true
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        with:
          filters: ${{ steps.rf.outputs.filters }}
      - name: Normalize outputs (fail-closed, risky overrides light)
        id: norm
        env:
          F_OUTCOME: ${{ steps.filter.outcome }}
          F_PY: ${{ steps.filter.outputs.python }}
          F_DOCKER: ${{ steps.filter.outputs.docker }}
          F_FRONT: ${{ steps.filter.outputs.frontend }}
          F_CI: ${{ steps.filter.outputs.ci }}
          F_RISKY: ${{ steps.filter.outputs.risky }}
          F_FULLCI: ${{ steps.filter.outputs.fullci }}
          MAIN_PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          LIGHT_CAND: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') && !inputs.full-ci-on-dev-push }}
        run: |
          if [ "$F_OUTCOME" != "success" ]; then
            echo "::warning::paths-filter fehlgeschlagen — fail-closed: alle Kategorien + risky = true (volle harte CI)"
            PY=true; DK=true; FR=true; CI=true; RISKY=true
          else
            PY=$F_PY; DK=$F_DOCKER; FR=$F_FRONT; CI=$F_CI; RISKY=${F_RISKY:-false}
          fi
          FULLCI=${F_FULLCI:-false}
          # Stufe D: full-ci-paths ⇒ volle Code-Lanes (Test-Matrix + Build + Frontend),
          # aber KEINE Gate-Haertung und Diaet unveraendert — das ist der Unterschied zu risky.
          if [ "$FULLCI" = "true" ]; then PY=true; DK=true; FR=true; fi
          if [ "$MAIN_PUSH" = "true" ]; then PY=true; DK=true; FR=true; CI=true; fi
          # Risky ⇒ volle Code-Lanes (PY/DK/FR): risky schaltete bisher nur die Diät aus
          # und machte Gates blocking — test-matrix/docker-build blieben filtergesteuert.
          # Ein risky-Push, der keinen Code-Filter trifft (z.B. Template-only via Caller-
          # risky-paths), baute+deployte sonst UNGETESTET (Vorfall rechnungsapp 21.08.).
          if [ "$RISKY" = "true" ]; then PY=true; DK=true; FR=true; fi
          ANY=false
          if [ "$PY" = "true" ] || [ "$DK" = "true" ] || [ "$FR" = "true" ]; then ANY=true; fi
          LIGHT=false
          if [ "$LIGHT_CAND" = "true" ] && [ "$RISKY" != "true" ]; then LIGHT=true; fi
          [ "$RISKY" = "true" ] && echo "::notice::⚠️ risky-Pfad berührt — CI-Diät aus, harte Gates aktiv (property/hadolint/bandit blocking)"
          {
            echo "python=$PY"; echo "docker=$DK"; echo "frontend=$FR"; echo "ci=$CI"
            echo "any_code=$ANY"; echo "risky=$RISKY"; echo "fullci=$FULLCI"; echo "light=$LIGHT"
          } >> "$GITHUB_OUTPUT"

      # 🔬 TIA-observe (Lane C, OBSERVE-ONLY — deselektiert NICHTS): berechnet, welche
      # Tests eine naming-convention-Heuristik für diesen Push GEWÄHLT HÄTTE. Der
      # test-results-Job prüft dann gegen die echten roten Tests, ob die Auswahl sie
      # enthalten hätte (False-Negative-Messung). Erst wenn Wochen an Daten die
      # Trefferquote belegen, wird echtes Deselektieren überhaupt erwogen (Codex-
      # Review: Coverage-Map-TIA ist für diese Fleet-Größe zu viel Infrastruktur;
      # "CI auf max" und Tests-weglassen ziehen in entgegengesetzte Richtungen).
      - name: TIA observe (would-have-selected, never deselects)
        continue-on-error: true
        env:
          EV: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          RISKY: ${{ steps.norm.outputs.risky }}
        run: |
          python3 - <<'PY'
          import fnmatch, glob, json, os, subprocess
          ev, ref = os.environ.get("EV"), os.environ.get("REF", "")
          before, risky = os.environ.get("BEFORE", ""), os.environ.get("RISKY") == "true"
          res = {"mode": "n/a", "reason": "", "changed": [], "selected_tests": [], "unmapped": []}
          def done():
              with open("tia-observe.json", "w", encoding="utf-8") as f:
                  json.dump(res, f, indent=2)
              line = f"TIA-observe: mode={res['mode']}" + (f" ({res['reason']})" if res["reason"] else "")
              if res["mode"] == "selected":
                  line += f" — {len(res['selected_tests'])} Testdatei(en) für {len(res['changed'])} geänderte Datei(en)"
              print(line)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
                  s.write(f"\n### 🔬 TIA-observe\n{line}\n")
              raise SystemExit(0)
          if ev != "push" or ref == "refs/heads/main" or ref.startswith("refs/tags/"):
              res["reason"] = f"event={ev} ref={ref} — TIA gälte nur für dev-Pushes"; done()
          if risky:
              res["mode"], res["reason"] = "full", "risky-Pfad ⇒ immer volle Matrix"; done()
          zero = "0" * 40
          def git(*a):
              return subprocess.run(["git", *a], capture_output=True, text=True)
          if not before or before == zero or git("cat-file", "-e", before).returncode != 0 \
             or git("merge-base", "--is-ancestor", before, "HEAD").returncode != 0:
              res["mode"], res["reason"] = "full", "kein sauberer before..sha-Bereich (force-push/neuer Branch)"; done()
          changed = [l for l in git("diff", "--name-only", f"{before}..HEAD").stdout.splitlines() if l]
          res["changed"] = changed
          # Präzise statt Substring (Codex R1): Verzeichnisse per Pfad-Anker,
          # Dateien per basename-Prefix — docs/.github-artige Pfade zählen sonst
          # fälschlich als strukturell (observe-only ⇒ nur Messrauschen, aber unnötig).
          def is_structural(f, base):
              if f.startswith(".github/") or f.startswith("migrations/") or "/migrations/" in f:
                  return True
              return any(base.startswith(p) for p in
                         ("requirements", "conftest", "pytest.ini", ".coveragerc",
                          "Dockerfile", "docker-compose"))
          selected, unmapped = set(), []
          for f in changed:
              base = os.path.basename(f)
              if is_structural(f, base):
                  res["mode"], res["reason"] = "full", f"strukturelle Änderung: {f}"; done()
              if fnmatch.fnmatch(base, "test_*.py") or fnmatch.fnmatch(base, "*_test.py"):
                  selected.add(f); continue
              if f.endswith(".py"):
                  stem = base[:-3]
                  hits = glob.glob(f"tests/**/test_{stem}*.py", recursive=True) + glob.glob(f"tests/test_{stem}*.py")
                  hits = [h.replace(os.sep, "/") for h in hits]  # nodeids sind immer forward-slash
                  if hits:
                      selected.update(hits)
                  else:
                      unmapped.append(f)
              else:
                  unmapped.append(f)  # Templates/SQL/Config — keine Python-Kante (Codex C)
          if unmapped:
              res["mode"], res["reason"], res["unmapped"] = "full", f"{len(unmapped)} Datei(en) ohne Test-Mapping", unmapped
              res["selected_tests"] = sorted(selected); done()
          res["mode"], res["selected_tests"] = "selected", sorted(selected)
          done()
          PY
      - name: Upload TIA observe
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        continue-on-error: true
        with:
          name: tia-observe
          path: tia-observe.json
          retention-days: 30
          if-no-files-found: ignore

  branch-policy:
    name: "🛡️ Branch Policy"
    if: ${{ inputs.enforce-branch-policy && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - name: Enforce dev -> main merge flow
        run: |
          git fetch origin dev --quiet || { echo "::error::cannot fetch origin/dev"; exit 1; }
          HEAD_SHA=$(git rev-parse HEAD)
          if git merge-base --is-ancestor "$HEAD_SHA" origin/dev; then
            echo "✅ main HEAD liegt auf dev (fast-forward merge) — policy ok"
            exit 0
          fi
          P2=$(git rev-parse "${HEAD_SHA}^2" 2>/dev/null || true)
          if [ -n "$P2" ] && git merge-base --is-ancestor "$P2" origin/dev; then
            echo "✅ main HEAD ist Merge mit dev als zweitem Parent (--no-ff/PR) — policy ok"
            exit 0
          fi
          echo "::error::Branch policy violated: main wurde nicht über dev befüllt. Iron Law: dev -> Staging grün -> main. Heilung: Änderung auf dev landen, Staging verifizieren, dann dev -> main mergen."
          exit 1

  lint-python:
    name: "🐍 Lint (ruff)"
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ${{ fromJSON(inputs.cloud-runner-label) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1
        with:
          install-requirements: "false"
          extra-packages: "ruff==0.15.20"
          cache-key-suffix: lint
      - name: Ruff
        run: |
          ruff check . --output-format=github
          ruff format --check --diff .

  lint-dockerfile:
    name: "🐳 Lint Dockerfile"
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ${{ fromJSON(inputs.cloud-runner-label) }}
    timeout-minutes: 5
    # Risk-Gating: Dockerfile-Änderung auf risky-Pfad (Dockerfile IST risky-Default)
    # ⇒ hadolint BLOCKING + gated den Build (docker-build.needs). Sonst advisory.
    continue-on-error: ${{ needs.changes.outputs.risky != 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Install hadolint v2.12.0 (sha256-verified)
        env:
          HADOLINT_SHA256: 56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010
        run: |
          # Audit 2026-09-03 (Fund 7): Download gegen gepinnte Summe pruefen, bevor er ausgefuehrt wird.
          curl -sSfL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 \
            -o "$RUNNER_TEMP/hadolint"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/hadolint" | sha256sum -c --quiet - || { echo "::error::hadolint checksum mismatch"; exit 1; }
          install -m 0755 "$RUNNER_TEMP/hadolint" /usr/local/bin/hadolint
      - name: Lint
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          [ -f "$DOCKERFILE" ] || { echo "::notice::no Dockerfile at $DOCKERFILE — skipping"; exit 0; }
          # --failure-threshold error: DL3008 (pin apt versions) & friends are *warnings*. They are
          # printed (informational) but must not fail the job — pinning apt versions contradicts the
          # ADZA "always newest stable" stack-policy. Real errors (DLxxxx error-level) still fail.
          hadolint "$DOCKERFILE" --format tty --failure-threshold error

  code-quality:
    name: "📊 Code Quality"
    needs: changes
    # CI-Diaet (v1.9.4): auf dev-/Feature-PUSHES aus. Der Job ist dort ohnehin
    # continue-on-error — reine Beratung, auf die niemand wartet, aber ~3-4 min
    # Runner-104-Zeit pro Push. PR, main, dispatch und der naechtliche schedule-
    # Lauf fahren ihn weiter voll. Schreibweise wie security/property-tests:
    # Job-Outputs sind STRINGS, !light waere immer falsch.
    if: ${{ (needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true') && needs.changes.outputs.light != 'true' }}
    runs-on: ${{ fromJSON(inputs.cloud-runner-label) }}
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1
        with:
          install-requirements: "false"
          extra-packages: "radon==6.0.1"
          cache-key-suffix: radon
      - name: Radon complexity
        run: |
          {
            echo "## 📊 Code Quality (radon)"
            echo '```'
            radon cc . -a -nb --exclude "tests,__pycache__,.venv" 2>/dev/null || echo "(no Python source found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          radon cc . -a -nb --exclude "tests,__pycache__,.venv" 2>/dev/null || true

  dead-code:
    name: "💀 Dead Code"
    needs: changes
    # CI-Diaet (v1.9.4): auf dev-/Feature-PUSHES aus. Der Job ist dort ohnehin
    # continue-on-error — reine Beratung, auf die niemand wartet, aber ~3-4 min
    # Runner-104-Zeit pro Push. PR, main, dispatch und der naechtliche schedule-
    # Lauf fahren ihn weiter voll. Schreibweise wie security/property-tests:
    # Job-Outputs sind STRINGS, !light waere immer falsch.
    if: ${{ (needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true') && needs.changes.outputs.light != 'true' }}
    runs-on: ${{ fromJSON(inputs.cloud-runner-label) }}
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1
        with:
          install-requirements: "false"
          extra-packages: "vulture==2.16"
          cache-key-suffix: vulture
      - name: Vulture scan
        run: |
          {
            echo "## 💀 Dead Code (vulture)"
            echo '```'
            vulture . --min-confidence 80 --exclude tests,__pycache__,.venv 2>/dev/null || echo "(no issues or no source)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          vulture . --min-confidence 80 --exclude tests,__pycache__,.venv 2>/dev/null || true

  todo-tracker:
    name: "📌 TODOs"
    needs: changes
    # CI-Diaet (v1.9.4): auf dev-/Feature-PUSHES aus. Der Job ist dort ohnehin
    # continue-on-error — reine Beratung, auf die niemand wartet, aber ~3-4 min
    # Runner-104-Zeit pro Push. PR, main, dispatch und der naechtliche schedule-
    # Lauf fahren ihn weiter voll. Schreibweise wie security/property-tests:
    # Job-Outputs sind STRINGS, !light waere immer falsch.
    if: ${{ (needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true') && needs.changes.outputs.light != 'true' }}
    runs-on: ${{ fromJSON(inputs.cloud-runner-label) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Count open TODOs
        run: |
          COUNT=$(grep -rn --include="*.py" "TODO\|FIXME\|HACK\|XXX" . 2>/dev/null | grep -v ".venv" | wc -l || echo 0)
          {
            echo "## 📌 TODO Tracker"
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Open TODO/FIXME/HACK/XXX | ${COUNT} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -gt 0 ]; then
            {
              echo ""
              echo "<details><summary>Show items</summary>"
              echo ""
              echo '```'
              grep -rn --include="*.py" "TODO\|FIXME\|HACK\|XXX" . 2>/dev/null | grep -v ".venv" | head -50
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  license-check:
    name: "⚖️ Licenses"
    needs: changes
    # CI-Diaet (v1.9.4): auf dev-/Feature-PUSHES aus. Der Job ist dort ohnehin
    # continue-on-error — reine Beratung, auf die niemand wartet, aber ~3-4 min
    # Runner-104-Zeit pro Push. PR, main, dispatch und der naechtliche schedule-
    # Lauf fahren ihn weiter voll. Schreibweise wie security/property-tests:
    # Job-Outputs sind STRINGS, !light waere immer falsch.
    if: ${{ (needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true') && needs.changes.outputs.light != 'true' }}
    runs-on: ${{ fromJSON(inputs.cloud-runner-label) }}
    timeout-minutes: 10
    continue-on-error: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1
        with:
          install-requirements: "true"
          extra-packages: "pip-licenses==4.5.1"
          cache-key-suffix: licenses
      - name: Check for copyleft
        run: |
          COPYLEFT="GPL-2.0-only,GPL-2.0-or-later,GPL-3.0-only,GPL-3.0-or-later,LGPL-2.1-only,LGPL-2.1-or-later,LGPL-3.0-only,LGPL-3.0-or-later,AGPL-3.0-only,AGPL-3.0-or-later"
          pip-licenses --format=markdown >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          pip-licenses --fail-on="$COPYLEFT" 2>&1 || {
            echo "::error::Copyleft license detected in dependencies"
            exit 1
          }

  commit-lint:
    name: "📝 Commit Lint"
    needs: changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ fromJSON(inputs.cloud-runner-label) }}
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Check PR title (Conventional Commits)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|chore|ci|test|refactor|style|perf|revert)(\(.+\))?: .+'
          if ! echo "$PR_TITLE" | grep -Eq "$PATTERN"; then
            echo "::warning::PR title does not follow Conventional Commits: '$PR_TITLE'"
            echo "Expected format: <type>(scope): description"
            echo "Valid types: feat fix docs chore ci test refactor style perf revert"
          else
            echo "✅ PR title follows Conventional Commits: '$PR_TITLE'"
          fi

  security:
    name: "🔐 Security"
    needs: changes
    if: ${{ (needs.changes.outputs.any_code == 'true' || needs.changes.outputs.ci == 'true') && needs.changes.outputs.light != 'true' }}
    permissions:
      actions: read            # CodeQL on private repos calls GET /actions/runs/{id} → needs actions:read (github/codeql-action#2117)
      contents: read
      security-events: write   # CodeQL upload (capped by caller's grant)
    uses: adza-group/shared-workflows/.github/workflows/reusable-security-scan.yml@v1
    with:
      python-version: ${{ inputs.python-version }}
      runner-label: ${{ inputs.cloud-runner-label }}
      run-dependency-review: ${{ inputs.run-dependency-review }}
      # CodeQL nur nightly + main/tags (Policy 2026-09-04, Stufe 6): GEMESSEN 183 s + 158 s
      # pro vollem Lauf, ohne GHAS advisory (SARIF-Artefakt + Zaehler bleiben). dispatch auf
      # main zaehlt als main. Reversibel: Zeile entfernen ⇒ Default true.
      run-codeql: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
      # Risk-Gating Stufe B (aktiv seit v1.10.5): risky-Pfad ⇒ dual-gated
      # Security-Steps (bandit) BLOCKING auch auf dev-Pushes.
      force-blocking: ${{ needs.changes.outputs.risky == 'true' }}
    secrets: inherit

  test-matrix:
    name: "🧪 Test"
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ${{ fromJSON(inputs.cloud-runner-label) }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.test-shards) }}
    services:
      postgres:
        image: postgres:${{ inputs.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data:rw
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Load test env
        env:
          TEST_ENV: ${{ inputs.test-env }}
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          # Services use DYNAMIC host ports (ports: [5432]/[6379], not fixed 5432:5432).
          # On self-hosted runners that share ONE Docker daemon, fixed ports collide
          # when shards run concurrently (M4). We rewrite the well-known ports in any
          # test-env value to the GHA-assigned ports. Transparent to apps, which keep
          # writing localhost:5432 / localhost:6379 in their test-env.
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          pg = os.environ.get('PG_PORT') or '5432'
          rd = os.environ.get('REDIS_PORT') or '6379'
          for k, v in json.loads(os.environ.get('TEST_ENV') or '{}').items():
              if isinstance(v, str):
                  v = (v.replace('localhost:5432', f'localhost:{pg}')
                        .replace('127.0.0.1:5432', f'127.0.0.1:{pg}')
                        .replace('localhost:6379', f'localhost:{rd}')
                        .replace('127.0.0.1:6379', f'127.0.0.1:{rd}'))
              print(f"{k}={v}")
          PY
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1
        with:
          # Der Test-Job ist der einzige, der App-Verhalten validiert — hier MUSS die
          # Python-Version die des Prod-Images sein. Vorher lief er stumm auf System-
          # python3 (3.13), waehrend die Images auf 3.14 bauen. Fehlt der Interpreter,
          # warnt das Composite laut statt still abzuweichen.
          python-version: ${{ inputs.python-version }}
          install-requirements: "true"
          install-system-deps: ${{ inputs.install-system-deps }}
          install-coverage: "true"
          cache-key-suffix: test-${{ matrix.shard.name }}
      - uses: adza-group/shared-workflows/.github/actions/run-pytest-shard@v1
        with:
          shard-name: ${{ matrix.shard.name }}
          test-paths: ${{ matrix.shard.paths }}
          markers: ${{ matrix.shard.markers || '' }}
          coverage-source: ${{ matrix.shard.cov || '.' }}

  coverage:
    name: "📊 Coverage Gate"
    needs: test-matrix
    if: ${{ always() && needs.test-matrix.result == 'success' }}
    runs-on: ${{ fromJSON(inputs.cloud-runner-label) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1
        with:
          install-requirements: "false"
          install-coverage: "true"
          cache-key-suffix: coverage
      - uses: adza-group/shared-workflows/.github/actions/coverage-gate@v1
        with:
          threshold: ${{ inputs.coverage-threshold }}
          blocking: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          # Tag-Pushes: Diff-Coverage AUS (0). Ein Release-Tag zeigt auf den main-Commit,
          # der Diff gegen origin/main ist leer — das Gate haette dort nur blockieren oder
          # vakuum-gruen sein koennen (Codex-Fund R1-E2). Der Code wurde auf main gemessen.
          diff-coverage-threshold: ${{ startsWith(github.ref, 'refs/tags/') && 0 || inputs.diff-coverage-threshold }}
          # Audit 2026-09-03 (Fund B): auf main-PUSHES ist origin/main == HEAD → leerer Diff →
          # diff-cover Exit 0 (GEMESSEN) → das einzige blocking Gate konnte nie failen. Dort
          # jetzt gegen den Stand VOR dem Push (github.event.before); Composite lehnt einen
          # ungueltigen/identischen Ref auf blocking-Laeufen ab statt still gruen zu sein.
          diff-coverage-compare-branch: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && github.event.before || 'origin/main' }}
          diff-coverage-blocking: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

  test-results:
    name: "📋 Test Results"
    needs: test-matrix
    if: ${{ always() && needs.test-matrix.result != 'skipped' }}
    # Reines Reporting (publiziert Test-Zaehler). Der vorgelagerte Docker-Action-
    # Image-Pull (ghcr.io/enricomi/...) flaket gelegentlich und liegt VOR dem
    # step-level continue-on-error -> ohne Job-level CoE roetet ein Reporting-
    # Hiccup die ganze Pipeline, obwohl Tests/Build/Deploy gruen sind.
    continue-on-error: true
    runs-on: ${{ fromJSON(inputs.cloud-runner-label) }}
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: junit-*
          path: junit
          merge-multiple: true
      # composite-Variante (kein Docker-Pull): die Container-Action zog ihr Image
      # vom Runner-Daemon, der waehrend des parallelen Build-Jobs mit dem
      # repo-scoped GITHUB_TOKEN bei ghcr.io eingeloggt ist -> Pulls FREMDER
      # public Namespaces antworten dann "denied" (Incident rechnungsapp
      # Run 28578768052, Job im Build-Login-Fenster 09:22:18-09:26:59).
      - uses: EnricoMi/publish-unit-test-result-action/composite@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        continue-on-error: true
        with:
          junit_files: "junit/junit-*.xml"
          comment_mode: "off"

      # 🎲 Flake Radar — aggregate the per-shard rerun-then-pass signals emitted by
      # run-pytest-shard into one report + step-summary. Compares expected shards (from
      # test-shards) to reported ones, so a missing/crashed shard cannot read as "no
      # flakes" (lügen-grün). Observe-only, and the job is already continue-on-error →
      # this can never change the pipeline outcome.
      - name: Download flake reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          pattern: flakes-*
          path: flakes
          merge-multiple: true
      - name: Flake radar (aggregate + summary)
        continue-on-error: true
        shell: bash
        env:
          TEST_SHARDS: ${{ inputs.test-shards }}
        run: |
          python3 - <<'PY'
          import glob, json, os
          # Expected shard names come from the caller's test-shards input (this job sees it).
          # Comparing them to what actually reported prevents a crashed shard reading as green.
          try:
              expected = {s.get("name", "") for s in json.loads(os.environ.get("TEST_SHARDS") or "[]")}
          except Exception:
              expected = set()
          expected.discard("")
          files = sorted(glob.glob("flakes/flakes-*.json"))
          reported = set()
          parse_err = 0
          agg = {}
          for fp in files:
              try:
                  d = json.load(open(fp, encoding="utf-8"))
                  if not isinstance(d, dict):
                      raise ValueError("not a json object")
              except Exception:
                  parse_err += 1
                  continue
              name = d.get("shard", "") or os.path.basename(fp)[len("flakes-"):-len(".json")]
              reported.add(name)
              for f in d.get("flaky", []):
                  k = (f.get("nodeid", ""), f.get("shard", ""))
                  agg[k] = agg.get(k, 0) + int(f.get("reruns", 0))
          missing = sorted(expected - reported) if expected else []
          report = {
              "shards_expected": sorted(expected),
              "shards_reported": sorted(reported),
              "shards_missing": missing,
              "parse_errors": parse_err,
              "flaky_count": len(agg),
              "total_reruns": sum(agg.values()),
              "flaky": [{"nodeid": k[0], "shard": k[1], "reruns": v}
                        for k, v in sorted(agg.items(), key=lambda x: -x[1])],
          }
          with open("flake-report.json", "w", encoding="utf-8") as f:
              json.dump(report, f, indent=2)
          n_rep = len(reported)
          n_exp = len(expected) if expected else n_rep
          lines = ["## 🎲 Flake Radar", ""]
          if not files:
              lines.append("_No flake data emitted by shards this run._")
          else:
              note = f"  ⚠️ {parse_err} unreadable" if parse_err else ""
              lines.append(f"- Shards analyzed: **{n_rep}/{n_exp}**{note}")
              if missing:
                  ms = ", ".join("`" + m + "`" for m in missing)
                  lines.append(f"- ⚠️ **Missing shard reports:** {ms} — result below is partial")
              if not agg:
                  if missing:
                      lines.append(f"- **No flakes in {n_rep}/{n_exp} analyzed shards** (rest missing — not a clean bill)")
                  else:
                      lines.append("- ✅ **No flaky tests this run**")
              else:
                  lines.append(f"- 🎲 **{len(agg)} flaky test(s)** — passed only after a rerun:")
                  lines += ["", "| Test | Shard | Reruns |", "|------|-------|--------|"]
                  for k, v in sorted(agg.items(), key=lambda x: -x[1]):
                      lines.append(f"| `{k[0]}` | {k[1]} | {v} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("\n".join(lines) + "\n")
          PY
      - name: Upload flake report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        continue-on-error: true
        with:
          name: flake-report
          path: flake-report.json
          retention-days: 90
          if-no-files-found: ignore

      # 🔬 TIA-observe VERDICT: hätte die (nie aktive) Test-Auswahl die tatsächlich
      # roten Tests enthalten? Misst die False-Negative-Rate der Heuristik über
      # echte Läufe, BEVOR je ein Test deselektiert wird. Rote Tests kommen exakt
      # (nodeids) aus den flakes-Artefakten des Radar-Plugins.
      - name: Download TIA observe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          name: tia-observe
          path: tia
      - name: TIA observe verdict
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, json, os
          try:
              tia = json.load(open("tia/tia-observe.json", encoding="utf-8"))
          except Exception:
              raise SystemExit(0)  # kein Observe-Datensatz (dispatch/main/…) — nichts zu prüfen
          failed = set()
          for fp in glob.glob("flakes/flakes-*.json"):
              try:
                  d = json.load(open(fp, encoding="utf-8"))
                  failed.update(d.get("failed", []) if isinstance(d, dict) else [])
              except Exception:
                  pass
          lines = []
          if tia.get("mode") != "selected":
              lines.append(f"Verdict: n/a — Heuristik wäre '{tia.get('mode')}' gelaufen ({tia.get('reason','')})")
          elif not failed:
              lines.append(f"Verdict: keine roten Tests — Auswahl-Genauigkeit diese Runde nicht messbar (hätte {len(tia.get('selected_tests', []))} Testdatei(en) gewählt)")
          else:
              sel = set(tia.get("selected_tests", []))
              missed = sorted({n.split("::")[0] for n in failed} - sel)
              if missed:
                  ms = ", ".join(f"`{m}`" for m in missed)
                  lines.append(f"Verdict: ❌ Heuristik hätte rote Testdatei(en) VERPASST: {ms} — Aktivierung wäre falsch gewesen (genau dafür ist observe-only da)")
              else:
                  lines.append(f"Verdict: ✅ Auswahl hätte alle {len(failed)} roten Tests enthalten")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          # Stufe E: maschinenlesbarer Verdict fuer den TIA-Ledger in pipeline-analytics.
          # Vollstaendigkeit (Codex-Fund E1): fehlt ein Shard-Report oder ist einer unlesbar,
          # koennte genau dort der uebersehene Fehler liegen ⇒ complete=false, Ledger ignoriert.
          try:
              rep = json.load(open("flake-report.json", encoding="utf-8"))
          except Exception:
              rep = {}
          missing = rep.get("shards_missing", []); perr = int(rep.get("parse_errors", 0) or 0)
          reported = rep.get("shards_reported", [])
          complete = bool(reported) and not missing and perr == 0
          sel = set(tia.get("selected_tests", []))
          failed_files = sorted({n.split("::")[0] for n in failed})
          json.dump({
              "mode": tia.get("mode"), "reason": tia.get("reason", ""),
              "complete": complete, "shards_missing": missing, "parse_errors": perr,
              "changed": len(tia.get("changed", [])), "selected": sorted(sel),
              "failed_files": failed_files,
              "missed": sorted(set(failed_files) - sel) if tia.get("mode") == "selected" else [],
          }, open("tia-verdict.json", "w", encoding="utf-8"), indent=2)
          PY
      - name: Upload TIA verdict (ledger source)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        continue-on-error: true
        with:
          name: tia-verdict
          path: tia-verdict.json
          retention-days: 90
          if-no-files-found: ignore

  property-tests:
    name: "🔬 Property Tests"
    needs: changes
    if: ${{ inputs.enable-property-tests && (needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true') && needs.changes.outputs.light != 'true' }}
    runs-on: ${{ fromJSON(inputs.cloud-runner-label) }}
    timeout-minutes: 15
    # Risk-Gating: bei risky-Pfaden BLOCKING, sonst advisory wie bisher (auch auf
    # main — das bestehende main-Verhalten wird bewusst NICHT stillschweigend
    # verschärft; ein risky dev→main-Merge-Diff härtet dagegen schon auf dev).
    continue-on-error: ${{ needs.changes.outputs.risky != 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1
        with:
          install-requirements: "true"
          # install-coverage liefert pytest (via pytest-cov) + pytest-timeout — noetig,
          # weil ein Caller-Repo OHNE requirements.txt (z.B. der Smoke) sonst gar kein
          # pytest im venv hat (rc=127, Job war chronisch rot) und --timeout unten das
          # timeout-Plugin braucht. Identisches Paket-Set wie der test-matrix-Job.
          install-coverage: "true"
          extra-packages: "hypothesis==6.163.0"
          cache-key-suffix: hypothesis
      - name: Run Hypothesis tests
        run: |
          # Collection-Exitcode trennen: 5 = keine Tests (skip), 0 = Tests da, sonst =
          # kaputt (fail). Vorher verschluckte 2>/dev/null einen Import-/Collection-Fehler
          # → grün als "keine Tests". (Audit P3 Lügen-Grün)
          set +e
          pytest tests/ -m "hypothesis" --collect-only -q >/tmp/hypo-collect.txt 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 5 ]; then
            echo "::notice::no @hypothesis.given tests found — skipping"
            exit 0
          elif [ "$rc" -ne 0 ]; then
            cat /tmp/hypo-collect.txt
            echo "::error::pytest collection failed (rc=$rc) — Testsammlung kaputt, nicht 'keine Tests'"
            exit 1
          fi
          pytest tests/ -m "hypothesis" --hypothesis-seed=0 --timeout=60 -p no:cacheprovider

  mutation:
    name: "🧬 Mutation (incremental)"
    needs: [changes, test-matrix]
    if: ${{ inputs.enable-mutation && needs.test-matrix.result == 'success' && needs.changes.outputs.python == 'true' }}
    permissions:
      contents: read
    uses: adza-group/shared-workflows/.github/workflows/reusable-mutation.yml@v1
    with:
      mode: incremental
      base-ref: main
      runner-label: ${{ inputs.cloud-runner-label }}
    secrets: inherit

  api-contract:
    name: "📑 API Contract"
    needs: [changes]
    if: ${{ inputs.openapi-spec != '' }}
    permissions:
      contents: read
    uses: adza-group/shared-workflows/.github/workflows/reusable-api-contract.yml@v1
    with:
      openapi-spec: ${{ inputs.openapi-spec }}
      base-url: ${{ inputs.api-base-url }}
      boot-command: ${{ inputs.api-boot-command }}
      health-url: ${{ inputs.api-health-url }}
      requirements: ${{ inputs.api-requirements }}
      runner-label: ${{ inputs.cloud-runner-label }}
    secrets: inherit

  e2e:
    name: "🎭 E2E"
    needs: [changes, test-matrix]
    if: >-
      ${{ inputs.enable-e2e && inputs.e2e-boot-command != '' &&
      needs.test-matrix.result == 'success' &&
      (needs.changes.outputs.python == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true') }}
    permissions:
      contents: read
    uses: adza-group/shared-workflows/.github/workflows/reusable-e2e.yml@v1
    with:
      runner-label: ${{ inputs.runner-label }}
      python-version: ${{ inputs.python-version }}
      postgres-version: ${{ inputs.postgres-version }}
      boot-command: ${{ inputs.e2e-boot-command }}
      health-url: ${{ inputs.e2e-health-url }}
      e2e-dir: ${{ inputs.e2e-dir }}
      e2e-command: ${{ inputs.e2e-command }}
      test-env: ${{ inputs.test-env }}
      install-system-deps: ${{ inputs.install-system-deps }}
    secrets: inherit

  frontend:
    name: "🎨 Frontend"
    needs: changes
    if: ${{ inputs.has-frontend && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true') }}
    permissions:
      contents: read
    uses: adza-group/shared-workflows/.github/workflows/reusable-frontend.yml@v1
    with:
      frontend-dir: ${{ inputs.frontend-dir }}
      runner-label: ${{ inputs.cloud-runner-label }}
      a11y-url: ${{ inputs.a11y-url }}
      a11y-paths: ${{ inputs.a11y-paths }}
      a11y-threshold: ${{ inputs.a11y-threshold }}
    secrets: inherit

  load-test:
    name: "📈 Load Test"
    needs: [verify-staging]
    if: >-
      ${{ always() && inputs.enable-load-test && inputs.staging-url != '' &&
      needs.verify-staging.result == 'success' }}
    permissions:
      contents: read
    uses: adza-group/shared-workflows/.github/workflows/reusable-load-test.yml@v1
    with:
      target-url: ${{ inputs.staging-url }}
      blocking: false
      runner-label: ${{ inputs.runner-label }}
    secrets: inherit

  dast:
    name: "🔓 DAST"
    needs: [verify-staging]
    if: >-
      ${{ always() && inputs.enable-dast && inputs.staging-url != '' &&
      needs.verify-staging.result == 'success' }}
    permissions:
      contents: read
    uses: adza-group/shared-workflows/.github/workflows/reusable-dast.yml@v1
    with:
      target-url: ${{ inputs.staging-url }}
      scan-type: baseline
      blocking: false
      runner-label: ${{ inputs.runner-label }}
    secrets: inherit

  docker-build:
    name: "🐳 Build"
    needs: [changes, lint-python, lint-dockerfile, test-matrix, security, coverage, e2e, branch-policy, property-tests, license-check]
    # HARD DEPLOY GATE (Audit 2026-07-16, P1): security + coverage gaten jetzt den
    # Build/Push. Vorher liefen sie nur PARALLEL — ein committetes Secret (gitleaks)
    # oder ein bandit-HIGH färbte den Run zwar rot, das Image ging aber trotzdem nach
    # GHCR und Watchtower zog es auf die (self-hosted) Prod-LXC.
    # fail-closed: security MUSS success sein; die EINZIGE erlaubte Skip-Quelle ist
    # light=='true' (dev-Push, CI-Diät v1.9.0) — jede andere Skip-/Fail-Ursache blockt.
    # Sicher, weil security (any_code||ci) und docker-build (any_code||docker||ci)
    # dieselbe Envelope teilen: any_code = python||docker||frontend schliesst docker
    # ein → security kann nie skippen, während docker-build läuft (ausser bei light).
    #
    # Audit 2026-09-03 (Funde A + X, Pair Claude+Codex, Beweis scripts/gate_matrix.py):
    # (X) Harte Gates pruefen auf success||skipped statt != 'failure' — unter always()
    #     liess `cancelled` (Teil-Cancel, Runner-Shutdown) den Build sonst durch.
    # (A) property-tests (BLOCKING bei risky) und license-check (BLOCKING auf main/
    #     tags) standen NICHT in needs: ihr Rot faerbte nur den Run, das Image war
    #     laengst gepusht und Watchtower hatte es gezogen. Jetzt gaten sie genau in
    #     dem Kontext, in dem sie hart sind; sonst bleiben sie advisory wie bisher
    #     (`|| risky != 'true'` bzw. `|| !main`), damit dev-Pushes nicht strenger
    #     werden. lint-dockerfile gleiches Muster (hart nur bei risky).
    # Invariante laeuft als Gate in actionlint.yml: kein Push, wenn ein hartes Gate
    # failure ODER cancelled ist — plus Happy-Path-Kontrolle gegen vakuum-gruen.
    if: >-
      ${{ always() &&
      (needs.lint-python.result == 'success' || needs.lint-python.result == 'skipped') &&
      (needs.lint-dockerfile.result == 'success' || needs.lint-dockerfile.result == 'skipped' ||
       needs.changes.outputs.risky != 'true') &&
      (needs.security.result == 'success' ||
       (needs.security.result == 'skipped' && needs.changes.outputs.light == 'true')) &&
      (needs.coverage.result == 'success' || needs.coverage.result == 'skipped') &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      (needs.branch-policy.result == 'success' || needs.branch-policy.result == 'skipped') &&
      (needs.test-matrix.result == 'success' || needs.test-matrix.result == 'skipped') &&
      (needs.property-tests.result == 'success' || needs.property-tests.result == 'skipped' ||
       needs.changes.outputs.risky != 'true') &&
      (needs.license-check.result == 'success' || needs.license-check.result == 'skipped' ||
       !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) &&
      (needs.changes.outputs.any_code == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.ci == 'true') }}
    permissions:
      contents: read
      packages: write       # GHCR push
      id-token: write        # cosign keyless OIDC
      attestations: write    # SLSA build provenance
    uses: adza-group/shared-workflows/.github/workflows/reusable-docker-build.yml@v1
    with:
      image-name: ${{ inputs.image-name != '' && inputs.image-name || format('ghcr.io/adza-group/{0}', inputs.app-name) }}
      push: ${{ inputs.enable-push && github.event_name == 'push' }}
      dockerfile: ${{ inputs.dockerfile }}
      context: ${{ inputs.docker-context }}
      sign-image: ${{ inputs.sign-image }}
      platforms: ${{ inputs.multi-arch && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
      allow-multiarch-rebuild: ${{ inputs.allow-multiarch-rebuild }}
      image-size-limit-mb: ${{ inputs.image-size-limit-mb }}
      runner-label: ${{ inputs.runner-label }}
      gated-promotion: ${{ inputs.gated-promotion }}
      # dev-Pushes (light): Image bauen + pushen (Staging braucht es), aber Trivy/SBOM/Sign
      # ueberspringen — ~90s je Push; die Verify-Gates greifen ohnehin nur main/staging.
      light: ${{ needs.changes.outputs.light == 'true' }}
    secrets: inherit

  verify-staging:
    name: "🔍 Verify Staging"
    environment: ${{ inputs.staging-environment }}
    needs: [docker-build]
    # enable-push ist Pflicht (Codex, Stufe 4): ein erfolgreicher Build OHNE Push beweist
    # keinen Deploy — verify-staging wuerde sonst gegen ein altes Staging pruefen.
    if: >-
      ${{ always() && inputs.staging-url != '' && inputs.deploy-prod && inputs.enable-push &&
      needs.docker-build.result == 'success' &&
      github.event_name == 'push' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: GHCR login
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install crane (pinned, sha256-verified)
        env:
          CRANE_VERSION: v0.22.0
          CRANE_SHA256: edb74d53fad9a596860f59d1c5d04a43dfb5f441dc71f57060dd0bf39483c833
        run: |
          curl -sSfL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" -o "$RUNNER_TEMP/crane.tgz"
          echo "${CRANE_SHA256}  $RUNNER_TEMP/crane.tgz" | sha256sum -c --quiet - || { echo "::error::crane checksum mismatch"; exit 1; }
          mkdir -p "$RUNNER_TEMP/crane-bin" && tar xz -C "$RUNNER_TEMP/crane-bin" -f "$RUNNER_TEMP/crane.tgz" crane
          echo "$RUNNER_TEMP/crane-bin" >> "$GITHUB_PATH"
      - uses: adza-group/shared-workflows/.github/actions/health-check@v1
        id: staging-check
        continue-on-error: true
        with:
          url: ${{ inputs.staging-url }}
          max-retries: "40"
          retry-delay: "30"
          check-security-headers: "true"
          version-url: ${{ inputs.staging-version-url }}
          expected-version: ${{ inputs.staging-version-url != '' && github.sha || '' }}

      - name: Auto-rollback on failure
        if: steps.staging-check.outcome == 'failure'
        env:
          IMAGE: ${{ inputs.image-name != '' && inputs.image-name || format('ghcr.io/adza-group/{0}', inputs.app-name) }}
        run: |
          echo "::warning::staging unhealthy — attempting rollback :staging-previous -> :staging"
          if SRC=$(crane digest "${IMAGE}:staging-previous" 2>/tmp/crane.err); then
            crane tag "${IMAGE}@${SRC}" staging
            echo "::warning::rollback applied (${SRC}) — watchtower will re-deploy :staging-previous on next poll"
          elif grep -qiE 'MANIFEST_UNKNOWN|manifest unknown|NAME_UNKNOWN' /tmp/crane.err; then
            echo "::warning::no :staging-previous tag found — rollback skipped"
          else
            echo "::error::crane digest :staging-previous failed (registry/auth?) — rollback NOT attempted, backup may exist"; cat /tmp/crane.err
          fi

      - name: Fail on staging unhealthy
        if: steps.staging-check.outcome == 'failure'
        run: exit 1

  require-staging-green:
    name: "🚦 Require Staging Green"
    needs: [verify-staging]
    # Nur bei push gaten: verify-staging läuft ausschliesslich bei push (s.o.) —
    # bei schedule/workflow_dispatch wäre das Ergebnis immer "skipped" und das
    # Gate riss jede Nightly grundlos rot (footballapp Nightly 2026-07-21).
    if: >-
      ${{ always() && inputs.staging-url != '' && inputs.deploy-prod &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 5
    steps:
      - name: Gate on staging health
        run: |
          if [ "${{ needs.verify-staging.result }}" != "success" ]; then
            echo "::error::staging not green (result: ${{ needs.verify-staging.result }}) — blocking main push"
            exit 1
          fi
          echo "✅ staging verified green — prod push allowed"

  promote-prod:
    name: "🚀 Promote Prod"
    needs: [docker-build, require-staging-green]
    if: >-
      ${{ always() && inputs.gated-promotion && inputs.deploy-prod &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.docker-build.result == 'success' &&
      needs.require-staging-green.result == 'success' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: GHCR login
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install crane (pinned, sha256-verified)
        env:
          CRANE_VERSION: v0.22.0
          CRANE_SHA256: edb74d53fad9a596860f59d1c5d04a43dfb5f441dc71f57060dd0bf39483c833
        run: |
          curl -sSfL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" -o "$RUNNER_TEMP/crane.tgz"
          echo "${CRANE_SHA256}  $RUNNER_TEMP/crane.tgz" | sha256sum -c --quiet - || { echo "::error::crane checksum mismatch"; exit 1; }
          mkdir -p "$RUNNER_TEMP/crane-bin" && tar xz -C "$RUNNER_TEMP/crane-bin" -f "$RUNNER_TEMP/crane.tgz" crane
          echo "$RUNNER_TEMP/crane-bin" >> "$GITHUB_PATH"
      # Audit 2026-09-03 (Fund 6): kein continue-on-error — ein fehlgeschlagenes Backup
      # blockt die Promotion, sonst rollt verify-prod spaeter auf ein veraltetes :previous.
      # "Tag fehlt" (erster gated Run) wird explizit von "inspect fehlgeschlagen" getrennt.
      - name: "Backup :latest -> :previous"
        env:
          IMAGE: ${{ inputs.image-name != '' && inputs.image-name || format('ghcr.io/adza-group/{0}', inputs.app-name) }}
        run: |
          if ! SRC=$(crane digest "${IMAGE}:latest" 2>/tmp/crane.err); then
            if grep -qiE 'MANIFEST_UNKNOWN|manifest unknown|NAME_UNKNOWN' /tmp/crane.err; then
              echo "::notice::no existing :latest to back up (first gated run)"; exit 0
            fi
            echo "::error::crane digest ${IMAGE}:latest failed — Backup unklar, Promotion geblockt"; cat /tmp/crane.err; exit 1
          fi
          crane tag "${IMAGE}@${SRC}" previous
          [ "$(crane digest "${IMAGE}:previous")" = "$SRC" ] || { echo "::error::backup :previous digest mismatch"; exit 1; }
          echo "::notice::backed up :latest -> :previous (${SRC})"
      - name: "Promote :candidate -> :latest (byte-identical via crane)"
        env:
          IMAGE: ${{ inputs.image-name != '' && inputs.image-name || format('ghcr.io/adza-group/{0}', inputs.app-name) }}
          CANDIDATE: ${{ needs.docker-build.outputs.candidate-tag }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$CANDIDATE" ]; then
            CANDIDATE="${IMAGE}:candidate-${SHA}"
            echo "::notice::candidate-tag output empty — reconstructed ${CANDIDATE}"
          fi
          SRC=$(crane digest "$CANDIDATE")
          # Digest-Stabilitaet HART an einem nicht deployenden Tag beweisen (Codex R1-B1),
          # danach :latest als LETZTE Mutation mit Soft-Check — ein roter Promote-Job hat
          # dann nie :latest bewegt (Registry-Grundunsicherheit bleibt, s. docker-build).
          crane tag "${IMAGE}@${SRC}" promote-verify
          PV=$(crane digest "${IMAGE}:promote-verify")
          [ "$PV" = "$SRC" ] || { echo "::error::promote-verify resolved to ${PV}, expected ${SRC} — :latest NOT touched"; exit 1; }
          echo "digest=$SRC" >> "$GITHUB_OUTPUT"
          crane tag "${IMAGE}@${SRC}" latest   # letzte mutierende Operation
          crane digest "${IMAGE}:latest" 2>/dev/null | grep -qx "$SRC" \
            || echo "::warning::post-check of :latest inconclusive (tag was set; verify manually if unsure)"
          echo "::notice::promoted ${CANDIDATE} (${SRC}) -> ${IMAGE}:latest — watchtower deploys prod on next poll"

  verify-prod:
    name: "✅ Verify Prod"
    environment: ${{ inputs.prod-environment }}
    needs: [docker-build, require-staging-green, promote-prod]
    # Nur bei push (Codex, Stufe 4): bei schedule/dispatch auf main wird nichts deployt —
    # ein Health-Flake haette dann :previous ueber :latest gerollt, ohne dass ein neues
    # Image dahinterstand (footballapp Nightly laeuft auf main).
    if: >-
      ${{ always() && inputs.prod-url != '' && inputs.deploy-prod && inputs.enable-push &&
      needs.docker-build.result == 'success' &&
      (needs.promote-prod.result == 'success' || (!inputs.gated-promotion && needs.promote-prod.result == 'skipped')) &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: GHCR login
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install crane (pinned, sha256-verified)
        env:
          CRANE_VERSION: v0.22.0
          CRANE_SHA256: edb74d53fad9a596860f59d1c5d04a43dfb5f441dc71f57060dd0bf39483c833
        run: |
          curl -sSfL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" -o "$RUNNER_TEMP/crane.tgz"
          echo "${CRANE_SHA256}  $RUNNER_TEMP/crane.tgz" | sha256sum -c --quiet - || { echo "::error::crane checksum mismatch"; exit 1; }
          mkdir -p "$RUNNER_TEMP/crane-bin" && tar xz -C "$RUNNER_TEMP/crane-bin" -f "$RUNNER_TEMP/crane.tgz" crane
          echo "$RUNNER_TEMP/crane-bin" >> "$GITHUB_PATH"
      - uses: adza-group/shared-workflows/.github/actions/health-check@v1
        id: prod-check
        continue-on-error: true
        with:
          url: ${{ inputs.prod-url }}
          max-retries: "40"
          retry-delay: "30"
          version-url: ${{ inputs.prod-version-url }}
          expected-version: ${{ inputs.prod-version-url != '' && github.sha || '' }}

      - name: Auto-rollback on failure
        if: steps.prod-check.outcome == 'failure'
        env:
          IMAGE: ${{ inputs.image-name != '' && inputs.image-name || format('ghcr.io/adza-group/{0}', inputs.app-name) }}
        run: |
          echo "::warning::prod unhealthy — attempting rollback :previous → :latest"
          if SRC=$(crane digest "${IMAGE}:previous" 2>/tmp/crane.err); then
            crane tag "${IMAGE}@${SRC}" latest
            echo "::warning::rollback applied (${SRC}) — watchtower will re-deploy :previous on next poll"
          elif grep -qiE 'MANIFEST_UNKNOWN|manifest unknown|NAME_UNKNOWN' /tmp/crane.err; then
            echo "::warning::no :previous tag found — rollback skipped"
          else
            echo "::error::crane digest :previous failed (registry/auth?) — rollback NOT attempted, backup may exist"; cat /tmp/crane.err
          fi

      - name: Open incident issue on failure
        if: steps.prod-check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP: ${{ inputs.app-name }}
          PROD_URL: ${{ inputs.prod-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "🚨 Prod verify failed — ${APP} @ ${GITHUB_SHA:0:7}" \
            --body "## Prod health check failed
          App: \`${APP}\`
          URL: ${PROD_URL}
          SHA: ${GITHUB_SHA}
          Run: ${RUN_URL}" \
            --label "incident,production" || true

      - name: Fail on prod unhealthy
        if: steps.prod-check.outcome == 'failure'
        run: exit 1

  prune-ghcr:
    name: "🧹 Prune GHCR"
    needs: [docker-build, verify-staging, verify-prod]
    if: >-
      ${{ always() && (inputs.enable-ghcr-prune || inputs.enable-candidate-prune) && github.event_name == 'push' &&
      needs.docker-build.result == 'success' &&
      needs.verify-staging.result != 'failure' &&
      needs.verify-prod.result != 'failure' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Delete untagged versions
        if: ${{ inputs.enable-ghcr-prune }}
        continue-on-error: true
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55  # v5.0.0
        with:
          package-name: ${{ inputs.app-name }}
          package-type: container
          delete-only-untagged-versions: "true"
      - name: Delete stale candidate versions (referenced-safe)
        if: ${{ inputs.enable-candidate-prune }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ inputs.image-name != '' && inputs.image-name || format('ghcr.io/adza-group/{0}', inputs.app-name) }}
        run: |
          # ghcr.io/<owner>/<pkg...> -> owner + url-encoded package path
          OWNER=$(echo "$IMAGE" | cut -d/ -f2)
          PKG=$(echo "$IMAGE" | cut -d/ -f3- | sed 's|/|%2F|g')
          CUTOFF=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          BASE="/orgs/${OWNER}/packages/container/${PKG}"
          gh api "${BASE}/versions?per_page=100" --paginate > /tmp/vers.json 2>/dev/null \
            || { BASE="/users/${OWNER}/packages/container/${PKG}"; gh api "${BASE}/versions?per_page=100" --paginate > /tmp/vers.json; }
          # Safety-Annahme (load-bearing): imagetools create --tag :latest :candidate-<sha>
          # erzeugt den SELBEN OCI-Manifest-Digest -> GHCR fuehrt beide Tags an EINER Version.
          # Empirisch verifiziert: RecyclageApp Pilot Run #391 (2026-06-10, Digest 4e8fa99f).
          # Vor Aktivierung auf neuen Apps: in GHCR pruefen, dass die promotete Version
          # candidate-* UND latest am selben Eintrag traegt.
          # Loeschregel: aelter als CUTOFF, hat Tags, ALLE Tags matchen candidate-*/main-<sha>,
          # KEIN Tag aus dem Schutz-Set (Gurt+Hosentraeger zur Regex).
          jq -r --arg cutoff "$CUTOFF" '
            .[] | select(.created_at < $cutoff)
            | select((.metadata.container.tags | length) > 0)
            | select([.metadata.container.tags[] | test("^(candidate-[0-9a-f]+|main-[0-9a-f]{7,40})$")] | all)
            | select([.metadata.container.tags[] | IN("latest","previous","staging","staging-previous","main","dev")] | any | not)
            | "\(.id)\t\(.metadata.container.tags | join(","))"' /tmp/vers.json > /tmp/prune.list
          COUNT=$(grep -c . /tmp/prune.list || true)
          echo "## 🧹 Candidate-Prune (${COUNT} versions)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${COUNT:-0}" = "0" ]; then echo "::notice::no stale candidate versions"; exit 0; fi
          while IFS=$'\t' read -r ID TAGS; do
            echo "deleting version ${ID} (${TAGS})"
            echo "| ${ID} | ${TAGS} |" >> "$GITHUB_STEP_SUMMARY"
            gh api -X DELETE "${BASE}/versions/${ID}"
          done < /tmp/prune.list

  telemetry:
    name: "📈 Telemetry"
    needs: [changes, lint-python, lint-dockerfile, code-quality, dead-code, todo-tracker, license-check, commit-lint, security, test-matrix, property-tests, mutation, api-contract, e2e, frontend, coverage, test-results, docker-build, branch-policy, verify-staging, require-staging-green, promote-prod, verify-prod, load-test, pr-summary, dast, prune-ghcr]
    if: ${{ always() }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 5
    steps:
      - name: Summary
        env:
          APP: ${{ inputs.app-name }}
          START: ${{ needs.changes.outputs.start_time }}
        run: |
          NOW=$(date +%s)
          DUR=$(( NOW - ${START:-$NOW} ))
          {
            echo "## 🚀 CI Telemetry — ${APP}"
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| lint-python | ${{ needs.lint-python.result }} |"
            echo "| branch-policy | ${{ needs.branch-policy.result }} |"
            echo "| security | ${{ needs.security.result }} |"
            echo "| test-matrix | ${{ needs.test-matrix.result }} |"
            echo "| e2e | ${{ needs.e2e.result }} |"
            echo "| coverage | ${{ needs.coverage.result }} |"
            echo "| test-results | ${{ needs.test-results.result }} |"
            echo "| docker-build | ${{ needs.docker-build.result }} |"
            echo "| lint-dockerfile | ${{ needs.lint-dockerfile.result }} |"
            echo "| code-quality | ${{ needs.code-quality.result }} |"
            echo "| dead-code | ${{ needs.dead-code.result }} |"
            echo "| property-tests | ${{ needs.property-tests.result }} |"
            echo "| mutation | ${{ needs.mutation.result }} |"
            echo "| frontend | ${{ needs.frontend.result }} |"
            echo "| verify-staging | ${{ needs.verify-staging.result }} |"
            echo "| promote-prod | ${{ needs.promote-prod.result }} |"
            echo "| verify-prod | ${{ needs.verify-prod.result }} |"
            echo "| dast | ${{ needs.dast.result }} |"
            echo "| **wall-clock** | **${DUR}s** |"
          } >> "$GITHUB_STEP_SUMMARY"

  pr-summary:
    name: "📝 PR Summary"
    needs: [lint-python, security, test-matrix, coverage, docker-build]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post/update sticky CI summary comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          APP: ${{ inputs.app-name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="## 🚀 CI Summary — \`${APP}\`
          | Job | Result |
          |-----|--------|
          | lint | ${{ needs.lint-python.result }} |
          | security | ${{ needs.security.result }} |
          | tests | ${{ needs.test-matrix.result }} |
          | coverage | ${{ needs.coverage.result }} |
          | docker | ${{ needs.docker-build.result }} |

          [View run](${RUN_URL})"
          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.body | startswith("## 🚀 CI Summary"))] | .[0].id // empty' 2>/dev/null || echo "")
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" -X PATCH -f body="$BODY" >/dev/null
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$BODY" >/dev/null
          fi

  notify:
    name: "🚨 Notify"
    # Notify-Intelligenz (Lane B): läuft IMMER, meldet aber nur ZUSTANDS-ÜBERGÄNGE
    # (grün→rot Alarm, rot→grün Recovery; Dauer-Rot/Dauer-Grün still). Der
    # Orchestrator berechnet hier den EINEN Pipeline-Status aus ALLEN blockierenden
    # Jobs (Codex-Review: vorher fehlten branch-policy/verify-prod/promote — ein
    # rotes Prod-Verify wäre als success durchgerutscht); die Transition-Logik
    # sitzt in reusable-notify. cancelled bleibt still (weder Alarm noch Recovery).
    # license-check ist dual-gated (blocking auf main/tags!) — ohne ihn in needs
    # wäre ein rotes main-Lizenz-Gate als success gemeldet worden (Codex-Fund R1).
    needs: [changes, branch-policy, lint-python, lint-dockerfile, license-check, security, test-matrix, coverage, property-tests, e2e, api-contract, frontend, docker-build, verify-staging, require-staging-green, promote-prod, verify-prod, dast, load-test]
    if: ${{ always() && needs.changes.result != 'skipped' }}
    permissions:
      contents: read
      actions: read   # Transition-Detektor liest die Run-Historie (voriger Lauf gleicher Branch+Event)
    # Input-Satz ist identisch mit der alten notify (@v1-flip-sicher); die neue
    # Transition-Logik wird mit dem @v1-Move selbst aktiv.
    uses: adza-group/shared-workflows/.github/workflows/reusable-notify.yml@v1
    with:
      app-name: ${{ inputs.app-name }}
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
      branch: ${{ github.ref_name }}
      sha: ${{ github.sha }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      runner-label: ${{ inputs.runner-label }}
    secrets: inherit
