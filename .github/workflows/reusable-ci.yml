# ═══════════════════════════════════════════════════════════════
# Reusable CI Orchestrator (CORE) — ADZA-Group
#
# The one canonical pipeline. Apps call this with ~10 inputs.
# CORE: changes → lint-python + security → pytest-matrix →
#       coverage + test-results → docker-build → telemetry.
# Composites + sub-reusables referenced by full path @dev (→ @v1 at release).
#
# Usage (app build.yml):
#   jobs:
#     ci:
#       uses: adza-group/shared-workflows/.github/workflows/reusable-ci.yml@v1
#       with:
#         app-name: rechnungsapp
#         coverage-threshold: 49
#         test-shards: >-
#           [{"name":"backend","paths":"tests/test_models.py tests/test_auth.py"},
#            {"name":"integration","paths":"tests/integration/"}]
#         test-env: '{"RECHNUNG_TESTING":"1","RECHNUNG_DATABASE_URL":"postgresql://postgres:postgres@localhost:5432/test"}'
#       secrets: inherit
# ═══════════════════════════════════════════════════════════════

name: "🚀 CI"

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      runner-label:
        required: false
        type: string
        default: '["self-hosted", "linux", "proxmox"]'
      python-version:
        required: false
        type: string
        default: "3.11"
      test-shards:
        required: true
        type: string
        description: 'JSON array of {name, paths, markers?, cov?}'
      test-env:
        required: false
        type: string
        default: "{}"
        description: "JSON of env vars for test jobs (include the DB URL here)"
      coverage-threshold:
        required: false
        type: number
        default: 50
      postgres-version:
        required: false
        type: string
        default: "16-alpine"
      enable-redis:
        required: false
        type: boolean
        default: false
        description: "Reserved — a redis service is always provided to test jobs; accepted for caller compatibility"
      install-system-deps:
        required: false
        type: boolean
        default: false
      image-name:
        required: false
        type: string
        default: ""
      image-size-limit-mb:
        required: false
        type: number
        default: 800
      multi-arch:
        required: false
        type: boolean
        default: false
      sign-image:
        required: false
        type: boolean
        default: true
      enable-push:
        required: false
        type: boolean
        default: true
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"
      docker-context:
        required: false
        type: string
        default: "."
      has-frontend:
        required: false
        type: boolean
        default: false
        description: "Enable frontend lane (reusable-frontend.yml)"
      frontend-dir:
        required: false
        type: string
        default: "frontend"
      enable-property-tests:
        required: false
        type: boolean
        default: true
      enable-mutation:
        required: false
        type: boolean
        default: true
      enable-load-test:
        required: false
        type: boolean
        default: false
      staging-url:
        required: false
        type: string
        default: ""
        description: "Staging health-check URL (empty = skip deploy-tail)"
      prod-url:
        required: false
        type: string
        default: ""
        description: "Prod health-check URL (empty = skip verify-prod)"
      deploy-prod:
        required: false
        type: boolean
        default: true
        description: "Master switch for prod push+verify (set false to disable)"
      enable-dast:
        required: false
        type: boolean
        default: false
        description: "Enable DAST scan after staging verify (wired in Cycle B)"

permissions:
  contents: read

jobs:
  changes:
    name: "🔍 Detect Changes"
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # dorny/paths-filter queries the API; without this → "Resource not accessible by integration"
    outputs:
      python: ${{ steps.filter.outputs.python }}
      docker: ${{ steps.filter.outputs.docker }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci: ${{ steps.filter.outputs.ci }}
      any_code: ${{ steps.filter.outputs.python == 'true' || steps.filter.outputs.docker == 'true' || steps.filter.outputs.frontend == 'true' }}
      start_time: ${{ steps.t.outputs.epoch }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0   # paths-filter diffs locally via git (avoids restricted compare API → "Resource not accessible")
      - id: t
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        with:
          filters: |
            python:
              - '**/*.py'
              - 'requirements*.txt'
              - 'pytest.ini'
              - '.coveragerc'
            docker:
              - 'Dockerfile'
              - 'docker-compose*.yml'
            frontend:
              - 'frontend/**'
            ci:
              - '.github/**'

  lint-python:
    name: "🐍 Lint (ruff)"
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1.3.1
        with:
          install-requirements: "false"
          extra-packages: "ruff==0.*"
          cache-key-suffix: lint
      - name: Ruff
        run: |
          ruff check . --output-format=github
          ruff format --check --diff .

  lint-dockerfile:
    name: "🐳 Lint Dockerfile"
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 5
    continue-on-error: true   # advisory (incl. main) — hadolint findings inform, don't block the pipeline
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install hadolint v2.12.0
        run: |
          curl -sSfL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint
      - name: Lint
        run: |
          [ -f "${{ inputs.dockerfile }}" ] || { echo "::notice::no Dockerfile at ${{ inputs.dockerfile }} — skipping"; exit 0; }
          hadolint "${{ inputs.dockerfile }}" --format tty

  code-quality:
    name: "📊 Code Quality"
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1.3.1
        with:
          install-requirements: "false"
          extra-packages: "radon==6.*"
          cache-key-suffix: radon
      - name: Radon complexity
        run: |
          {
            echo "## 📊 Code Quality (radon)"
            echo '```'
            radon cc . -a -nb --exclude "tests,__pycache__,.venv" 2>/dev/null || echo "(no Python source found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          radon cc . -a -nb --exclude "tests,__pycache__,.venv" 2>/dev/null || true

  dead-code:
    name: "💀 Dead Code"
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1.3.1
        with:
          install-requirements: "false"
          extra-packages: "vulture==2.*"
          cache-key-suffix: vulture
      - name: Vulture scan
        run: |
          {
            echo "## 💀 Dead Code (vulture)"
            echo '```'
            vulture . --min-confidence 80 --exclude tests,__pycache__,.venv 2>/dev/null || echo "(no issues or no source)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          vulture . --min-confidence 80 --exclude tests,__pycache__,.venv 2>/dev/null || true

  todo-tracker:
    name: "📌 TODOs"
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Count open TODOs
        run: |
          COUNT=$(grep -rn --include="*.py" "TODO\|FIXME\|HACK\|XXX" . 2>/dev/null | grep -v ".venv" | wc -l || echo 0)
          {
            echo "## 📌 TODO Tracker"
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Open TODO/FIXME/HACK/XXX | ${COUNT} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -gt 0 ]; then
            {
              echo ""
              echo "<details><summary>Show items</summary>"
              echo ""
              echo '```'
              grep -rn --include="*.py" "TODO\|FIXME\|HACK\|XXX" . 2>/dev/null | grep -v ".venv" | head -50
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  license-check:
    name: "⚖️ Licenses"
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    continue-on-error: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1.3.1
        with:
          install-requirements: "true"
          extra-packages: "pip-licenses==4.*"
          cache-key-suffix: licenses
      - name: Check for copyleft
        run: |
          COPYLEFT="GPL-2.0-only,GPL-2.0-or-later,GPL-3.0-only,GPL-3.0-or-later,LGPL-2.1-only,LGPL-2.1-or-later,LGPL-3.0-only,LGPL-3.0-or-later,AGPL-3.0-only,AGPL-3.0-or-later"
          pip-licenses --format=markdown >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          pip-licenses --fail-on="$COPYLEFT" 2>&1 || {
            echo "::error::Copyleft license detected in dependencies"
            exit 1
          }

  commit-lint:
    name: "📝 Commit Lint"
    needs: changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Check PR title (Conventional Commits)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|chore|ci|test|refactor|style|perf|revert)(\(.+\))?: .+'
          if ! echo "$PR_TITLE" | grep -Eq "$PATTERN"; then
            echo "::warning::PR title does not follow Conventional Commits: '$PR_TITLE'"
            echo "Expected format: <type>(scope): description"
            echo "Valid types: feat fix docs chore ci test refactor style perf revert"
          else
            echo "✅ PR title follows Conventional Commits: '$PR_TITLE'"
          fi

  security:
    name: "🔐 Security"
    needs: changes
    if: ${{ needs.changes.outputs.any_code == 'true' || needs.changes.outputs.ci == 'true' }}
    permissions:
      contents: read
      security-events: write   # CodeQL upload (capped by caller's grant)
    uses: adza-group/shared-workflows/.github/workflows/reusable-security-scan.yml@v1.3.1
    with:
      python-version: ${{ inputs.python-version }}
      runner-label: ${{ inputs.runner-label }}
    secrets: inherit

  test-matrix:
    name: "🧪 Test"
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.test-shards) }}
    services:
      postgres:
        image: postgres:${{ inputs.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Load test env
        env:
          TEST_ENV: ${{ inputs.test-env }}
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          # Services use DYNAMIC host ports (ports: [5432]/[6379], not fixed 5432:5432).
          # On self-hosted runners that share ONE Docker daemon, fixed ports collide
          # when shards run concurrently (M4). We rewrite the well-known ports in any
          # test-env value to the GHA-assigned ports. Transparent to apps, which keep
          # writing localhost:5432 / localhost:6379 in their test-env.
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          pg = os.environ.get('PG_PORT') or '5432'
          rd = os.environ.get('REDIS_PORT') or '6379'
          for k, v in json.loads(os.environ.get('TEST_ENV') or '{}').items():
              if isinstance(v, str):
                  v = (v.replace('localhost:5432', f'localhost:{pg}')
                        .replace('127.0.0.1:5432', f'127.0.0.1:{pg}')
                        .replace('localhost:6379', f'localhost:{rd}')
                        .replace('127.0.0.1:6379', f'127.0.0.1:{rd}'))
              print(f"{k}={v}")
          PY
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1.3.1
        with:
          install-requirements: "true"
          install-system-deps: ${{ inputs.install-system-deps }}
          install-coverage: "true"
          cache-key-suffix: test-${{ matrix.shard.name }}
      - uses: adza-group/shared-workflows/.github/actions/run-pytest-shard@v1.3.1
        with:
          shard-name: ${{ matrix.shard.name }}
          test-paths: ${{ matrix.shard.paths }}
          markers: ${{ matrix.shard.markers || '' }}
          coverage-source: ${{ matrix.shard.cov || '.' }}

  coverage:
    name: "📊 Coverage Gate"
    needs: test-matrix
    if: ${{ always() && needs.test-matrix.result == 'success' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1.3.1
        with:
          install-requirements: "false"
          install-coverage: "true"
          cache-key-suffix: coverage
      - uses: adza-group/shared-workflows/.github/actions/coverage-gate@v1.3.1
        with:
          threshold: ${{ inputs.coverage-threshold }}
          blocking: "true"

  test-results:
    name: "📋 Test Results"
    needs: test-matrix
    if: ${{ always() && needs.test-matrix.result != 'skipped' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          pattern: junit-*
          path: junit
          merge-multiple: true
      - uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040  # v2.23.0
        continue-on-error: true
        with:
          junit_files: "junit/junit-*.xml"
          comment_mode: "off"

  property-tests:
    name: "🔬 Property Tests"
    needs: changes
    if: ${{ inputs.enable-property-tests && (needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1.3.1
        with:
          install-requirements: "true"
          extra-packages: "hypothesis==6.*"
          cache-key-suffix: hypothesis
      - name: Run Hypothesis tests
        run: |
          COUNT=$(pytest tests/ -m "hypothesis" --collect-only -q 2>/dev/null | grep -oE '[0-9]+ test' | cut -d' ' -f1 || echo 0)
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "::notice::no @hypothesis.given tests found — skipping"
            exit 0
          fi
          pytest tests/ -m "hypothesis" --hypothesis-seed=0 --timeout=60 -p no:cacheprovider

  mutation:
    name: "🧬 Mutation (incremental)"
    needs: [changes, test-matrix]
    if: ${{ inputs.enable-mutation && needs.test-matrix.result == 'success' && needs.changes.outputs.python == 'true' }}
    permissions:
      contents: read
    uses: adza-group/shared-workflows/.github/workflows/reusable-mutation.yml@v1.3.1
    with:
      mode: incremental
      base-ref: main
      runner-label: ${{ inputs.runner-label }}
    secrets: inherit

  frontend:
    name: "🎨 Frontend"
    needs: changes
    if: ${{ inputs.has-frontend && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true') }}
    permissions:
      contents: read
    uses: adza-group/shared-workflows/.github/workflows/reusable-frontend.yml@v1.3.1
    with:
      frontend-dir: ${{ inputs.frontend-dir }}
      runner-label: '["ubuntu-latest"]'
    secrets: inherit

  load-test:
    name: "📈 Load Test"
    needs: [verify-staging]
    if: >-
      ${{ always() && inputs.enable-load-test && inputs.staging-url != '' &&
      needs.verify-staging.result == 'success' }}
    permissions:
      contents: read
    uses: adza-group/shared-workflows/.github/workflows/reusable-load-test.yml@v1.3.1
    with:
      target-url: ${{ inputs.staging-url }}
      blocking: false
      runner-label: ${{ inputs.runner-label }}
    secrets: inherit

  dast:
    name: "🔓 DAST"
    needs: [verify-staging]
    if: >-
      ${{ always() && inputs.enable-dast && inputs.staging-url != '' &&
      needs.verify-staging.result == 'success' }}
    permissions:
      contents: read
    uses: adza-group/shared-workflows/.github/workflows/reusable-dast.yml@v1.3.1
    with:
      target-url: ${{ inputs.staging-url }}
      scan-type: baseline
      blocking: false
      runner-label: '["ubuntu-latest"]'
    secrets: inherit

  docker-build:
    name: "🐳 Build"
    needs: [changes, lint-python, test-matrix]
    # lint-dockerfile + license-check are advisory (don't gate the build); lint-python
    # + tests are the hard gate. Keeps an advisory hadolint finding from skipping build.
    if: >-
      ${{ always() &&
      needs.lint-python.result != 'failure' &&
      (needs.test-matrix.result == 'success' || needs.test-matrix.result == 'skipped') &&
      (needs.changes.outputs.any_code == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.ci == 'true') }}
    permissions:
      contents: read
      packages: write       # GHCR push
      id-token: write        # cosign keyless OIDC
      attestations: write    # SLSA build provenance
    uses: adza-group/shared-workflows/.github/workflows/reusable-docker-build.yml@v1.3.1
    with:
      image-name: ${{ inputs.image-name != '' && inputs.image-name || format('ghcr.io/adza-group/{0}', inputs.app-name) }}
      push: ${{ inputs.enable-push && github.event_name == 'push' }}
      dockerfile: ${{ inputs.dockerfile }}
      context: ${{ inputs.docker-context }}
      sign-image: ${{ inputs.sign-image }}
      platforms: ${{ inputs.multi-arch && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
      image-size-limit-mb: ${{ inputs.image-size-limit-mb }}
      runner-label: ${{ inputs.runner-label }}
    secrets: inherit

  verify-staging:
    name: "🔍 Verify Staging"
    needs: [docker-build]
    if: >-
      ${{ always() && inputs.staging-url != '' && inputs.deploy-prod &&
      needs.docker-build.result == 'success' &&
      github.event_name == 'push' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: adza-group/shared-workflows/.github/actions/health-check@v1.3.1
        with:
          url: ${{ inputs.staging-url }}
          max-retries: "40"
          retry-delay: "30"
          check-security-headers: "true"

  require-staging-green:
    name: "🚦 Require Staging Green"
    needs: [verify-staging]
    if: >-
      ${{ always() && inputs.staging-url != '' && inputs.deploy-prod &&
      github.ref == 'refs/heads/main' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 5
    steps:
      - name: Gate on staging health
        run: |
          if [ "${{ needs.verify-staging.result }}" != "success" ]; then
            echo "::error::staging not green (result: ${{ needs.verify-staging.result }}) — blocking main push"
            exit 1
          fi
          echo "✅ staging verified green — prod push allowed"

  verify-prod:
    name: "✅ Verify Prod"
    needs: [docker-build, require-staging-green]
    if: >-
      ${{ always() && inputs.prod-url != '' && inputs.deploy-prod &&
      needs.docker-build.result == 'success' &&
      github.ref == 'refs/heads/main' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: adza-group/shared-workflows/.github/actions/health-check@v1.3.1
        id: prod-check
        continue-on-error: true
        with:
          url: ${{ inputs.prod-url }}
          max-retries: "40"
          retry-delay: "30"

      - name: Auto-rollback on failure
        if: steps.prod-check.outcome == 'failure'
        run: |
          IMAGE="${{ inputs.image-name != '' && inputs.image-name || format('ghcr.io/adza-group/{0}', inputs.app-name) }}"
          echo "::warning::prod unhealthy — attempting rollback :previous → :latest"
          if docker buildx imagetools inspect "${IMAGE}:previous" >/dev/null 2>&1; then
            docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:previous"
            echo "::warning::rollback applied — watchtower will re-deploy :previous on next poll"
          else
            echo "::warning::no :previous tag found — rollback skipped"
          fi

      - name: Open incident issue on failure
        if: steps.prod-check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 Prod verify failed — ${{ inputs.app-name }} @ ${GITHUB_SHA:0:7}" \
            --body "## Prod health check failed
          App: \`${{ inputs.app-name }}\`
          URL: ${{ inputs.prod-url }}
          SHA: ${{ github.sha }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "incident,production" || true

      - name: Fail on prod unhealthy
        if: steps.prod-check.outcome == 'failure'
        run: exit 1

  telemetry:
    name: "📈 Telemetry"
    needs: [changes, lint-python, lint-dockerfile, code-quality, dead-code, todo-tracker, license-check, commit-lint, security, test-matrix, property-tests, mutation, frontend, coverage, test-results, docker-build, verify-staging, require-staging-green, verify-prod, load-test, pr-summary, dast]
    if: ${{ always() }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 5
    steps:
      - name: Summary
        run: |
          START="${{ needs.changes.outputs.start_time }}"
          NOW=$(date +%s)
          DUR=$(( NOW - ${START:-$NOW} ))
          {
            echo "## 🚀 CI Telemetry — ${{ inputs.app-name }}"
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| lint-python | ${{ needs.lint-python.result }} |"
            echo "| security | ${{ needs.security.result }} |"
            echo "| test-matrix | ${{ needs.test-matrix.result }} |"
            echo "| coverage | ${{ needs.coverage.result }} |"
            echo "| test-results | ${{ needs.test-results.result }} |"
            echo "| docker-build | ${{ needs.docker-build.result }} |"
            echo "| lint-dockerfile | ${{ needs.lint-dockerfile.result }} |"
            echo "| code-quality | ${{ needs.code-quality.result }} |"
            echo "| dead-code | ${{ needs.dead-code.result }} |"
            echo "| property-tests | ${{ needs.property-tests.result }} |"
            echo "| mutation | ${{ needs.mutation.result }} |"
            echo "| frontend | ${{ needs.frontend.result }} |"
            echo "| verify-staging | ${{ needs.verify-staging.result }} |"
            echo "| verify-prod | ${{ needs.verify-prod.result }} |"
            echo "| dast | ${{ needs.dast.result }} |"
            echo "| **wall-clock** | **${DUR}s** |"
          } >> "$GITHUB_STEP_SUMMARY"

  pr-summary:
    name: "📝 PR Summary"
    needs: [lint-python, security, test-matrix, coverage, docker-build]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post/update sticky CI summary comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          BODY="## 🚀 CI Summary — \`${{ inputs.app-name }}\`
          | Job | Result |
          |-----|--------|
          | lint | ${{ needs.lint-python.result }} |
          | security | ${{ needs.security.result }} |
          | tests | ${{ needs.test-matrix.result }} |
          | coverage | ${{ needs.coverage.result }} |
          | docker | ${{ needs.docker-build.result }} |

          [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.body | startswith("## 🚀 CI Summary"))] | .[0].id // empty' 2>/dev/null || echo "")
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" -X PATCH -f body="$BODY" >/dev/null
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$BODY" >/dev/null
          fi

  notify:
    name: "🚨 Notify"
    needs: [lint-python, security, test-matrix, coverage, docker-build, telemetry]
    if: >-
      ${{ always() && (
        needs.lint-python.result == 'failure' ||
        needs.test-matrix.result == 'failure' ||
        needs.coverage.result == 'failure' ||
        needs.docker-build.result == 'failure'
      ) }}
    permissions:
      contents: read
    uses: adza-group/shared-workflows/.github/workflows/reusable-notify.yml@v1.3.1
    with:
      app-name: ${{ inputs.app-name }}
      status: failure
      branch: ${{ github.ref_name }}
      sha: ${{ github.sha }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      runner-label: ${{ inputs.runner-label }}
    secrets: inherit
