# ═══════════════════════════════════════════════════════════════
# Reusable Security Scanning Workflow — ADZA-Group (senior-grade)
#
# Jobs: gitleaks (hard) · Bandit HIGH-only (blocks main/tags) · Semgrep (advisory by default)
#       · Trivy FS (advisory by default) + IaC (advisory) · pip-audit (advisory by default)
#       · CodeQL (advisory) · dependency-review (PR, advisory) · OPA/conftest (advisory)
# Gate policy: gitleaks blockt immer; Bandit-HIGH blockt auf main/tags und bei force-blocking
# (risky), sonst advisory (Codex-Fund R2). Semgrep / Trivy-fs / pip-audit sind advisory,
# AUSSER der Caller nennt sie in `blocking-scanners` (Opt-in Dual-Gate 2026-09-04: blockt auf
# main/tags und bei force-blocking, advisory auf PR/dev). Alles andere advisory always.
# Debian-13 self-hosted safe: uses setup-python-deps composite (NOT actions/setup-python).
#
# Usage:
#   uses: adza-group/shared-workflows/.github/workflows/reusable-security-scan.yml@v1
#   secrets: inherit
# ═══════════════════════════════════════════════════════════════

name: "🔐 Security Scan"

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.11"
      runner-label:
        required: false
        type: string
        default: '["self-hosted", "linux", "proxmox"]'
      force-blocking:
        required: false
        type: boolean
        default: false
        description: "Risk-adaptives Gating: dual-gated Steps (bandit) werden BLOCKING unabhängig vom Branch. Immer-advisory-Steps (semgrep/pip-audit/…) bleiben advisory — deren Advisory-Status ist eine bewusste Entscheidung (Semgrep-Rauschen blockte main, v1.3.x) — es sei denn, sie stehen in blocking-scanners."
      blocking-scanners:
        required: false
        type: string
        default: ""
        description: "Opt-in Dual-Gate (2026-09-04), kommagetrennt OHNE Leerzeichen aus {semgrep,trivy-fs,pip-audit}: die genannten Scanner blocken auf main/tags und bei force-blocking; auf PR/dev bleiben sie advisory. Leer = Default (alles advisory). reusable-ci validiert die Namen vorab."
      run-gitleaks:
        required: false
        type: boolean
        default: true
      run-bandit:
        required: false
        type: boolean
        default: true
      run-semgrep:
        required: false
        type: boolean
        default: true
      run-trivy:
        required: false
        type: boolean
        default: true
      run-pip-audit:
        required: false
        type: boolean
        default: true
      run-codeql:
        required: false
        type: boolean
        default: true
      run-dependency-review:
        required: false
        type: boolean
        default: true
      run-opa:
        required: false
        type: boolean
        default: true
      bandit-exclude:
        required: false
        type: string
        default: "./tests,./.venv"
      semgrep-configs:
        required: false
        type: string
        default: "p/python p/flask p/security-audit p/secrets"
      codeql-languages:
        required: false
        type: string
        default: '["python", "javascript-typescript"]'

permissions:
  contents: read

jobs:
  # ── Secret Detection (HARD FAIL on every branch) ──────────────
  gitleaks:
    name: "🔑 Secrets"
    if: ${{ inputs.run-gitleaks }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        env:
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba   # gitleaks_8.21.2_linux_x64.tar.gz (Audit 2026-09-03, Fund 7)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c --quiet - || { echo "::error::gitleaks checksum mismatch"; exit 1; }
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar xz -C "$RUNNER_TEMP/gitleaks-bin" -f "$RUNNER_TEMP/gitleaks.tgz" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" detect --source=. --no-banner --redact -v

  # ── SAST: Bandit (dual-gate) ──────────────────────────────────
  bandit:
    name: "🛡️ SAST Bandit"
    if: ${{ inputs.run-bandit }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1
        with:
          install-requirements: "false"
          extra-packages: "bandit[toml]==1.*"
          cache-key-suffix: bandit
      - name: Bandit scan
        # dual-gate + Risk-Gating: advisory auf PR/dev — AUSSER force-blocking (risky-Pfad) oder main/tags
        continue-on-error: ${{ !inputs.force-blocking && !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        env:
          BANDIT_EXCLUDE: ${{ inputs.bandit-exclude }}
        run: |
          bandit -r . --exclude "$BANDIT_EXCLUDE" \
            --skip B101,B104,B105,B106,B311,B603,B607 \
            --severity-level high -f json -o /tmp/bandit.json || true
          bandit -r . --exclude "$BANDIT_EXCLUDE" \
            --skip B101,B104,B105,B106,B311,B603,B607 --severity-level high
      - name: Summary
        if: always()
        run: |
          echo "## 🛡️ SAST — Bandit" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "
          import json, pathlib
          data = json.loads(pathlib.Path('/tmp/bandit.json').read_text())
          r = data.get('results', [])
          h = sum(1 for x in r if x['issue_severity']=='HIGH')
          m = sum(1 for x in r if x['issue_severity']=='MEDIUM')
          print(f'| Severity | Count |\n|---|---|\n| HIGH | {h} |\n| MEDIUM | {m} |')
          " >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  # ── SAST: Semgrep (dual-gate) ─────────────────────────────────
  semgrep:
    name: "🛡️ SAST Semgrep"
    if: ${{ inputs.run-semgrep }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1
        with:
          install-requirements: "false"
          extra-packages: "semgrep==1.*"
          cache-key-suffix: semgrep
      # Advisory, aber SICHTBAR (Audit 2026-09-03, Fund 4/Stufe C): Findings landen als
      # SARIF-Artefakt + Zaehler im Summary; Tool-/Parse-Fehler heissen "nicht auswertbar",
      # nie "0 Findings" (Codex: Findings und Werkzeugfehler getrennt halten).
      - name: Semgrep scan
        id: semgrep
        # Opt-in Dual-Gate (2026-09-04): steht `semgrep` in blocking-scanners, blockt der Step auf
        # main/tags oder bei force-blocking (risky) — sonst advisory wie bisher. `--error` laesst
        # semgrep bei Findings mit Exit 1 enden (ohne die Flag ist der Exit auch mit Findings 0).
        continue-on-error: ${{ !(contains(format(',{0},', inputs.blocking-scanners), ',semgrep,') && (inputs.force-blocking || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) }}
        env:
          SEMGREP_CONFIGS: ${{ inputs.semgrep-configs }}
          BLOCKING: ${{ contains(format(',{0},', inputs.blocking-scanners), ',semgrep,') && (inputs.force-blocking || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        run: |
          CONFIGS=""
          for cfg in $SEMGREP_CONFIGS; do
            CONFIGS="$CONFIGS --config $cfg"
          done
          ERRFLAG=""
          if [ "$BLOCKING" = "true" ]; then ERRFLAG="--error"; fi
          semgrep scan $CONFIGS $ERRFLAG \
            --severity ERROR --severity WARNING \
            --exclude tests --exclude .venv --metrics off \
            --sarif --output semgrep.sarif
      - name: Semgrep summary + artifact
        if: always()
        env:
          TOOL_OUTCOME: ${{ steps.semgrep.outcome }}
          MODE: ${{ contains(format(',{0},', inputs.blocking-scanners), ',semgrep,') && (inputs.force-blocking || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'BLOCKING' || 'advisory' }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          outcome = os.environ.get("TOOL_OUTCOME")
          mode = os.environ.get("MODE", "advisory")
          p = pathlib.Path("semgrep.sarif")
          # Nur ein ERFOLGREICHER Lauf darf gezaehlt werden: eine leere/partielle SARIF nach
          # Tool-Abbruch hiesse sonst "0 Findings" (Codex-Fund C1). Im BLOCKING-Modus endet der
          # Step bei Findings absichtlich mit Exit 1 — dann zaehlt die vorhandene SARIF trotzdem.
          if (outcome != "success" and mode != "BLOCKING") or not p.exists():
              state = f"nicht auswertbar (step {outcome}, file {'ok' if p.exists() else 'fehlt'})"
          else:
              try:
                  # Semgrep schreibt auch per `nosemgrep` unterdrueckte Treffer in die SARIF
                  # (mit `suppressions`, kind inSource). Die zaehlen NICHT als Findings — sie
                  # loesen weder `--error` noch das Gate aus (rechnungsapp 04.09.: 45 in der
                  # SARIF, 3 aktiv). Getrennt ausweisen statt verschweigen.
                  results = [r for run in json.load(open(p, encoding="utf-8")).get("runs", []) for r in run.get("results", [])]
                  n = sum(1 for r in results if not r.get("suppressions"))
                  s_n = len(results) - n
                  state = (f"{n} Finding(s)" if n else "0 Findings") + (f" (+{s_n} per nosemgrep unterdrueckt)" if s_n else "")
              except Exception as e:
                  state = f"nicht auswertbar ({e})"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write(f"## 🛡️ SAST — Semgrep ({mode})\n{state} — Details im Artefakt `semgrep-sarif`\n")
          print(f"semgrep: {state}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 30

  # ── Trivy filesystem + IaC (dual-gate via exit-code) ──────────
  trivy:
    name: "🔍 Trivy FS"
    if: ${{ inputs.run-trivy }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Advisory, aber SICHTBAR (Audit 2026-09-03, Stufe C): SARIF + Zaehler im Summary;
      # Tool-Fehler = "nicht auswertbar", nie "0 Findings".
      - name: Filesystem scan
        id: trivy-fs
        # Opt-in Dual-Gate (2026-09-04): `trivy-fs` in blocking-scanners ⇒ exit-code 1 bei
        # CRITICAL/HIGH und kein continue-on-error auf main/tags bzw. bei force-blocking.
        # Der config/IaC-Scan (inkl. MEDIUM) bleibt immer advisory.
        continue-on-error: ${{ !(contains(format(',{0},', inputs.blocking-scanners), ',trivy-fs,') && (inputs.force-blocking || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: ${{ (contains(format(',{0},', inputs.blocking-scanners), ',trivy-fs,') && (inputs.force-blocking || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) && '1' || '0' }}
      - name: Config / IaC scan
        id: trivy-config
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
      - name: Trivy summary + artifact
        if: always()
        env:
          FS_OUTCOME: ${{ steps.trivy-fs.outcome }}
          CFG_OUTCOME: ${{ steps.trivy-config.outcome }}
          FS_MODE: ${{ contains(format(',{0},', inputs.blocking-scanners), ',trivy-fs,') && (inputs.force-blocking || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'BLOCKING' || 'advisory' }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          fs_mode = os.environ.get("FS_MODE", "advisory")
          def count(path, outcome, mode="advisory"):
              p = pathlib.Path(path)
              # Im BLOCKING-Modus endet der fs-Scan bei Findings absichtlich mit Exit 1 —
              # die geschriebene SARIF zaehlt dann trotzdem (kein Werkzeugfehler).
              if (outcome != "success" and mode != "BLOCKING") or not p.exists():
                  return f"nicht auswertbar (step {outcome}, file {'ok' if p.exists() else 'fehlt'})"
              try:
                  n = sum(len(r.get("results", [])) for r in json.load(open(p, encoding="utf-8")).get("runs", []))
              except Exception as e:
                  return f"nicht auswertbar ({e})"
              return f"{n} Finding(s)" if n else "0 Findings"
          fs = count("trivy-fs.sarif", os.environ.get("FS_OUTCOME"), fs_mode)
          cfg = count("trivy-config.sarif", os.environ.get("CFG_OUTCOME"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write(f"## 🔍 Trivy (fs: {fs_mode}, config: advisory)\n| Scan | Ergebnis |\n|---|---|\n| fs (CRITICAL/HIGH) | {fs} |\n| config/IaC (CRIT/HIGH/MED) | {cfg} |\n\nDetails im Artefakt `trivy-sarif`\n")
          print(f"trivy fs: {fs}; config: {cfg}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: trivy-sarif
          path: |
            trivy-fs.sarif
            trivy-config.sarif
          if-no-files-found: ignore
          retention-days: 30

  # ── SCA: pip-audit (dual-gate) ────────────────────────────────
  pip-audit:
    name: "📦 Dep Audit"
    if: ${{ inputs.run-pip-audit }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1
        with:
          install-requirements: "false"
          extra-packages: "pip-audit==2.*"
          cache-key-suffix: pip-audit
      - name: pip-audit
        # Opt-in Dual-Gate (2026-09-04): `pip-audit` in blocking-scanners ⇒ blockt auf main/tags
        # bzw. bei force-blocking (pip-audit endet bei bekannten CVEs mit Exit 1). Der Exit wird
        # erst NACH dem Summary weitergereicht — vorher brach `bash -e` das Summary bei Funden ab.
        continue-on-error: ${{ !(contains(format(',{0},', inputs.blocking-scanners), ',pip-audit,') && (inputs.force-blocking || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) }}
        env:
          MODE: ${{ contains(format(',{0},', inputs.blocking-scanners), ',pip-audit,') && (inputs.force-blocking || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'BLOCKING' || 'advisory' }}
        run: |
          if [ ! -f requirements.txt ]; then
            echo "::notice::no requirements.txt — skipping pip-audit"; exit 0
          fi
          set -o pipefail
          RC=0
          pip-audit -r requirements.txt --desc | tee /tmp/audit.txt || RC=$?
          {
            echo "## 📦 SCA — Dependency Audit ($MODE)"
            echo '```'
            cat /tmp/audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  # ── CodeQL (py+js) — runner-label-driven; advisory (RAM-heavy: prefers hosted when minutes available) ──
  codeql:
    name: "🔬 CodeQL"
    if: ${{ inputs.run-codeql }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 20
    permissions:
      actions: read            # REQUIRED for private repos: analyze calls GET /actions/runs/{id}; without it →
                               # "Resource not accessible by integration" → configuration error (github/codeql-action#2117)
      contents: read
      security-events: write
    # Always advisory: code-scanning result upload needs GitHub Advanced Security,
    # which free/private orgs lack → CodeQL can't persist results ("Resource not
    # accessible"). Keep it running but never block (incl. main).
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql-languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@c35d1b164463ee62a100735382aaaa525c5d3496  # codeql-bundle-v2.25.6
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@c35d1b164463ee62a100735382aaaa525c5d3496  # codeql-bundle-v2.25.6
      - uses: github/codeql-action/analyze@c35d1b164463ee62a100735382aaaa525c5d3496  # codeql-bundle-v2.25.6
        id: codeql-analyze
        with:
          category: "/language:${{ matrix.language }}"
          # upload:false — a private repo without GitHub Advanced Security cannot persist SARIF to
          # code-scanning ("Resource not accessible by integration"), which left this job red-but-
          # tolerated. Skipping the upload makes the analyze step (and the job) GREEN while CodeQL
          # still runs the full analysis. Flip to true once GHAS is purchased.
          upload: false
          # Audit 2026-09-03 (Stufe C): SARIF trotzdem schreiben → Zaehler im Summary + Artefakt,
          # damit "gruen" nicht mit "0 Findings" verwechselt wird (bisher las die Findings niemand).
          output: codeql-sarif
      - name: CodeQL summary + artifact
        if: always()
        env:
          OUTCOME: ${{ steps.codeql-analyze.outcome }}
          LANG: ${{ matrix.language }}
        run: |
          python3 - <<'PY'
          import glob, json, os
          outcome, lang = os.environ.get("OUTCOME"), os.environ.get("LANG")
          files = glob.glob("codeql-sarif/*.sarif")
          if outcome != "success" or not files:
              state = f"nicht auswertbar (analyze {outcome}, {len(files)} SARIF-Datei(en))"
          else:
              try:
                  n = sum(len(r.get("results", [])) for f in files for r in json.load(open(f, encoding="utf-8")).get("runs", []))
                  state = f"{n} Finding(s)" if n else "0 Findings"
              except Exception as e:
                  state = f"nicht auswertbar ({e})"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write(f"## 🔬 CodeQL {lang} (advisory, kein Upload ohne GHAS)\n{state} — Details im Artefakt `codeql-sarif-{lang}`\n")
          print(f"codeql {lang}: {state}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-sarif/
          if-no-files-found: ignore
          retention-days: 30

  # ── Dependency Review (PR-only, public repos only) ────────────
  dependency-review:
    name: "📜 Dependency Review"
    # dependency-review-action needs the Dependency Graph — on PRIVATE repos that
    # requires GitHub Advanced Security ("not supported on this repository" without
    # it). None of the fleet repos have GHAS, so the job was a red check on every
    # PR that could structurally never turn green (Dependabot + cve-notify cover
    # the same ground). Skip private repos entirely; if GHAS is ever purchased,
    # drop the `!github.event.repository.private` clause.
    if: ${{ inputs.run-dependency-review && github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    # Advisory on public repos too — never fail the whole security gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: ${{ github.base_ref == 'main' && 'high' || 'critical' }}

  # ── OPA / conftest policy (dual-gate via composite input) ─────
  opa:
    name: "📋 OPA Policy"
    if: ${{ inputs.run-opa }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: adza-group/shared-workflows/.github/actions/opa-policy@v1
        with:
          blocking: 'false'
