# ═══════════════════════════════════════════════════════════════
# Reusable Security Scanning Workflow — ADZA-Group (senior-grade)
#
# Jobs: gitleaks (hard) · Bandit HIGH-only (blocks main/tags) · Semgrep (advisory)
#       · Trivy FS+IaC (advisory) · pip-audit (advisory) · CodeQL (advisory)
#       · dependency-review (PR, advisory) · OPA/conftest (advisory)
# Gate policy: gitleaks + bandit-HIGH ALWAYS block; all SAST/SCA advisory always.
# Debian-13 self-hosted safe: uses setup-python-deps composite (NOT actions/setup-python).
#
# Usage:
#   uses: adza-group/shared-workflows/.github/workflows/reusable-security-scan.yml@v1
#   secrets: inherit
# ═══════════════════════════════════════════════════════════════

name: "🔐 Security Scan"

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.11"
      runner-label:
        required: false
        type: string
        default: '["self-hosted", "linux", "proxmox"]'
      force-blocking:
        required: false
        type: boolean
        default: false
        description: "Risk-adaptives Gating: dual-gated Steps (bandit) werden BLOCKING unabhängig vom Branch. Immer-advisory-Steps (semgrep/pip-audit/…) bleiben advisory — deren Advisory-Status ist eine bewusste Entscheidung (Semgrep-Rauschen blockte main, v1.3.x)."
      run-gitleaks:
        required: false
        type: boolean
        default: true
      run-bandit:
        required: false
        type: boolean
        default: true
      run-semgrep:
        required: false
        type: boolean
        default: true
      run-trivy:
        required: false
        type: boolean
        default: true
      run-pip-audit:
        required: false
        type: boolean
        default: true
      run-codeql:
        required: false
        type: boolean
        default: true
      run-dependency-review:
        required: false
        type: boolean
        default: true
      run-opa:
        required: false
        type: boolean
        default: true
      bandit-exclude:
        required: false
        type: string
        default: "./tests,./.venv"
      semgrep-configs:
        required: false
        type: string
        default: "p/python p/flask p/security-audit p/secrets"
      codeql-languages:
        required: false
        type: string
        default: '["python", "javascript-typescript"]'

permissions:
  contents: read

jobs:
  # ── Secret Detection (HARD FAIL on every branch) ──────────────
  gitleaks:
    name: "🔑 Secrets"
    if: ${{ inputs.run-gitleaks }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks detect --source=. --no-banner --redact -v

  # ── SAST: Bandit (dual-gate) ──────────────────────────────────
  bandit:
    name: "🛡️ SAST Bandit"
    if: ${{ inputs.run-bandit }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1
        with:
          install-requirements: "false"
          extra-packages: "bandit[toml]==1.*"
          cache-key-suffix: bandit
      - name: Bandit scan
        # dual-gate + Risk-Gating: advisory auf PR/dev — AUSSER force-blocking (risky-Pfad) oder main/tags
        continue-on-error: ${{ !inputs.force-blocking && !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        env:
          BANDIT_EXCLUDE: ${{ inputs.bandit-exclude }}
        run: |
          bandit -r . --exclude "$BANDIT_EXCLUDE" \
            --skip B101,B104,B105,B106,B311,B603,B607 \
            --severity-level high -f json -o /tmp/bandit.json || true
          bandit -r . --exclude "$BANDIT_EXCLUDE" \
            --skip B101,B104,B105,B106,B311,B603,B607 --severity-level high
      - name: Summary
        if: always()
        run: |
          echo "## 🛡️ SAST — Bandit" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "
          import json, pathlib
          data = json.loads(pathlib.Path('/tmp/bandit.json').read_text())
          r = data.get('results', [])
          h = sum(1 for x in r if x['issue_severity']=='HIGH')
          m = sum(1 for x in r if x['issue_severity']=='MEDIUM')
          print(f'| Severity | Count |\n|---|---|\n| HIGH | {h} |\n| MEDIUM | {m} |')
          " >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  # ── SAST: Semgrep (dual-gate) ─────────────────────────────────
  semgrep:
    name: "🛡️ SAST Semgrep"
    if: ${{ inputs.run-semgrep }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1
        with:
          install-requirements: "false"
          extra-packages: "semgrep==1.*"
          cache-key-suffix: semgrep
      - name: Semgrep scan
        continue-on-error: true
        env:
          SEMGREP_CONFIGS: ${{ inputs.semgrep-configs }}
        run: |
          CONFIGS=""
          for cfg in $SEMGREP_CONFIGS; do
            CONFIGS="$CONFIGS --config $cfg"
          done
          semgrep scan $CONFIGS \
            --severity ERROR --severity WARNING \
            --exclude tests --exclude .venv --metrics off --error

  # ── Trivy filesystem + IaC (dual-gate via exit-code) ──────────
  trivy:
    name: "🔍 Trivy FS"
    if: ${{ inputs.run-trivy }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Config / IaC scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

  # ── SCA: pip-audit (dual-gate) ────────────────────────────────
  pip-audit:
    name: "📦 Dep Audit"
    if: ${{ inputs.run-pip-audit }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1
        with:
          install-requirements: "false"
          extra-packages: "pip-audit==2.*"
          cache-key-suffix: pip-audit
      - name: pip-audit
        continue-on-error: true
        run: |
          if [ ! -f requirements.txt ]; then
            echo "::notice::no requirements.txt — skipping pip-audit"; exit 0
          fi
          set -o pipefail
          pip-audit -r requirements.txt --desc | tee /tmp/audit.txt
          {
            echo "## 📦 SCA — Dependency Audit"
            echo '```'
            cat /tmp/audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── CodeQL (py+js) — runner-label-driven; advisory (RAM-heavy: prefers hosted when minutes available) ──
  codeql:
    name: "🔬 CodeQL"
    if: ${{ inputs.run-codeql }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 20
    permissions:
      actions: read            # REQUIRED for private repos: analyze calls GET /actions/runs/{id}; without it →
                               # "Resource not accessible by integration" → configuration error (github/codeql-action#2117)
      contents: read
      security-events: write
    # Always advisory: code-scanning result upload needs GitHub Advanced Security,
    # which free/private orgs lack → CodeQL can't persist results ("Resource not
    # accessible"). Keep it running but never block (incl. main).
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql-languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@c35d1b164463ee62a100735382aaaa525c5d3496  # codeql-bundle-v2.25.6
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@c35d1b164463ee62a100735382aaaa525c5d3496  # codeql-bundle-v2.25.6
      - uses: github/codeql-action/analyze@c35d1b164463ee62a100735382aaaa525c5d3496  # codeql-bundle-v2.25.6
        with:
          category: "/language:${{ matrix.language }}"
          # upload:false — a private repo without GitHub Advanced Security cannot persist SARIF to
          # code-scanning ("Resource not accessible by integration"), which left this job red-but-
          # tolerated. Skipping the upload makes the analyze step (and the job) GREEN while CodeQL
          # still runs the full analysis (findings visible in the job log). Flip to true once GHAS
          # is purchased to surface results in the Security tab.
          upload: false

  # ── Dependency Review (PR-only, public repos only) ────────────
  dependency-review:
    name: "📜 Dependency Review"
    # dependency-review-action needs the Dependency Graph — on PRIVATE repos that
    # requires GitHub Advanced Security ("not supported on this repository" without
    # it). None of the fleet repos have GHAS, so the job was a red check on every
    # PR that could structurally never turn green (Dependabot + cve-notify cover
    # the same ground). Skip private repos entirely; if GHAS is ever purchased,
    # drop the `!github.event.repository.private` clause.
    if: ${{ inputs.run-dependency-review && github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    # Advisory on public repos too — never fail the whole security gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: ${{ github.base_ref == 'main' && 'high' || 'critical' }}

  # ── OPA / conftest policy (dual-gate via composite input) ─────
  opa:
    name: "📋 OPA Policy"
    if: ${{ inputs.run-opa }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: adza-group/shared-workflows/.github/actions/opa-policy@v1
        with:
          blocking: 'false'
