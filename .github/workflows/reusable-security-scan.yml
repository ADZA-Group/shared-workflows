# ═══════════════════════════════════════════════════════════════
# Reusable Security Scanning Workflow — ADZA-Group (senior-grade)
#
# Jobs: gitleaks (hard) · Bandit HIGH-only (blocks main/tags) · Semgrep (advisory)
#       · Trivy FS+IaC (advisory) · pip-audit (advisory) · CodeQL (advisory)
#       · dependency-review (PR, advisory) · OPA/conftest (advisory)
# Gate policy: gitleaks + bandit-HIGH ALWAYS block; all SAST/SCA advisory always.
# Debian-13 self-hosted safe: uses setup-python-deps composite (NOT actions/setup-python).
#
# Usage:
#   uses: adza-group/shared-workflows/.github/workflows/reusable-security-scan.yml@v1
#   secrets: inherit
# ═══════════════════════════════════════════════════════════════

name: "🔐 Security Scan"

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.11"
      runner-label:
        required: false
        type: string
        default: '["self-hosted", "linux", "proxmox"]'
      force-blocking:
        required: false
        type: boolean
        default: false
        description: "Risk-adaptives Gating: dual-gated Steps (bandit) werden BLOCKING unabhängig vom Branch. Immer-advisory-Steps (semgrep/pip-audit/…) bleiben advisory — deren Advisory-Status ist eine bewusste Entscheidung (Semgrep-Rauschen blockte main, v1.3.x)."
      run-gitleaks:
        required: false
        type: boolean
        default: true
      run-bandit:
        required: false
        type: boolean
        default: true
      run-semgrep:
        required: false
        type: boolean
        default: true
      run-trivy:
        required: false
        type: boolean
        default: true
      run-pip-audit:
        required: false
        type: boolean
        default: true
      run-codeql:
        required: false
        type: boolean
        default: true
      run-dependency-review:
        required: false
        type: boolean
        default: true
      run-opa:
        required: false
        type: boolean
        default: true
      bandit-exclude:
        required: false
        type: string
        default: "./tests,./.venv"
      semgrep-configs:
        required: false
        type: string
        default: "p/python p/flask p/security-audit p/secrets"
      codeql-languages:
        required: false
        type: string
        default: '["python", "javascript-typescript"]'

permissions:
  contents: read

jobs:
  # ── Secret Detection (HARD FAIL on every branch) ──────────────
  gitleaks:
    name: "🔑 Secrets"
    if: ${{ inputs.run-gitleaks }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - name: Gitleaks
        env:
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba   # gitleaks_8.21.2_linux_x64.tar.gz (Audit 2026-09-03, Fund 7)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c --quiet - || { echo "::error::gitleaks checksum mismatch"; exit 1; }
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar xz -C "$RUNNER_TEMP/gitleaks-bin" -f "$RUNNER_TEMP/gitleaks.tgz" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" detect --source=. --no-banner --redact -v

  # ── SAST: Bandit (dual-gate) ──────────────────────────────────
  bandit:
    name: "🛡️ SAST Bandit"
    if: ${{ inputs.run-bandit }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1
        with:
          install-requirements: "false"
          extra-packages: "bandit[toml]==1.*"
          cache-key-suffix: bandit
      - name: Bandit scan
        # dual-gate + Risk-Gating: advisory auf PR/dev — AUSSER force-blocking (risky-Pfad) oder main/tags
        continue-on-error: ${{ !inputs.force-blocking && !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        env:
          BANDIT_EXCLUDE: ${{ inputs.bandit-exclude }}
        run: |
          bandit -r . --exclude "$BANDIT_EXCLUDE" \
            --skip B101,B104,B105,B106,B311,B603,B607 \
            --severity-level high -f json -o /tmp/bandit.json || true
          bandit -r . --exclude "$BANDIT_EXCLUDE" \
            --skip B101,B104,B105,B106,B311,B603,B607 --severity-level high
      - name: Summary
        if: always()
        run: |
          echo "## 🛡️ SAST — Bandit" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "
          import json, pathlib
          data = json.loads(pathlib.Path('/tmp/bandit.json').read_text())
          r = data.get('results', [])
          h = sum(1 for x in r if x['issue_severity']=='HIGH')
          m = sum(1 for x in r if x['issue_severity']=='MEDIUM')
          print(f'| Severity | Count |\n|---|---|\n| HIGH | {h} |\n| MEDIUM | {m} |')
          " >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  # ── SAST: Semgrep (dual-gate) ─────────────────────────────────
  semgrep:
    name: "🛡️ SAST Semgrep"
    if: ${{ inputs.run-semgrep }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1
        with:
          install-requirements: "false"
          extra-packages: "semgrep==1.*"
          cache-key-suffix: semgrep
      # Advisory, aber SICHTBAR (Audit 2026-09-03, Fund 4/Stufe C): Findings landen als
      # SARIF-Artefakt + Zaehler im Summary; Tool-/Parse-Fehler heissen "nicht auswertbar",
      # nie "0 Findings" (Codex: Findings und Werkzeugfehler getrennt halten).
      - name: Semgrep scan
        id: semgrep
        continue-on-error: true
        env:
          SEMGREP_CONFIGS: ${{ inputs.semgrep-configs }}
        run: |
          CONFIGS=""
          for cfg in $SEMGREP_CONFIGS; do
            CONFIGS="$CONFIGS --config $cfg"
          done
          semgrep scan $CONFIGS \
            --severity ERROR --severity WARNING \
            --exclude tests --exclude .venv --metrics off \
            --sarif --output semgrep.sarif
      - name: Semgrep summary + artifact
        if: always()
        env:
          TOOL_OUTCOME: ${{ steps.semgrep.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          outcome = os.environ.get("TOOL_OUTCOME")
          p = pathlib.Path("semgrep.sarif")
          # Nur ein ERFOLGREICHER Lauf darf gezaehlt werden: eine leere/partielle SARIF nach
          # Tool-Abbruch hiesse sonst "0 Findings" (Codex-Fund C1).
          if outcome != "success" or not p.exists():
              state = f"nicht auswertbar (step {outcome}, file {'ok' if p.exists() else 'fehlt'})"
          else:
              try:
                  n = sum(len(r.get("results", [])) for r in json.load(open(p, encoding="utf-8")).get("runs", []))
                  state = f"{n} Finding(s)" if n else "0 Findings"
              except Exception as e:
                  state = f"nicht auswertbar ({e})"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write(f"## 🛡️ SAST — Semgrep (advisory)\n{state} — Details im Artefakt `semgrep-sarif`\n")
          print(f"semgrep: {state}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 30

  # ── Trivy filesystem + IaC (dual-gate via exit-code) ──────────
  trivy:
    name: "🔍 Trivy FS"
    if: ${{ inputs.run-trivy }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      # Advisory, aber SICHTBAR (Audit 2026-09-03, Stufe C): SARIF + Zaehler im Summary;
      # Tool-Fehler = "nicht auswertbar", nie "0 Findings".
      - name: Filesystem scan
        id: trivy-fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Config / IaC scan
        id: trivy-config
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
      - name: Trivy summary + artifact
        if: always()
        env:
          FS_OUTCOME: ${{ steps.trivy-fs.outcome }}
          CFG_OUTCOME: ${{ steps.trivy-config.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          def count(path, outcome):
              p = pathlib.Path(path)
              if outcome != "success" or not p.exists():
                  return f"nicht auswertbar (step {outcome}, file {'ok' if p.exists() else 'fehlt'})"
              try:
                  n = sum(len(r.get("results", [])) for r in json.load(open(p, encoding="utf-8")).get("runs", []))
              except Exception as e:
                  return f"nicht auswertbar ({e})"
              return f"{n} Finding(s)" if n else "0 Findings"
          fs = count("trivy-fs.sarif", os.environ.get("FS_OUTCOME"))
          cfg = count("trivy-config.sarif", os.environ.get("CFG_OUTCOME"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write(f"## 🔍 Trivy (advisory)\n| Scan | Ergebnis |\n|---|---|\n| fs (CRITICAL/HIGH) | {fs} |\n| config/IaC (CRIT/HIGH/MED) | {cfg} |\n\nDetails im Artefakt `trivy-sarif`\n")
          print(f"trivy fs: {fs}; config: {cfg}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: trivy-sarif
          path: |
            trivy-fs.sarif
            trivy-config.sarif
          if-no-files-found: ignore
          retention-days: 30

  # ── SCA: pip-audit (dual-gate) ────────────────────────────────
  pip-audit:
    name: "📦 Dep Audit"
    if: ${{ inputs.run-pip-audit }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1
        with:
          install-requirements: "false"
          extra-packages: "pip-audit==2.*"
          cache-key-suffix: pip-audit
      - name: pip-audit
        continue-on-error: true
        run: |
          if [ ! -f requirements.txt ]; then
            echo "::notice::no requirements.txt — skipping pip-audit"; exit 0
          fi
          set -o pipefail
          pip-audit -r requirements.txt --desc | tee /tmp/audit.txt
          {
            echo "## 📦 SCA — Dependency Audit"
            echo '```'
            cat /tmp/audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── CodeQL (py+js) — runner-label-driven; advisory (RAM-heavy: prefers hosted when minutes available) ──
  codeql:
    name: "🔬 CodeQL"
    if: ${{ inputs.run-codeql }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 20
    permissions:
      actions: read            # REQUIRED for private repos: analyze calls GET /actions/runs/{id}; without it →
                               # "Resource not accessible by integration" → configuration error (github/codeql-action#2117)
      contents: read
      security-events: write
    # Always advisory: code-scanning result upload needs GitHub Advanced Security,
    # which free/private orgs lack → CodeQL can't persist results ("Resource not
    # accessible"). Keep it running but never block (incl. main).
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql-languages) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: github/codeql-action/init@c35d1b164463ee62a100735382aaaa525c5d3496  # codeql-bundle-v2.25.6
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@c35d1b164463ee62a100735382aaaa525c5d3496  # codeql-bundle-v2.25.6
      - uses: github/codeql-action/analyze@c35d1b164463ee62a100735382aaaa525c5d3496  # codeql-bundle-v2.25.6
        id: codeql-analyze
        with:
          category: "/language:${{ matrix.language }}"
          # upload:false — a private repo without GitHub Advanced Security cannot persist SARIF to
          # code-scanning ("Resource not accessible by integration"), which left this job red-but-
          # tolerated. Skipping the upload makes the analyze step (and the job) GREEN while CodeQL
          # still runs the full analysis. Flip to true once GHAS is purchased.
          upload: false
          # Audit 2026-09-03 (Stufe C): SARIF trotzdem schreiben → Zaehler im Summary + Artefakt,
          # damit "gruen" nicht mit "0 Findings" verwechselt wird (bisher las die Findings niemand).
          output: codeql-sarif
      - name: CodeQL summary + artifact
        if: always()
        env:
          OUTCOME: ${{ steps.codeql-analyze.outcome }}
          LANG: ${{ matrix.language }}
        run: |
          python3 - <<'PY'
          import glob, json, os
          outcome, lang = os.environ.get("OUTCOME"), os.environ.get("LANG")
          files = glob.glob("codeql-sarif/*.sarif")
          if outcome != "success" or not files:
              state = f"nicht auswertbar (analyze {outcome}, {len(files)} SARIF-Datei(en))"
          else:
              try:
                  n = sum(len(r.get("results", [])) for f in files for r in json.load(open(f, encoding="utf-8")).get("runs", []))
                  state = f"{n} Finding(s)" if n else "0 Findings"
              except Exception as e:
                  state = f"nicht auswertbar ({e})"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write(f"## 🔬 CodeQL {lang} (advisory, kein Upload ohne GHAS)\n{state} — Details im Artefakt `codeql-sarif-{lang}`\n")
          print(f"codeql {lang}: {state}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-sarif/
          if-no-files-found: ignore
          retention-days: 30

  # ── Dependency Review (PR-only, public repos only) ────────────
  dependency-review:
    name: "📜 Dependency Review"
    # dependency-review-action needs the Dependency Graph — on PRIVATE repos that
    # requires GitHub Advanced Security ("not supported on this repository" without
    # it). None of the fleet repos have GHAS, so the job was a red check on every
    # PR that could structurally never turn green (Dependabot + cve-notify cover
    # the same ground). Skip private repos entirely; if GHAS is ever purchased,
    # drop the `!github.event.repository.private` clause.
    if: ${{ inputs.run-dependency-review && github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    # Advisory on public repos too — never fail the whole security gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: ${{ github.base_ref == 'main' && 'high' || 'critical' }}

  # ── OPA / conftest policy (dual-gate via composite input) ─────
  opa:
    name: "📋 OPA Policy"
    if: ${{ inputs.run-opa }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: adza-group/shared-workflows/.github/actions/opa-policy@v1
        with:
          blocking: 'false'
