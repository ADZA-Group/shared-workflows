# ═══════════════════════════════════════════════════════════════
# Reusable Security Scanning Workflow — ADZA-Group (senior-grade)
#
# Jobs: gitleaks (hard) · Bandit · Semgrep · Trivy FS+IaC · pip-audit
#       · CodeQL (py+js) · dependency-review (PR) · OPA/conftest
# Dual-gate: advisory on PR/dev, BLOCKING on main + tags.
# Debian-13 self-hosted safe: uses setup-python-deps composite (NOT actions/setup-python).
#
# Usage:
#   uses: adza-group/shared-workflows/.github/workflows/reusable-security-scan.yml@v1
#   secrets: inherit
# ═══════════════════════════════════════════════════════════════

name: "🔐 Security Scan"

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.11"
      runner-label:
        required: false
        type: string
        default: '["self-hosted", "linux", "proxmox"]'
      run-gitleaks:
        required: false
        type: boolean
        default: true
      run-bandit:
        required: false
        type: boolean
        default: true
      run-semgrep:
        required: false
        type: boolean
        default: true
      run-trivy:
        required: false
        type: boolean
        default: true
      run-pip-audit:
        required: false
        type: boolean
        default: true
      run-codeql:
        required: false
        type: boolean
        default: true
      run-dependency-review:
        required: false
        type: boolean
        default: true
      run-opa:
        required: false
        type: boolean
        default: true
      bandit-exclude:
        required: false
        type: string
        default: "./tests,./.venv"
      semgrep-configs:
        required: false
        type: string
        default: "p/python p/flask p/security-audit p/secrets"
      codeql-languages:
        required: false
        type: string
        default: '["python", "javascript-typescript"]'

permissions:
  contents: read

jobs:
  # ── Secret Detection (HARD FAIL on every branch) ──────────────
  gitleaks:
    name: "🔑 Secrets"
    if: ${{ inputs.run-gitleaks }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks detect --source=. --no-banner --redact -v

  # ── SAST: Bandit (dual-gate) ──────────────────────────────────
  bandit:
    name: "🛡️ SAST Bandit"
    if: ${{ inputs.run-bandit }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1.3.1
        with:
          install-requirements: "false"
          extra-packages: "bandit[toml]==1.*"
          cache-key-suffix: bandit
      - name: Bandit scan
        continue-on-error: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        env:
          BANDIT_EXCLUDE: ${{ inputs.bandit-exclude }}
        run: |
          bandit -r . --exclude "$BANDIT_EXCLUDE" \
            --skip B101,B104,B105,B106,B311,B603,B607 \
            -ll -f json -o /tmp/bandit.json || true
          bandit -r . --exclude "$BANDIT_EXCLUDE" \
            --skip B101,B104,B105,B106,B311,B603,B607 -ll
      - name: Summary
        if: always()
        run: |
          echo "## 🛡️ SAST — Bandit" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "
          import json, pathlib
          data = json.loads(pathlib.Path('/tmp/bandit.json').read_text())
          r = data.get('results', [])
          h = sum(1 for x in r if x['issue_severity']=='HIGH')
          m = sum(1 for x in r if x['issue_severity']=='MEDIUM')
          print(f'| Severity | Count |\n|---|---|\n| HIGH | {h} |\n| MEDIUM | {m} |')
          " >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  # ── SAST: Semgrep (dual-gate) ─────────────────────────────────
  semgrep:
    name: "🛡️ SAST Semgrep"
    if: ${{ inputs.run-semgrep }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1.3.1
        with:
          install-requirements: "false"
          extra-packages: "semgrep==1.*"
          cache-key-suffix: semgrep
      - name: Semgrep scan
        continue-on-error: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        env:
          SEMGREP_CONFIGS: ${{ inputs.semgrep-configs }}
        run: |
          CONFIGS=""
          for cfg in $SEMGREP_CONFIGS; do
            CONFIGS="$CONFIGS --config $cfg"
          done
          semgrep scan $CONFIGS \
            --severity ERROR --severity WARNING \
            --exclude tests --exclude .venv --metrics off --error

  # ── Trivy filesystem + IaC (dual-gate via exit-code) ──────────
  trivy:
    name: "🔍 Trivy FS"
    if: ${{ inputs.run-trivy }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && '1' || '0' }}
      - name: Config / IaC scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && '1' || '0' }}

  # ── SCA: pip-audit (dual-gate) ────────────────────────────────
  pip-audit:
    name: "📦 Dep Audit"
    if: ${{ inputs.run-pip-audit }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1.3.1
        with:
          install-requirements: "false"
          extra-packages: "pip-audit==2.*"
          cache-key-suffix: pip-audit
      - name: pip-audit
        continue-on-error: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        run: |
          if [ ! -f requirements.txt ]; then
            echo "::notice::no requirements.txt — skipping pip-audit"; exit 0
          fi
          set -o pipefail
          pip-audit -r requirements.txt --desc | tee /tmp/audit.txt
          {
            echo "## 📦 SCA — Dependency Audit"
            echo '```'
            cat /tmp/audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── CodeQL (py+js) — ubuntu (RAM); dual-gate ──────────────────
  codeql:
    name: "🔬 CodeQL"
    if: ${{ inputs.run-codeql }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    # Always advisory: code-scanning result upload needs GitHub Advanced Security,
    # which free/private orgs lack → CodeQL can't persist results ("Resource not
    # accessible"). Keep it running but never block (incl. main).
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql-languages) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # ── Dependency Review (PR-only) ───────────────────────────────
  dependency-review:
    name: "📜 Dependency Review"
    if: ${{ inputs.run-dependency-review && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory: dependency-review-action needs the Dependency Graph (GitHub Advanced
    # Security). Private repos without GHAS get "not supported on this repository" —
    # don't let that fail the whole security gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: ${{ github.base_ref == 'main' && 'high' || 'critical' }}

  # ── OPA / conftest policy (dual-gate via composite input) ─────
  opa:
    name: "📋 OPA Policy"
    if: ${{ inputs.run-opa }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: adza-group/shared-workflows/.github/actions/opa-policy@v1.3.1
        with:
          blocking: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'true' || 'false' }}
