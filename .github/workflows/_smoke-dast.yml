name: "🧪 Smoke — DAST"

on:
  workflow_dispatch:
  push: { branches: [dev] }  # TEMP: Validierung des zap-out-Fixes — nach grünem Lauf entfernen

permissions:
  contents: read

jobs:
  dast:
    uses: ./.github/workflows/reusable-dast.yml
    with:
      target-url: "https://example.com"
      scan-type: baseline
      blocking: false
      runner-label: '["ubuntu-latest"]'
