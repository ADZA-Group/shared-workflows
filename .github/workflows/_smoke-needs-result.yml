# TEMPORAER (Fleet-Audit 2026-09-04): misst, was `needs.<job>.result` fuer einen Job mit
# job-level `continue-on-error: true` liefert, dessen Step fehlschlaegt. Die Gate-Matrix
# nimmt `success` an (advisory Jobs duerfen docker-build nicht blocken) — hier der Beleg.
name: "🧪 Smoke — needs.result bei continue-on-error"
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  coe-fails:
    name: "job mit continue-on-error, Step failt"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: fail on purpose
        run: exit 1
  observer:
    name: "observer"
    needs: coe-fails
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: report
        env:
          RESULT: ${{ needs.coe-fails.result }}
        run: echo "NEEDS_RESULT=${RESULT}"
