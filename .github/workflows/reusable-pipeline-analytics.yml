# ═══════════════════════════════════════════════════════════════
# Reusable Pipeline Analytics — ADZA-Group
#
# Weekly report: success-rate (+ trend vs the prior window) + a flaky-test radar
# that aggregates the flake-report artifacts emitted by reusable-ci's test-results.
# Usage:
#   uses: ADZA-Group/shared-workflows/.github/workflows/reusable-pipeline-analytics.yml@v1
#   with:
#     app-name: "RecyclageApp"
#     workflow-name: "CI/CD"
# ═══════════════════════════════════════════════════════════════

name: "📊 Pipeline Analytics"

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      workflow-name:
        required: false
        type: string
        default: "CI/CD"
      days:
        required: false
        type: number
        default: 7
      runner-label:
        required: false
        type: string
        default: '["self-hosted", "linux", "proxmox"]'

jobs:
  analytics:
    name: "📊 Weekly Report"
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 10
    permissions:
      actions: read            # gh api workflows + runs
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Fetch workflow runs
        id: data
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ inputs.workflow-name }}
          DAYS: ${{ inputs.days }}
        run: |
          SINCE=$(date -d "-${DAYS} days" -u +%Y-%m-%dT%H:%M:%SZ)

          # Fetch recent runs
          RUNS=$(gh api "repos/${REPO}/actions/workflows" \
            --jq ".workflows[] | select(.name==\"${WORKFLOW}\") | .id")

          if [ -z "$RUNS" ]; then
            echo "No workflow found with name '${WORKFLOW}'"
            exit 0
          fi

          DATA=$(gh api "repos/${REPO}/actions/workflows/${RUNS}/runs?created=>${SINCE}&per_page=100" \
            --jq '.workflow_runs')

          # completed runs only — in-progress runs (conclusion=null) must not dilute the rate
          TOTAL=$(echo "$DATA" | jq '[.[] | select(.conclusion != null)] | length')
          SUCCESS=$(echo "$DATA" | jq '[.[] | select(.conclusion=="success")] | length')
          FAILURE=$(echo "$DATA" | jq '[.[] | select(.conclusion=="failure")] | length')
          CANCELLED=$(echo "$DATA" | jq '[.[] | select(.conclusion=="cancelled")] | length')

          if [ "$TOTAL" -gt 0 ]; then
            SUCCESS_RATE=$(( SUCCESS * 100 / TOTAL ))
          else
            SUCCESS_RATE=0
          fi

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "failure=$FAILURE" >> $GITHUB_OUTPUT
          echo "cancelled=$CANCELLED" >> $GITHUB_OUTPUT
          echo "success_rate=$SUCCESS_RATE" >> $GITHUB_OUTPUT

      - name: Generate report
        env:
          APP: ${{ inputs.app-name }}
          DAYS: ${{ inputs.days }}
          TOTAL: ${{ steps.data.outputs.total }}
          SUCCESS: ${{ steps.data.outputs.success }}
          FAILURE: ${{ steps.data.outputs.failure }}
          CANCELLED: ${{ steps.data.outputs.cancelled }}
          RATE: ${{ steps.data.outputs.success_rate }}
        run: |
          echo "## 📊 $APP — Pipeline Analytics (${DAYS}d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metrik | Wert |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Runs | **${TOTAL}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Success | ${SUCCESS} |" >> $GITHUB_STEP_SUMMARY
          echo "| Failure | ${FAILURE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cancelled | ${CANCELLED} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Success Rate** | **${RATE}%** |" >> $GITHUB_STEP_SUMMARY

          if [ "${RATE:-0}" -lt 80 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Success rate below 80% — investigate failing jobs" >> $GITHUB_STEP_SUMMARY
          fi

      # Flake radar (makes the long-dead "flaky tests" promise real) + success-rate
      # trend vs the prior window. Aggregates flake-report artifacts (emitted by
      # reusable-ci's test-results job) across recent runs. Report-only; a metadata
      # check gates each download so we never blindly pull many artifacts.
      - name: Flake radar + success-rate trend
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ inputs.workflow-name }}
          DAYS: ${{ inputs.days }}
        run: |
          python3 - <<'PY'
          import collections, datetime, glob, json, os, shutil, subprocess, tempfile

          def gh_json(path, *args):
              out = subprocess.check_output(["gh", "api", path, *args], text=True, encoding="utf-8")
              return json.loads(out)

          repo = os.environ["REPO"]
          wf_name = os.environ["WORKFLOW_NAME"]
          days = int(os.environ["DAYS"])
          max_runs = 30
          now = datetime.datetime.now(datetime.timezone.utc)
          out = []

          wfs = gh_json(f"repos/{repo}/actions/workflows")
          wid = next((w["id"] for w in wfs["workflows"] if w["name"] == wf_name), None)
          if not wid:
              out.append(f"_flake radar: no workflow named '{wf_name}'_")
          else:
              since = (now - datetime.timedelta(days=days)).strftime("%Y-%m-%dT%H:%M:%SZ")
              runs = gh_json(f"repos/{repo}/actions/workflows/{wid}/runs?created=>{since}&per_page=100").get("workflow_runs", [])
              flaky_runs = collections.Counter()
              flaky_reruns = collections.Counter()
              with_data = 0
              for r in runs[:max_runs]:
                  arts = gh_json(f"repos/{repo}/actions/runs/{r['id']}/artifacts?per_page=100").get("artifacts", [])
                  if not any(a["name"] == "flake-report" and not a["expired"] for a in arts):
                      continue
                  dd = tempfile.mkdtemp()
                  try:
                      subprocess.run(["gh", "run", "download", str(r["id"]), "-n", "flake-report", "-D", dd, "-R", repo], check=True, capture_output=True)
                      with open(os.path.join(dd, "flake-report.json"), encoding="utf-8") as fh:
                          data = json.load(fh)
                  except Exception as e:
                      print(f"::warning::flake radar skip run {r['id']}: {e}")
                      continue
                  finally:
                      shutil.rmtree(dd, ignore_errors=True)
                  with_data += 1  # only after a successful download + parse
                  for f in data.get("flaky", []):
                      flaky_runs[f["nodeid"]] += 1
                      flaky_reruns[f["nodeid"]] += int(f.get("reruns", 0))
              out.append(f"### 🎲 Flaky tests ({days}d · {with_data} run(s) with data)")
              out.append("")
              if not flaky_runs:
                  out.append("✅ No flaky tests recorded.")
              else:
                  out.append("| Test | Runs flaky | Total reruns |")
                  out.append("|------|-----------:|-------------:|")
                  for nid, c in flaky_runs.most_common(15):
                      out.append(f"| `{nid}` | {c} | {flaky_reruns[nid]} |")

              # ── TIA-Ledger (Stufe E, Audit 2026-09-03): observe-only auswerten, NIE aktivieren.
              # Nur Runs mit tia-verdict-Artefakt zaehlen; fehlende = "nicht messbar", nie "korrekt".
              total_tests = len(glob.glob("tests/**/test_*.py", recursive=True)) + len(glob.glob("tests/**/*_test.py", recursive=True))
              evaluable = with_fail = missed_runs = incomplete = 0
              missed_files = collections.Counter()
              saved = []
              for r in runs[:max_runs]:
                  arts = gh_json(f"repos/{repo}/actions/runs/{r['id']}/artifacts?per_page=100").get("artifacts", [])
                  if not any(a["name"] == "tia-verdict" and not a["expired"] for a in arts):
                      continue
                  dd = tempfile.mkdtemp()
                  try:
                      subprocess.run(["gh", "run", "download", str(r["id"]), "-n", "tia-verdict", "-D", dd, "-R", repo], check=True, capture_output=True)
                      with open(os.path.join(dd, "tia-verdict.json"), encoding="utf-8") as fh:
                          v = json.load(fh)
                  except Exception as e:
                      print(f"::warning::tia ledger skip run {r['id']}: {e}")
                      continue
                  finally:
                      shutil.rmtree(dd, ignore_errors=True)
                  if v.get("mode") != "selected":
                      continue
                  if not v.get("complete"):
                      incomplete += 1   # fehlender/unlesbarer Shard ⇒ nicht messbar, nie "korrekt"
                      continue
                  evaluable += 1
                  if v.get("failed_files"):
                      with_fail += 1
                      if v.get("missed"):
                          missed_runs += 1
                          for m in v["missed"]:
                              missed_files[m] += 1
                  if total_tests:
                      saved.append(max(0.0, 1 - len(v.get("selected", [])) / total_tests))
              out.append("")
              out.append(f"### 🔬 TIA-Ledger (observe-only, {days}d)")
              out.append(f"- Runs mit Auswahl-Prognose: **{evaluable}** (dazu {incomplete} unvollstaendig = nicht messbar) · davon mit echten Testfehlern: {with_fail} · Prognose haette rote Datei(en) VERPASST: **{missed_runs}**")
              if with_fail:
                  out.append(f"- False-Negative-Rate (Runs): **{100 * missed_runs // with_fail}%** — Aktivierung nur bei 0% ueber ein langes Fenster")
              else:
                  out.append("- False-Negative-Rate: nicht messbar (kein Run mit Testfehlern im Fenster)")
              if saved:
                  out.append(f"- Prognostizierte Einsparung (Testdateien): Ø **{100 * sum(saved) / len(saved):.0f}%** von {total_tests} Testdateien")
              for f, c in missed_files.most_common(10):
                  out.append(f"  - verpasst: `{f}` ({c}×)")

              def srate(rs):
                  rs = [r for r in rs if r.get("conclusion") is not None]  # exclude in-progress
                  n = len(rs)
                  s = sum(1 for r in rs if r.get("conclusion") == "success")
                  return (100 * s // n if n else 0, n)

              prev_since = (now - datetime.timedelta(days=2 * days)).strftime("%Y-%m-%dT%H:%M:%SZ")
              prev = gh_json(f"repos/{repo}/actions/workflows/{wid}/runs?created={prev_since}..{since}&per_page=100").get("workflow_runs", [])
              cr, cn = srate(runs)
              pr, pn = srate(prev)
              d = cr - pr
              arrow = "▲" if d > 0 else "▼" if d < 0 else "▬"
              out.append("")
              out.append("### 📈 Success-rate trend")
              out.append(f"- This {days}d: **{cr}%** (n={cn}) · prev {days}d: {pr}% (n={pn}) · {arrow} {d:+d}pp")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("\n".join(out) + "\n")
          PY
