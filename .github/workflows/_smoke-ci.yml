# Full-chain smoke for the reusable-ci.yml orchestrator, run against an in-repo
# fixture. push:[dev] trigger is TEMPORARY (controller reverts after validation).
name: "🧪 Smoke — CI Orchestrator"

on:
  workflow_dispatch:
  # Stufe A (2026-09-03): release.yml ruft diesen Smoke auf dem Kandidaten-Branch per
  # workflow_call auf (Refs dort auf @<sha> umgeschrieben) — der fruehere push-Trigger
  # auf release-* entfaellt, sonst liefe der Smoke doppelt.
  workflow_call:

permissions:
  actions: read          # security/codeql nested job claims actions:read (codeql-action#2117); caller must grant it or startup_failure
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write
  checks: write
  issues: write        # verify-prod incident issues
  pull-requests: write # pr-summary sticky comment

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      app-name: smoke-fixture
      runner-label: '["ubuntu-latest"]'   # validate the whole orchestrator on ubuntu (bypasses LXC-104 block)
      cloud-runner-label: '["ubuntu-latest"]'   # v1-Linie faehrt changes/lints/tests auf cloud-runner-label
      coverage-threshold: 0
      test-shards: '[{"name":"fixture","paths":"tests/fixtures/app","cov":"tests/fixtures/app"}]'
      test-env: "{}"
      enable-push: false
      # Release-Gate (Stufe A): auf dem Kandidaten-Branch ist das Event `push` auf einem
      # Nicht-main-Branch ⇒ CI-Diaet ⇒ Security/Property SKIPPED (GEMESSEN Run 33757764577).
      # Der Release-Smoke muss die Security-Lane mit Kandidaten-Refs beweisen ⇒ Diaet aus.
      full-ci-on-dev-push: true
      dockerfile: tests/fixtures/docker/Dockerfile
      docker-context: tests/fixtures/docker
      image-name: ghcr.io/adza-group/smoke-fixture
      has-frontend: false
      staging-url: ""
      prod-url: ""
      deploy-prod: false
      enable-property-tests: true
      enable-mutation: true
      enable-load-test: false
      enable-dast: false
    secrets: inherit
