# Full-chain smoke for the reusable-ci.yml orchestrator, run against an in-repo
# fixture. push:[dev] trigger is TEMPORARY (controller reverts after validation).
name: "🧪 Smoke — CI Orchestrator"

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write
  checks: write
  issues: write        # verify-prod incident issues
  pull-requests: write # pr-summary sticky comment

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      app-name: smoke-fixture
      runner-label: '["ubuntu-latest"]'   # validate the whole orchestrator on ubuntu (bypasses LXC-104 block)
      coverage-threshold: 0
      test-shards: '[{"name":"fixture","paths":"tests/fixtures/app","cov":"tests/fixtures/app"}]'
      test-env: "{}"
      enable-push: false
      dockerfile: tests/fixtures/docker/Dockerfile
      docker-context: tests/fixtures/docker
      image-name: ghcr.io/adza-group/smoke-fixture
      has-frontend: false
      staging-url: ""
      prod-url: ""
      deploy-prod: false
      enable-property-tests: true
      enable-mutation: true
      enable-load-test: false
      enable-dast: false
    secrets: inherit
