name: secrets
# trufflehog-Diff-Scan auf jedem Push (auch .md/docs — dort landen Keys gern),
# auf GitHub-Runnern (Runner 104 bleibt frei). Repo ist PUBLIC — ein geleaktes
# Secret wäre sofort weltlesbar; ausgerechnet hier fehlte der Scan bisher.
# workflow_dispatch = Full-History-Scan:
#   gh workflow run secrets.yml -R ADZA-Group/shared-workflows --ref dev
on:
  push:
    branches: [dev] # einziger Branch (kein main); PR-Branches deckt pull_request ab
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # Nur verifizierte Live-Credentials melden (kein Fehlalarm-Lärm).
      # Ohne base/head (dispatch) scannt die Action die volle Historie.
      - uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --results=verified
