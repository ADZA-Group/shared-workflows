name: secrets
# Push- und PR-Scan leben seit 09.09.2026 als Job `secret-scan` in actionlint.yml —
# sonst standen pro Push zwei Runs in der Liste. Hier bleibt nur der
# Full-History-Scan:
#   gh workflow run secrets.yml -R ADZA-Group/shared-workflows --ref dev
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Nur verifizierte Live-Credentials melden (kein Fehlalarm-Lärm).
      # Ohne base/head (dispatch) scannt die Action die volle Historie.
      - uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          extra_args: --results=verified
