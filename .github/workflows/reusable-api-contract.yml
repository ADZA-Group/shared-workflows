# ═══════════════════════════════════════════════════════════════
# Reusable API Contract Testing — ADZA-Group
#
# Boots the app (start-app composite) and runs schemathesis property-based
# fuzzing against its OpenAPI spec. SKIPS when openapi-spec is empty (the
# default — apps without a spec are a no-op). Dual-gate, runner-label-driven.
#
# Usage:
#   uses: adza-group/shared-workflows/.github/workflows/reusable-api-contract.yml@v1
#   with:
#     openapi-spec: "http://localhost:5000/openapi.json"
#     boot-command: "python app.py"
#     health-url: "http://localhost:5000/health"
#   secrets: inherit
# ═══════════════════════════════════════════════════════════════

name: "📑 API Contract"

on:
  workflow_call:
    inputs:
      openapi-spec:
        required: false
        type: string
        default: ""
        description: "OpenAPI spec path or URL (empty = skip the whole job)"
      base-url:
        required: false
        type: string
        default: ""
        description: "Base URL of the running app (empty = derive from health-url origin)"
      boot-command:
        required: false
        type: string
        default: ""
        description: "Command to start the app (empty = assume already running / spec is a remote URL)"
      health-url:
        required: false
        type: string
        default: ""
        description: "Health URL polled before testing (required when boot-command is set)"
      app-dir:
        required: false
        type: string
        default: "."
        description: "Working directory for boot-command + requirements"
      requirements:
        required: false
        type: string
        default: ""
        description: "Optional requirements file installed before boot (e.g. fixture deps)"
      schemathesis-version:
        required: false
        type: string
        default: "3.39.5"
      hypothesis-pin:
        required: false
        type: string
        default: "hypothesis==6.131.0"
        description: "Compat pin: schemathesis 3.39.x breaks on hypothesis>=6.131.4 (_fallback kwarg). Exact == (no shell metachar, the composite expands extra-packages unquoted). Set '' to skip."
      schemathesis-args:
        required: false
        type: string
        default: "--checks not_a_server_error --hypothesis-max-examples 25"
        description: "Extra schemathesis args (checks, examples, etc.)"
      runner-label:
        required: false
        type: string
        default: '["ubuntu-latest"]'
      blocking:
        required: false
        type: boolean
        default: false
        description: "Reserved; the job is dual-gated via continue-on-error on the run step"

permissions:
  contents: read

jobs:
  api-contract:
    name: "📑 API Contract"
    if: ${{ inputs.openapi-spec != '' }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: adza-group/shared-workflows/.github/actions/setup-python-deps@v1
        with:
          install-requirements: "false"
          extra-packages: "schemathesis==${{ inputs.schemathesis-version }} ${{ inputs.hypothesis-pin }}"
          cache-key-suffix: api-contract

      - name: Install app requirements
        if: ${{ inputs.requirements != '' }}
        shell: bash
        run: pip install --retries 3 --timeout 60 -r "${{ inputs.requirements }}"   # venv from setup-python-deps is on PATH

      - name: Verify schemathesis
        shell: bash
        run: schemathesis --version || st --version

      - name: Start app
        if: ${{ inputs.boot-command != '' }}
        id: start
        uses: adza-group/shared-workflows/.github/actions/start-app@v1
        with:
          boot-command: ${{ inputs.boot-command }}
          health-url: ${{ inputs.health-url }}

      - name: Schemathesis run
        shell: bash
        continue-on-error: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        env:
          SPEC: ${{ inputs.openapi-spec }}
          BASE: ${{ inputs.base-url }}
          HEALTH: ${{ inputs.health-url }}
          EXTRA: ${{ inputs.schemathesis-args }}
        run: |
          set -o pipefail
          # Derive base-url from the health-url origin when not given.
          if [ -z "$BASE" ] && [ -n "$HEALTH" ]; then
            BASE=$(printf '%s' "$HEALTH" | sed -E 's#(https?://[^/]+).*#\1#')
          fi
          ARGS=""
          [ -n "$BASE" ] && ARGS="--base-url $BASE"
          echo "schemathesis run $SPEC $ARGS $EXTRA"
          # schemathesis 3.x CLI: `schemathesis run <spec> --base-url <base> [checks...]`
          # (v4 renamed this flag to --url; we pin 3.x → --base-url is correct here.)
          schemathesis run "$SPEC" $ARGS $EXTRA | tee /tmp/schemathesis.out
          {
            echo "## 📑 API Contract (schemathesis)"
            echo '```'
            tail -n 40 /tmp/schemathesis.out || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop app
        if: ${{ always() && inputs.boot-command != '' && steps.start.outputs.app-pid != '' }}
        shell: bash
        run: kill "${{ steps.start.outputs.app-pid }}" 2>/dev/null || true
