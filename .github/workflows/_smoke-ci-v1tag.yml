# Validates the released graph: calls reusable-ci.yml@v1 exactly like an app
# does (moving major tag, not local ./). Proves the CURRENT @v1 release graph
# resolves + starts as external caller (no startup_failure). ubuntu. Dispatch-only;
# Merke: Re-Runs lösen @v1 NICHT neu auf — für einen frischen Beweis neu dispatchen.
name: "🧪 Smoke — CI @v1 (aktuelles Release)"

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write
  checks: write
  issues: write
  pull-requests: write

jobs:
  ci:
    uses: adza-group/shared-workflows/.github/workflows/reusable-ci.yml@v1
    with:
      app-name: smoke-v1tag
      runner-label: '["ubuntu-latest"]'
      coverage-threshold: 0
      test-shards: '[{"name":"fixture","paths":"tests/fixtures/app","cov":"tests/fixtures/app"}]'
      test-env: "{}"
      enable-redis: false
      enable-push: false
      dockerfile: tests/fixtures/docker/Dockerfile
      docker-context: tests/fixtures/docker
      image-name: ghcr.io/adza-group/smoke-v1tag
      has-frontend: false
      staging-url: ""
      prod-url: ""
      deploy-prod: false
      enable-property-tests: false
      enable-mutation: false
      enable-load-test: false
      enable-dast: false
    secrets: inherit
