# ═══════════════════════════════════════════════════════════════
# Reusable DAST Workflow — ADZA-Group
# OWASP ZAP baseline scan against a live URL.
# Gate: `blocking` entscheidet, ob FAIL-level-Alerts den Job rot machen (Default
# false; reusable-ci uebergibt derzeit false = advisory, Policy-Entscheid Azad).
# Ein UNLESBARER Report ist dagegen IMMER rot (Audit 2026-09-03, Fund 5): vorher
# machte `|| echo 0:0:0` aus einem Parse-Fehler "no FAIL-level alerts".
# ═══════════════════════════════════════════════════════════════

name: "🔓 DAST"

on:
  workflow_call:
    inputs:
      target-url:
        required: true
        type: string
        description: "URL to scan (must be reachable from the runner)"
      scan-type:
        required: false
        type: string
        default: "baseline"
        description: "ZAP scan type: baseline | full"
      blocking:
        required: false
        type: boolean
        default: false
        description: "Fail the job on FAIL-level alerts (false = warn only)"
      runner-label:
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  dast:
    name: "🔓 ZAP DAST (${{ inputs.scan-type }})"
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 20
    env:
      TARGET_URL: ${{ inputs.target-url }}
      SCAN_TYPE: ${{ inputs.scan-type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run ZAP ${{ inputs.scan-type }} scan
        run: |
          # ZAP-Container läuft als user "zap" (uid 1000) — auf self-hosted Runnern
          # gehört der Workspace einer anderen UID → "Permission denied:
          # /zap/wrk/zap-report.html" → Report fehlt → Gate unten rot, obwohl der
          # Scan selbst sauber war (Incident recyclage-app main). Weltschreibbares
          # Unterverzeichnis ist runner-agnostisch (hosted UND self-hosted).
          mkdir -p zap-out && chmod 0777 zap-out
          case "$SCAN_TYPE" in baseline|full) ;; *) echo "::error::scan-type must be baseline|full (got '$SCAN_TYPE')"; exit 1 ;; esac
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            "zap-${SCAN_TYPE}.py" \
            -t "$TARGET_URL" \
            -J zap-report.json \
            -r zap-report.html \
            -I || true   # ZAP exits non-zero on alerts — we gate separately

      - name: Parse report + enforce gate
        env:
          BLOCKING: ${{ inputs.blocking }}
        run: |
          if [ ! -f zap-out/zap-report.json ]; then
            echo "::error::ZAP report not found — scan may have failed to start"
            exit 1
          fi
          # Fail-closed: Parse-/Schemafehler ⇒ rot, nie "0 Findings".
          if ! COUNTS=$(python3 - <<'PY'
          import json, sys
          d = json.load(open('zap-out/zap-report.json', encoding='utf-8'))
          sites = d.get('site')
          if not isinstance(sites, list) or not sites:
              sys.exit("report has no 'site' list")
          alerts = sites[0].get('alerts')
          if not isinstance(alerts, list):
              sys.exit("report has no 'alerts' list")
          fail = sum(1 for a in alerts if a.get('riskcode') == '3')
          high = sum(1 for a in alerts if a.get('riskcode') == '2')
          med  = sum(1 for a in alerts if a.get('riskcode') == '1')
          print(f'{fail}:{high}:{med}')
          PY
          ); then
            echo "::error::ZAP report unlesbar/schemafremd — kein Ergebnis ist kein gruenes Ergebnis"
            exit 1
          fi
          FAIL_COUNT=$(echo "$COUNTS" | cut -d: -f1)
          HIGH_COUNT=$(echo "$COUNTS" | cut -d: -f2)
          MED_COUNT=$(echo "$COUNTS" | cut -d: -f3)
          {
            echo "## 🔓 DAST — ZAP ${SCAN_TYPE}"
            echo "Target: \`${TARGET_URL}\`"
            echo ""
            echo "| Risk | Count |"
            echo "|------|-------|"
            echo "| FAIL (Critical) | ${FAIL_COUNT} |"
            echo "| HIGH | ${HIGH_COUNT} |"
            echo "| MEDIUM | ${MED_COUNT} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAIL_COUNT" -gt 0 ]; then
            MSG="ZAP found ${FAIL_COUNT} FAIL-level alert(s)"
            if [ "$BLOCKING" = "true" ]; then
              echo "::error::${MSG}"; exit 1
            else
              echo "::warning::${MSG} (advisory)"
            fi
          else
            echo "✅ ZAP: no FAIL-level alerts"
          fi

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: zap-report
          path: |
            zap-out/zap-report.json
            zap-out/zap-report.html
          retention-days: 30
