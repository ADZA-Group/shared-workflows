name: "🔥 smoke: e2e"
on:
  workflow_dispatch: {}
  # TEMP for validation (remove after green):
  push:
    branches: [dev]
    paths:
      - ".github/workflows/reusable-e2e.yml"
      - ".github/workflows/_smoke-e2e.yml"
      - "tests/fixtures/e2e/**"

permissions:
  contents: read

jobs:
  e2e:
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      runner-label: '["ubuntu-latest"]'
      # shared-workflows has no root requirements.txt, so the e2e venv step installs
      # nothing — boot-command installs the fixture deps itself (runs in the venv on PATH).
      boot-command: "pip install -q -r tests/fixtures/e2e/requirements.txt && gunicorn -w 1 -b 127.0.0.1:8000 --chdir tests/fixtures/e2e app:app"
      health-url: "http://localhost:8000/health"
      e2e-dir: "tests/fixtures/e2e"
    secrets: inherit
