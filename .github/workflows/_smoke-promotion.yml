name: "🔥 smoke: promotion"
on:
  workflow_dispatch: {}
  workflow_call: {}   # Stufe A: vom Release-Workflow auf dem Kandidaten-Branch aufgerufen

permissions:
  contents: read
  packages: write

jobs:
  policy-logic:
    name: "🛡️ policy ancestry logic"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 3 synthetic cases (ff PASS / no-ff PASS / direct FAIL)
        run: |
          set -e
          check() {
            cd "$1"
            local verdict=FAIL
            HEAD_SHA=$(git rev-parse HEAD)
            if git merge-base --is-ancestor "$HEAD_SHA" dev; then verdict=PASS
            else
              P2=$(git rev-parse "${HEAD_SHA}^2" 2>/dev/null || true)
              if [ -n "$P2" ] && git merge-base --is-ancestor "$P2" dev; then verdict=PASS; fi
            fi
            cd ..; echo "$verdict"
          }
          G="git -c user.name=t -c user.email=t@t"
          mk() { mkdir "$1"; cd "$1"; git init -q -b dev; $G commit -q --allow-empty -m base; cd ..; }
          # Case 1: fast-forward (main HEAD == dev commit)
          mk r1; cd r1; git checkout -q -b main dev; cd ..
          [ "$(check r1)" = "PASS" ] || { echo "::error::case1 ff expected PASS"; exit 1; }
          # Case 2: --no-ff merge of dev into diverged main
          mk r2; cd r2; git checkout -q -b main; $G commit -q --allow-empty -m old-main
          git checkout -q dev; $G commit -q --allow-empty -m feat
          git checkout -q main; $G merge -q --no-ff dev -m merge-dev; cd ..
          [ "$(check r2)" = "PASS" ] || { echo "::error::case2 no-ff expected PASS"; exit 1; }
          # Case 3: direct commit on main (violation)
          mk r3; cd r3; git checkout -q -b main dev; $G commit -q --allow-empty -m direct; cd ..
          [ "$(check r3)" = "FAIL" ] || { echo "::error::case3 direct expected FAIL"; exit 1; }
          echo "✅ all 3 policy cases behave as designed"

  retag-mechanics:
    name: "🚀 candidate->latest retag"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate (load) + push via docker (schema2, wie der Fleet-Pfad)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: tests/fixtures/docker
          file: tests/fixtures/docker/Dockerfile
          push: false
          load: true
          tags: ghcr.io/adza-group/shared-workflows-smoke:candidate-${{ github.sha }}
      - name: Install crane (pinned, sha256-verified)
        env:
          CRANE_VERSION: v0.22.0
          CRANE_SHA256: edb74d53fad9a596860f59d1c5d04a43dfb5f441dc71f57060dd0bf39483c833
        run: |
          curl -sSfL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" -o "$RUNNER_TEMP/crane.tgz"
          echo "${CRANE_SHA256}  $RUNNER_TEMP/crane.tgz" | sha256sum -c --quiet - || { echo "::error::crane checksum mismatch"; exit 1; }
          mkdir -p "$RUNNER_TEMP/crane-bin" && tar xz -C "$RUNNER_TEMP/crane-bin" -f "$RUNNER_TEMP/crane.tgz" crane
          echo "$RUNNER_TEMP/crane-bin" >> "$GITHUB_PATH"
      - name: Push candidate + promote via crane + assert digest equality
        env:
          IMG: ghcr.io/adza-group/shared-workflows-smoke
          SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          docker push "${IMG}:candidate-${SHA}" | tee /tmp/push.log
          PUSHED=$(grep -oE 'digest: sha256:[0-9a-f]{64}' /tmp/push.log | head -1 | cut -d' ' -f2)
          D1=$(crane digest "${IMG}:candidate-${SHA}")
          [ "$D1" = "$PUSHED" ] || { echo "::error::registry digest $D1 != pushed $PUSHED"; exit 1; }
          crane tag "${IMG}@${D1}" latest-smoke
          D2=$(crane digest "${IMG}:latest-smoke")
          echo "pushed=$PUSHED candidate=$D1 latest-smoke=$D2"
          [ "$D1" = "$D2" ] || { echo "::error::digest mismatch after crane tag"; exit 1; }
          # Negativ-Kontrolle: imagetools create haette (schema2) einen anderen Digest erzeugt — nur beobachten.
          docker buildx imagetools create --tag "${IMG}:imagetools-smoke" "${IMG}@${D1}" 2>/dev/null             && echo "imagetools-smoke=$(crane digest "${IMG}:imagetools-smoke") (Beobachtung, kein Gate)" || true
          echo "✅ digest-stable promotion verified (crane)"
