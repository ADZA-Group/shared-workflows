# ═══════════════════════════════════════════════════════════════
# Reusable Frontend Lane — ADZA-Group
# eslint + tsc + (prettier) + vitest + vite build + bundle-size gate.
# Node toolchain — independent of the Python composites. Defaults to ubuntu-hosted.
# Install: npm ci when a lockfile exists, else npm install (+warning).
#
# Usage:
#   uses: adza-group/shared-workflows/.github/workflows/reusable-frontend.yml@v1
#   with: { frontend-dir: frontend }
# ═══════════════════════════════════════════════════════════════

name: "🎨 Frontend"

on:
  workflow_call:
    inputs:
      frontend-dir:
        required: false
        type: string
        default: "frontend"
      node-version:
        required: false
        type: string
        default: "20"
      runner-label:
        required: false
        type: string
        default: '["ubuntu-latest"]'
      run-lint:
        required: false
        type: boolean
        default: true
      run-typecheck:
        required: false
        type: boolean
        default: true
      run-format-check:
        required: false
        type: boolean
        default: false
      run-test:
        required: false
        type: boolean
        default: true
      run-build:
        required: false
        type: boolean
        default: true
      lint-script:
        required: false
        type: string
        default: "lint"
      typecheck-script:
        required: false
        type: string
        default: "typecheck"
      format-script:
        required: false
        type: string
        default: "format:check"
      test-script:
        required: false
        type: string
        default: "test"
      build-script:
        required: false
        type: string
        default: "build"
      build-output-dir:
        required: false
        type: string
        default: "dist"
      bundle-size-limit-kb:
        required: false
        type: number
        default: 0
      lighthouse-url:
        required: false
        type: string
        default: ""
        description: "URL for Lighthouse CI (empty = skip)"
      lighthouse-budget-performance:
        required: false
        type: number
        default: 80
        description: "Minimum Lighthouse performance score (0-100)"
      lighthouse-config:
        required: false
        type: string
        default: ""
        description: "Path to a lighthouserc.json budget (empty = use built-in recommended preset)"
      a11y-enabled:
        required: false
        type: boolean
        default: true
        description: "Run pa11y-ci accessibility checks after build"
      a11y-url:
        required: false
        type: string
        default: ""
        description: "Base URL to a11y-scan (empty = serve the build output locally)"
      a11y-paths:
        required: false
        type: string
        default: "/"
        description: "Space-separated paths appended to the base URL (e.g. '/ /login /about')"
      a11y-threshold:
        required: false
        type: number
        default: 0
        description: "Max allowed pa11y errors per page before failing"
      a11y-serve-port:
        required: false
        type: number
        default: 4173
        description: "Port for the local static server when a11y-url is empty"

permissions:
  contents: read

jobs:
  frontend:
    name: "🎨 Frontend Lane"
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.frontend-dir }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.frontend-dir }}/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::no package-lock.json — using 'npm install' (non-reproducible); commit a lockfile"
            npm install
          fi

      - name: Lint
        if: ${{ inputs.run-lint }}
        continue-on-error: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        env:
          SCRIPT: ${{ inputs.lint-script }}
        run: npm run "$SCRIPT"

      - name: Typecheck
        if: ${{ inputs.run-typecheck }}
        continue-on-error: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        env:
          SCRIPT: ${{ inputs.typecheck-script }}
        run: npm run "$SCRIPT"

      - name: Format check
        if: ${{ inputs.run-format-check }}
        continue-on-error: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        env:
          SCRIPT: ${{ inputs.format-script }}
        run: npm run "$SCRIPT"

      - name: Test
        if: ${{ inputs.run-test }}
        env:
          SCRIPT: ${{ inputs.test-script }}
        run: npm run "$SCRIPT"

      - name: Build
        if: ${{ inputs.run-build }}
        env:
          SCRIPT: ${{ inputs.build-script }}
        run: npm run "$SCRIPT"

      - name: Bundle size gate
        if: ${{ inputs.run-build && inputs.bundle-size-limit-kb > 0 }}
        env:
          OUT: ${{ inputs.build-output-dir }}
          LIMIT: ${{ inputs.bundle-size-limit-kb }}
        run: |
          if [ ! -d "$OUT" ]; then echo "::error::build output dir '$OUT' not found"; exit 1; fi
          TOTAL_KB=$(du -sk "$OUT" | cut -f1)
          {
            echo "## 🎨 Frontend bundle"
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Build output | **${TOTAL_KB} KB** |"
            echo "| Limit | ${LIMIT} KB |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL_KB" -gt "$LIMIT" ]; then
            echo "::error::bundle ${TOTAL_KB} KB > ${LIMIT} KB"; exit 1
          fi

      - name: Lighthouse CI
        if: ${{ inputs.run-build && inputs.lighthouse-url != '' }}
        env:
          LHCI_URL: ${{ inputs.lighthouse-url }}
          LHCI_BUDGET: ${{ inputs.lighthouse-budget-performance }}
          LHCI_CONFIG: ${{ inputs.lighthouse-config }}
        run: |
          npm install -g @lhci/cli@0.14.x --silent
          lhci collect --url="$LHCI_URL" --numberOfRuns=1 --settings.chromeFlags="--no-sandbox"
          if [ -n "${LHCI_CONFIG:-}" ] && [ -f "${LHCI_CONFIG}" ]; then
            ASSERT_ARGS="--config=${LHCI_CONFIG}"
          else
            ASSERT_ARGS="--preset=lighthouse:recommended"
          fi
          SCORE=$(lhci assert $ASSERT_ARGS 2>/dev/null \
            | grep -oE 'performance: [0-9]+' | grep -oE '[0-9]+' || echo 0)
          {
            echo "## 🔦 Lighthouse"
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Performance | ${SCORE} |"
            echo "| Budget | ${LHCI_BUDGET} |"
            echo "| URL | ${LHCI_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}

      - name: Accessibility (pa11y-ci)
        if: ${{ inputs.a11y-enabled && (inputs.a11y-url != '' || inputs.run-build) }}
        continue-on-error: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        env:
          A11Y_URL: ${{ inputs.a11y-url }}
          A11Y_PATHS: ${{ inputs.a11y-paths }}
          A11Y_THRESHOLD: ${{ inputs.a11y-threshold }}
          A11Y_PORT: ${{ inputs.a11y-serve-port }}
          OUT: ${{ inputs.build-output-dir }}
        run: |
          set -o pipefail
          SERVER_PID=""
          cleanup() { [ -n "$SERVER_PID" ] && kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          if [ -z "$A11Y_URL" ]; then
            if [ ! -d "$OUT" ]; then
              echo "::warning::a11y: no build output '$OUT' and no a11y-url — skipping"
              exit 0
            fi
            echo "serving '$OUT' on :$A11Y_PORT"
            npx --yes serve -s "$OUT" -l "$A11Y_PORT" >/tmp/serve.log 2>&1 &
            SERVER_PID=$!
            BASE="http://localhost:${A11Y_PORT}"
            for i in $(seq 1 30); do
              curl -fsS "$BASE" >/dev/null 2>&1 && break
              sleep 1
            done
          else
            BASE="${A11Y_URL%/}"
          fi

          # Build the URL list + a pa11y-ci config with CI-safe Chrome flags.
          URLS=""
          for p in $A11Y_PATHS; do
            case "$p" in
              /*) URLS="$URLS \"${BASE}${p}\"," ;;
              *)  URLS="$URLS \"${BASE}/${p}\"," ;;
            esac
          done
          URLS="${URLS%,}"
          if [ -z "$URLS" ]; then
            echo "::error::a11y: no paths to scan (a11y-paths is empty) — refusing vacuous pass"
            exit 1
          fi
          cat > /tmp/.pa11yci.json <<JSON
          {
            "defaults": {
              "threshold": ${A11Y_THRESHOLD},
              "chromeLaunchConfig": { "args": ["--no-sandbox", "--disable-dev-shm-usage"] },
              "timeout": 30000
            },
            "urls": [ ${URLS} ]
          }
          JSON
          echo "pa11y-ci config:"; cat /tmp/.pa11yci.json
          npx --yes pa11y-ci --config /tmp/.pa11yci.json | tee /tmp/pa11y.out
          {
            echo "## ♿ Accessibility (pa11y-ci)"
            echo '```'
            tail -n 30 /tmp/pa11y.out || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
