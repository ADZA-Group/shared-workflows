# Manual smoke for reusable-docker-build. Runnable AFTER dev is pushed.
# push=false → exercises build + size-gate + Trivy + SBOM only (no GHCR/sign).
# push=true  → echter Push in den Fixture-Namespace ghcr.io/adza-group/smoke-fixture:
#              Verify-Tag → Digest → Retag → cosign/attest (Audit 2026-09-03, Fund 3).
name: "🧪 Smoke — Docker Build"

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Echter Push nach ghcr.io/adza-group/smoke-fixture (Verify→Retag-Pfad)"
        type: boolean
        default: false
      runner-label:
        description: "JSON-Array. ACHTUNG: self-hosted wird aus diesem PUBLIC Repo NIE bedient (Runner-Group allows_public_repositories=false, GEMESSEN 03.09.) — Job haengt endlos in der Queue."
        type: string
        default: '["ubuntu-latest"]'
  workflow_call:   # Stufe A: vom Release-Workflow auf dem Kandidaten-Branch aufgerufen
    inputs:
      push:
        type: boolean
        default: false
      runner-label:
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read
  packages: write       # reusable-docker-build's job declares these unconditionally,
  id-token: write        # so the caller must grant them even when push=false
  attestations: write    # (GitHub fails the run at startup if the callee exceeds the caller)

jobs:
  build:
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      runner-label: ${{ inputs.runner-label || '["ubuntu-latest"]' }}
      image-name: ghcr.io/adza-group/smoke-fixture
      context: tests/fixtures/docker
      dockerfile: tests/fixtures/docker/Dockerfile
      push: ${{ inputs.push == true }}
      image-size-limit-mb: 600
      smoke-command: 'docker run --rm "$IMAGE"'
    secrets: inherit
