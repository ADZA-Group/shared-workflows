# Self-hosted (Debian-13) validation of reusable-ci.yml — the never-done step.
# 2 shards on purpose: both spin up a postgres service on the SAME LXC-104 Docker
# daemon → exercises M4 (host-port 5432 collision). push:[dev] trigger is TEMPORARY.
name: "🧪 Smoke — CI Orchestrator (self-hosted)"

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write
  checks: write
  issues: write
  pull-requests: write

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      app-name: smoke-fixture-sh
      # NO runner-label override → uses reusable-ci default [self-hosted, linux, proxmox]
      coverage-threshold: 0
      test-shards: >-
        [{"name":"shardA","paths":"tests/fixtures/app","cov":"tests/fixtures/app"},
         {"name":"shardB","paths":"tests/fixtures/app","cov":"tests/fixtures/app"}]
      test-env: "{}"
      enable-push: false
      dockerfile: tests/fixtures/docker/Dockerfile
      docker-context: tests/fixtures/docker
      image-name: ghcr.io/adza-group/smoke-fixture-sh
      has-frontend: false
      staging-url: ""
      prod-url: ""
      deploy-prod: false
      enable-property-tests: false
      enable-mutation: false
      enable-load-test: false
      enable-dast: false
    secrets: inherit
