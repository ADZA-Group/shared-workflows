# ═══════════════════════════════════════════════════════════════
# Reusable Docker Build / Scan / Push / Sign — ADZA-Group (senior)
#
# build(load) → size-gate → Trivy image scan (dual-gate) → smoke → SBOM
# and when push=true: GHCR login → metadata tags → :previous backup (main)
# → push → cosign keyless sign + SLSA provenance.
#
# Audit 2026-09-03 (Fund 3): das GESCANNTE Image ist das GEPUSHTE Image.
# Das lokal geladene, geprüfte amd64-Image wird per `docker push` unter allen
# Tags gesetzt — kein zweiter Build, dessen Layer sich von den geprüften
# unterscheiden könnten. Entrümpelung 2026-09-04: multi-arch (QEMU, zweiter
# buildx-Build) und gated-promotion (:candidate) entfernt — kein Caller nutzte
# sie; cosign + SLSA nur noch auf main/tags (Staging-Images bewusst ohne
# Signatur: es gibt keinen Verifizierer im Deploy-Pfad, Watchtower prüft nichts).
#
# Usage:
#   uses: adza-group/shared-workflows/.github/workflows/reusable-docker-build.yml@v1
#   with:
#     image-name: ghcr.io/adza-group/my-app
#     push: true
#     sign-image: true
#   secrets: inherit
# ═══════════════════════════════════════════════════════════════

name: "🐳 Docker Build"

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
        description: "Full image name (e.g. ghcr.io/adza-group/my-app)"
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"
      context:
        required: false
        type: string
        default: "."
      runner-label:
        required: false
        type: string
        default: '["self-hosted", "linux", "proxmox"]'
      push:
        required: false
        type: boolean
        default: false
      image-size-limit-mb:
        required: false
        type: number
        default: 800
      run-trivy:
        required: false
        type: boolean
        default: true
      generate-sbom:
        required: false
        type: boolean
        default: true
      sign-image:
        required: false
        type: boolean
        default: true
        description: "cosign keyless + SLSA provenance — nur auf main/tags (Entruempelung 2026-09-04): Staging-Images bleiben unsigniert, weil nichts im Deploy-Pfad Signaturen prueft."
      light:
        required: false
        type: boolean
        default: false
        description: "dev-push (light CI): Trivy/SBOM ueberspringen — nur Build+Push. main/PR/tag bleiben voll gescannt."
      build-args:
        required: false
        type: string
        default: ""
      cache-from:
        required: false
        type: string
        default: "type=gha"
      smoke-command:
        required: false
        type: string
        description: "Optional shell command to smoke-test the loaded image ($IMAGE env = ci tag). Wird per `bash -c` ausgefuehrt — bewusst Code, Vertrauensgrenze = Caller-Workflow."
        default: ""
      tag-config:
        required: false
        type: string
        description: "docker/metadata-action tags block (deploy tags :staging/:latest werden ref-basiert vom Workflow ergänzt — NICHT hier definieren)"
        default: |
          type=ref,event=branch
          type=ref,event=tag
          type=sha,prefix={{branch}}-,format=short
    outputs:
      image-tag:
        description: "Local CI image tag (single-arch, loaded)"
        value: ${{ jobs.build.outputs.tag }}
      image-size-mb:
        description: "Image size in MB"
        value: ${{ jobs.build.outputs.size }}
      digest:
        description: "Pushed image digest (empty when push=false)"
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    name: "🐳 Build + Scan + Push/Sign"
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      # Ein Ort fuer den lokalen CI-Tag; alle Steps lesen ihn aus env statt per
      # ${{ }} in run: (Audit 2026-09-03, Fund 1+2: Caller-Inputs nie in Shell-Text).
      IMAGE_NAME: ${{ inputs.image-name }}
      CI_TAG: ${{ inputs.image-name }}:ci-${{ github.run_id }}
    outputs:
      tag: ${{ steps.localtag.outputs.tag }}
      size: ${{ steps.size.outputs.mb }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # Metadata VOR dem Build: die OCI-Labels gehoeren ins gescannte Image, denn
      # genau dieses Image wird gepusht (kein Re-Build mehr, s. Kopf).
      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ inputs.image-name }}
          # Deploy-Tags ref-basiert (NICHT {{is_default_branch}}: ADZA-Repos haben dev als
          # Default-Branch → is_default_branch taggte :latest auf dev-Builds → Watchtower
          # deployte dev-Images auf PROD; :staging wurde dagegen nie getaggt → Staging fror ein).
          tags: |
            ${{ inputs.tag-config }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (single-arch, load for scan)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          tags: ${{ inputs.image-name }}:ci-${{ github.run_id }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ inputs.cache-from }}
          cache-to: type=gha,mode=max
          build-args: |
            ${{ inputs.build-args }}
            GIT_SHA=${{ github.sha }}

      - name: Local tag output
        id: localtag
        run: echo "tag=$CI_TAG" >> "$GITHUB_OUTPUT"

      - name: "📏 Image Size Gate"
        id: size
        env:
          LIMIT_MB: ${{ inputs.image-size-limit-mb }}
        run: |
          SIZE_BYTES=$(docker image inspect "$CI_TAG" --format='{{.Size}}')
          MB=$((SIZE_BYTES / 1024 / 1024))
          LAYERS=$(docker image inspect "$CI_TAG" --format='{{len .RootFS.Layers}}')
          echo "mb=$MB" >> "$GITHUB_OUTPUT"
          {
            echo "## 🐳 Docker Image"
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Size | **${MB} MB** |"
            echo "| Layers | ${LAYERS} |"
            echo "| Limit | ${LIMIT_MB} MB |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MB" -gt "$LIMIT_MB" ]; then
            echo "::error::Image too large: ${MB} MB (max ${LIMIT_MB} MB)"; exit 1
          fi

      - name: "🔍 Trivy Image Scan (gate)"
        if: ${{ inputs.run-trivy && !inputs.light }}
        env:
          # Authentifizierter GHCR-Pull der Trivy-Vuln-DB (ghcr.io/aquasecurity/trivy-db).
          # Ohne Token -> anonymer Pull -> intermittierend "DENIED: denied" -> FATAL, Build rot.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ inputs.image-name }}:ci-${{ github.run_id }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && '1' || '0' }}

      - name: "🔥 Smoke boot"
        if: ${{ inputs.smoke-command != '' }}
        env:
          IMAGE: ${{ inputs.image-name }}:ci-${{ github.run_id }}
          SMOKE_CMD: ${{ inputs.smoke-command }}
        run: bash -c "$SMOKE_CMD"

      - name: "📋 SBOM (CycloneDX)"
        if: ${{ inputs.generate-sbom && !inputs.light }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # s.o. — authentifizierter Trivy-DB-Pull
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ inputs.image-name }}:ci-${{ github.run_id }}
          format: cyclonedx
          output: sbom.json

      - name: Upload SBOM
        if: ${{ inputs.generate-sbom && !inputs.light }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

      - name: GHCR login
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # crane (go-containerregistry, gepinnt + sha256): Registry-Operationen byte-identisch.
      # GEMESSEN 03.09. (Smoke 33753622330): `docker buildx imagetools create` serialisiert
      # per docker gepushte schema2-Manifeste neu (anderer Digest) — crane tag kopiert das
      # Manifest unveraendert. Inline statt Composite: ein neues Composite waere per @v1
      # erst NACH dem Release aufloesbar (Henne-Ei), inline ist sofort smoke-bar.
      - name: Install crane (pinned, sha256-verified)
        if: ${{ inputs.push }}
        env:
          CRANE_VERSION: v0.22.0
          CRANE_SHA256: edb74d53fad9a596860f59d1c5d04a43dfb5f441dc71f57060dd0bf39483c833
        run: |
          curl -sSfL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" -o "$RUNNER_TEMP/crane.tgz"
          echo "${CRANE_SHA256}  $RUNNER_TEMP/crane.tgz" | sha256sum -c --quiet - || { echo "::error::crane checksum mismatch"; exit 1; }
          mkdir -p "$RUNNER_TEMP/crane-bin" && tar xz -C "$RUNNER_TEMP/crane-bin" -f "$RUNNER_TEMP/crane.tgz" crane
          echo "$RUNNER_TEMP/crane-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/crane-bin/crane" version

      # Backup-Steps (Audit 2026-09-03, Fund 6): kein continue-on-error — ein Registry-/
      # Auth-/Netzfehler beim Backup blockt den Push, sonst rollt ein spaeterer Auto-
      # Rollback auf ein veraltetes :previous. "Tag existiert nicht" (Erst-Push) wird per
      # Registry-Fehlercode (MANIFEST_UNKNOWN/NAME_UNKNOWN) von "Fehler" unterschieden.
      # crane tag kopiert byte-identisch; der Ziel-Digest wird gegengemessen.
      - name: "Backup :latest -> :previous (main only)"
        if: ${{ inputs.push && github.ref == 'refs/heads/main' }}
        env: { FROM: latest, TO: previous }
        run: |
          if ! SRC=$(crane digest "${IMAGE_NAME}:${FROM}" 2>/tmp/crane.err); then
            if grep -qiE 'MANIFEST_UNKNOWN|manifest unknown|NAME_UNKNOWN' /tmp/crane.err; then
              echo "::notice::no existing :${FROM} to back up (first push)"; exit 0
            fi
            echo "::error::crane digest ${IMAGE_NAME}:${FROM} failed — Backup unklar, Push geblockt"; cat /tmp/crane.err; exit 1
          fi
          # Transiente Registry-Fehler (GEMESSEN footballapp Run 33857324195, 04.09.: GET per Digest
          # 2 h nach dem Push einmalig MANIFEST_UNKNOWN, 23 min spaeter 200 — Diagnose-Run 33860231459)
          # blocken nicht sofort: 3 Versuche, 10 s Abstand. Der Digest kam gerade per HEAD — ein 404
          # hier ist kein Erst-Push, sondern ein Wackler; nach 3 Fehlversuchen bleibt der Push geblockt.
          retry() { local n=$1 d=$2 i; shift 2; for i in $(seq 1 "$n"); do "$@" && return 0; [ "$i" -lt "$n" ] && { echo "::warning::$* fehlgeschlagen (Versuch $i/$n) — Retry in ${d}s" >&2; sleep "$d"; }; done; return 1; }
          retry 3 10 crane tag "${IMAGE_NAME}@${SRC}" "${TO}"
          DST=$(retry 3 10 crane digest "${IMAGE_NAME}:${TO}")
          [ "$DST" = "$SRC" ] || { echo "::error::backup :${TO} resolved to ${DST}, expected ${SRC}"; exit 1; }
          echo "::notice::backed up :${FROM} -> :${TO} (${SRC})"

      - name: "Backup :staging -> :staging-previous (dev only)"
        if: ${{ inputs.push && github.ref == 'refs/heads/dev' }}
        env: { FROM: staging, TO: staging-previous }
        run: |
          if ! SRC=$(crane digest "${IMAGE_NAME}:${FROM}" 2>/tmp/crane.err); then
            if grep -qiE 'MANIFEST_UNKNOWN|manifest unknown|NAME_UNKNOWN' /tmp/crane.err; then
              echo "::notice::no existing :${FROM} to back up (first push)"; exit 0
            fi
            echo "::error::crane digest ${IMAGE_NAME}:${FROM} failed — Backup unklar, Push geblockt"; cat /tmp/crane.err; exit 1
          fi
          # Transiente Registry-Fehler (GEMESSEN footballapp Run 33857324195, 04.09.: GET per Digest
          # 2 h nach dem Push einmalig MANIFEST_UNKNOWN, 23 min spaeter 200 — Diagnose-Run 33860231459)
          # blocken nicht sofort: 3 Versuche, 10 s Abstand. Der Digest kam gerade per HEAD — ein 404
          # hier ist kein Erst-Push, sondern ein Wackler; nach 3 Fehlversuchen bleibt der Push geblockt.
          retry() { local n=$1 d=$2 i; shift 2; for i in $(seq 1 "$n"); do "$@" && return 0; [ "$i" -lt "$n" ] && { echo "::warning::$* fehlgeschlagen (Versuch $i/$n) — Retry in ${d}s" >&2; sleep "$d"; }; done; return 1; }
          retry 3 10 crane tag "${IMAGE_NAME}@${SRC}" "${TO}"
          DST=$(retry 3 10 crane digest "${IMAGE_NAME}:${TO}")
          [ "$DST" = "$SRC" ] || { echo "::error::backup :${TO} resolved to ${DST}, expected ${SRC}"; exit 1; }
          echo "::notice::backed up :${FROM} -> :${TO} (${SRC})"

      # Single-arch: das GEPRUEFTE lokale Image wird gepusht — gleiche Bytes wie
      # Size-Gate/Trivy/Smoke/SBOM gesehen haben, per Konstruktion. Reihenfolge
      # (Codex-Fund R1-E1): ERST unter einem NICHT deployenden Verify-Tag hochladen
      # (Watchtower zieht nur :staging/:latest), Digest bestimmen, DANN die weiteren
      # Tags per `docker push` desselben Images setzen, Deploy-Tag zuletzt. Scheitert
      # irgendetwas davor, ist kein Deploy-Tag bewegt worden. Verify-Tag ist pro
      # Branch fix (wird ueberschrieben, akkumuliert nicht).
      - name: Push scanned image (verify-tag first, deploy tag last)
        if: ${{ inputs.push }}
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -o pipefail            # `docker push | tee` darf einen Push-Fehler nicht maskieren
          shopt -s inherit_errexit   # `set -e` gilt sonst NICHT in $(…) (Bash-Default; Codex-Fund R4-E1)
          # Jeder Tag wird per `docker push` desselben lokalen Images gesetzt — der Manifest-
          # Digest ist dann fuer alle Tags identisch. GEMESSEN (Smoke 33753622330): `docker
          # buildx imagetools create <tag> <image>@<digest>` serialisiert einen per docker
          # gepushten schema2-Manifest NEU (Tag loeste auf einen anderen Digest auf) —
          # deshalb kein imagetools create mehr in diesem Job.
          push_tag() {   # $1 = Ziel-Tag; gibt den Manifest-Digest aus der push-Ausgabe zurueck
            docker tag "$CI_TAG" "$1" || return $?
            # Expliziter Rueckgabe-Check: ein Push, der erst den Digest druckt und dann
            # fehlschlaegt, darf nicht als Erfolg geparst werden.
            docker push "$1" | tee /tmp/push.log >&2 || return $?
            grep -oE 'digest: sha256:[0-9a-f]{64}' /tmp/push.log | head -1 | cut -d' ' -f2
          }
          VERIFY="${IMAGE_NAME}:verify-$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-')"
          DIGEST=$(push_tag "$VERIFY")
          [ -n "$DIGEST" ] || { echo "::error::no digest in push output for $VERIFY"; exit 1; }
          # Gegenprobe: Registry loest den Digest auf (das ist, was Watchtower ziehen wird).
          retry() { local n=$1 d=$2 i; shift 2; for i in $(seq 1 "$n"); do "$@" && return 0; [ "$i" -lt "$n" ] && { echo "::warning::$* fehlgeschlagen (Versuch $i/$n) — Retry in ${d}s" >&2; sleep "$d"; }; done; return 1; }
          [ "$(retry 3 10 crane digest "${IMAGE_NAME}@${DIGEST}")" = "$DIGEST" ] || { echo "::error::pushed digest ${DIGEST} not resolvable in registry"; exit 1; }
          # Reihenfolge (Codex-Fund R2-E1): erst alle NICHT deployenden Tags, der Deploy-Tag
          # (:staging / :latest) als letzte mutierende Operation. Alle harten Pruefungen
          # liegen davor; was bleibt, ist die Registry-Grundunsicherheit
          # "Server mutiert, Client verliert die Antwort" — keine absolute Garantie.
          NORMAL=(); DEPLOY=()
          while IFS= read -r T; do
            [ -n "$T" ] || continue
            case "$T" in
              *:staging|*:latest) DEPLOY+=("$T") ;;
              *) NORMAL+=("$T") ;;
            esac
          done <<< "$TAGS"
          [ "${#DEPLOY[@]}" -le 1 ] || { echo "::error::more than one deploy tag in one push (${DEPLOY[*]}) — refusing"; exit 1; }
          N=$(( ${#NORMAL[@]} + ${#DEPLOY[@]} ))
          [ "$N" -gt 0 ] || { echo "::error::no tags set (metadata produced none)"; exit 1; }
          for T in "${NORMAL[@]}"; do
            D=$(push_tag "$T")
            [ "$D" = "$DIGEST" ] || { echo "::error::tag $T pushed as ${D:-?}, expected ${DIGEST} — deploy tag NOT touched"; exit 1; }
          done
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          for T in "${DEPLOY[@]}"; do
            D=$(push_tag "$T")   # letzte mutierende Operation; danach nur noch Soft-Check
            [ "$D" = "$DIGEST" ] || echo "::warning::deploy tag $T pushed as ${D:-?}, expected ${DIGEST} (tag was set; verify manually)"
          done
          echo "::notice::pushed scanned image ${DIGEST} as ${VERIFY}; ${#NORMAL[@]} normal tag(s) verified, then deploy tag(s): ${DEPLOY[*]:-none}"

      # Signieren nur auf main/tags (Entruempelung 2026-09-04): dev-Pushes sind das Gros der
      # Laeufe, nichts im Deploy-Pfad prueft Signaturen — Provenance bleibt fuer Prod erhalten.
      - name: Install cosign (github-hosted)
        if: ${{ inputs.push && inputs.sign-image && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && runner.environment == 'github-hosted' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Self-hosted (Audit 2026-09-03, Fund D): der Installer kostete 116 s pro Build
      # (Job 100301553891), weil sein actions/cache-Restore auf der persistenten Platte
      # reine Netzlast ist (dieselbe Lehre wie pip v1.9.2). Stattdessen: einmal laden,
      # sha256 gegen die im Workflow gepinnte Summe pruefen — bei JEDER Wiederverwendung
      # erneut (ein manipulierter Cache wird nie ungeprueft ausgefuehrt), atomar per mv.
      - name: Install cosign (self-hosted, cached + verified)
        if: ${{ inputs.push && inputs.sign-image && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && runner.environment != 'github-hosted' }}
        env:
          COSIGN_VERSION: v3.1.3
          COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
        run: |
          DIR="$HOME/.cache/adza/cosign-${COSIGN_VERSION}"
          BIN="$DIR/cosign"
          mkdir -p "$DIR"
          ok() { [ -f "$BIN" ] && echo "${COSIGN_SHA256}  ${BIN}" | sha256sum -c --quiet - 2>/dev/null; }
          if ! ok; then
            TMP=$(mktemp "$DIR/.cosign.XXXXXX")
            curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o "$TMP"
            echo "${COSIGN_SHA256}  ${TMP}" | sha256sum -c --quiet - || { rm -f "$TMP"; echo "::error::cosign checksum mismatch"; exit 1; }
            chmod 0755 "$TMP" && mv -f "$TMP" "$BIN"
          fi
          ok || { echo "::error::cosign binary failed verification after install"; exit 1; }
          echo "$DIR" >> "$GITHUB_PATH"
          "$BIN" version | head -3

      - name: Cosign sign (keyless)
        if: ${{ inputs.push && inputs.sign-image && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        continue-on-error: true   # best-effort: Sigstore/Rekor outages or org limits must not fail a pushed build
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      - name: SLSA build provenance
        if: ${{ inputs.push && inputs.sign-image && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        continue-on-error: true   # GitHub Artifact Attestations need a paid plan / public repo; advisory on free private orgs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ inputs.image-name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
