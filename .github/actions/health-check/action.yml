# ═══════════════════════════════════════════════════════════════
# Composite Action: Health Check — ADZA-Group
#
# Polls an endpoint until ready, with security header validation.
# Usage:
#   - uses: ADZA-Group/shared-workflows/.github/actions/health-check@v1
#     with:
#       url: "https://app.adza-group.ch"
#       max-retries: 20
# ═══════════════════════════════════════════════════════════════

name: "✅ Health Check"
description: "Polls URL until ready, validates security headers"

inputs:
  url:
    description: "URL to check"
    required: true
  max-retries:
    description: "Max polling attempts"
    required: false
    default: "20"
  retry-delay:
    description: "Seconds between retries"
    required: false
    default: "15"
  check-security-headers:
    description: "Validate security headers"
    required: false
    default: "true"
  expected-status:
    description: "Expected HTTP status code"
    required: false
    default: "200"
  expected-version:
    description: "If set (e.g. github.sha), assert the running app reports this version/sha. Empty = skip (legacy 200-only)."
    required: false
    default: ""
  version-url:
    description: "URL that returns the running version (JSON .sha/.version or X-App-Version header). Empty = use 'url'."
    required: false
    default: ""

outputs:
  status:
    description: "HTTP status code"
    value: ${{ steps.check.outputs.status }}
  response-time:
    description: "Response time in seconds"
    value: ${{ steps.check.outputs.time }}

runs:
  using: composite
  steps:
    - name: Poll endpoint
      id: check
      shell: bash
      env:
        URL: ${{ inputs.url }}
        MAX: ${{ inputs.max-retries }}
        DELAY: ${{ inputs.retry-delay }}
        EXPECTED: ${{ inputs.expected-status }}
      run: |
        echo "Polling $URL (max ${MAX}x${DELAY}s)..."
        for i in $(seq 1 "$MAX"); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" 2>/dev/null || echo "000")
          TIME=$(curl -s -o /dev/null -w "%{time_total}" --max-time 10 "$URL" 2>/dev/null || echo "0")

          if [ "$STATUS" = "$EXPECTED" ]; then
            echo "✅ Ready after attempt $i (HTTP $STATUS, ${TIME}s)"
            echo "status=$STATUS" >> $GITHUB_OUTPUT
            echo "time=$TIME" >> $GITHUB_OUTPUT
            break
          fi

          echo "  Attempt $i/$MAX: HTTP $STATUS (expected $EXPECTED)"
          if [ "$i" = "$MAX" ]; then
            echo "::error::Health check failed after $MAX attempts (last: HTTP $STATUS)"
            echo "status=$STATUS" >> $GITHUB_OUTPUT
            echo "time=0" >> $GITHUB_OUTPUT
            exit 1
          fi
          sleep "$DELAY"
        done

    - name: Security headers
      if: inputs.check-security-headers == 'true'
      shell: bash
      env:
        URL: ${{ inputs.url }}
      run: |
        HEADERS=$(curl -sI --max-time 10 "$URL" 2>/dev/null)
        FAIL=0

        echo "## 🔒 Security Headers" >> $GITHUB_STEP_SUMMARY
        echo "| Header | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY

        for H in "X-Content-Type-Options" "X-Frame-Options" "Strict-Transport-Security"; do
          if echo "$HEADERS" | grep -qi "$H"; then
            echo "| $H | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| $H | ❌ Missing |" >> $GITHUB_STEP_SUMMARY
            echo "::warning::Security header missing: $H"
            FAIL=1
          fi
        done

        if [ "$FAIL" = "1" ]; then
          echo "::warning::Some security headers are missing"
        fi

    - name: Version assert (running image == built image)
      if: inputs.expected-version != ''
      shell: bash
      env:
        EXPECTED: ${{ inputs.expected-version }}
        VURL: ${{ inputs.version-url != '' && inputs.version-url || inputs.url }}
        MAXV: ${{ inputs.max-retries }}
        DELAYV: ${{ inputs.retry-delay }}
      run: |
        # POLL-until-match (nicht one-shot!): der 200-Poll oben wird sofort vom ALTEN
        # Image beantwortet; der Deploy-Flip (Watchtower-Pull) braucht 1..Poll-Intervall
        # Sekunden. Wir pollen die Version mit demselben Budget wie den Health-Poll.
        # Fallbacks setzen GOT="" explizit, damit fehlendes python3 / Parse-Fehler als
        # "no version" sichtbar failen — nie als False-Pass.
        fetch_got() {
          local HDRS BODY HDR
          HDRS=$(mktemp)
          BODY=$(curl -s -D "$HDRS" --max-time 10 "$VURL" 2>/dev/null) || BODY=""
          HDR=$(tr -d '\r' < "$HDRS" | awk -F': ' 'tolower($1)=="x-app-version"{print $2}')
          rm -f "$HDRS"
          # Akzeptierte JSON-Felder: sha (recyclage), commit (rechnungsapp, Kurz-SHA), version.
          # Reihenfolge wichtig: `version` ist bei rechnungsapp "0.9.5" — nur Fallback.
          GOT=$(printf '%s' "$BODY" | python3 -c \
            "import sys,json; s=sys.stdin.read(); d=json.loads(s) if s.strip() else {}; print(d.get('sha') or d.get('commit') or d.get('version') or '')" \
            2>/dev/null) || GOT=""
          # Explizites if statt '[ ] &&' — als LETZTE Zeile der Funktion wuerde der
          # fehlschlagende -z-Test (= GOT vorhanden = ERFOLGSFALL!) den Funktions-
          # Status 1 setzen und 'set -e' das Script vor dem Match-Check killen.
          if [ -z "$GOT" ]; then GOT="$HDR"; fi
          return 0
        }
        for i in $(seq 1 "$MAXV"); do
          fetch_got
          if [ -n "$GOT" ] && [ "${GOT:0:7}" = "${EXPECTED:0:7}" ]; then
            echo "version ${GOT:0:7} matches expected ${EXPECTED:0:7} (attempt $i)"
            exit 0
          fi
          echo "  attempt $i/$MAXV: running '${GOT:0:7}' != expected '${EXPECTED:0:7}' (deploy noch nicht geflippt?)"
          [ "$i" = "$MAXV" ] && break
          sleep "$DELAYV"
        done
        if [ -z "$GOT" ]; then
          echo "::error::version-assert: no sha/version at $VURL (expected ${EXPECTED:0:7}). App must expose it -- see README 'Version App-Contract'."
        else
          echo "::error::deploy did not flip within the poll budget: running ${GOT:0:7}, expected ${EXPECTED:0:7} (watchtower poll/creds pruefen)"
        fi
        exit 1
