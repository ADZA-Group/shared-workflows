# Run ONE pytest shard. Emits .coverage.<shard> (data file, for combine) + junit-<shard>.xml.
# Assumes a venv is already on PATH (setup-python-deps ran first) and that any DB/redis
# services + env vars are provided by the calling JOB (composites cannot declare services).
name: "Run pytest shard"
description: "Run one test shard, emit coverage data file + junit xml, upload both"

inputs:
  shard-name:
    description: "Unique shard id (used in artifact + file names)"
    required: true
  test-paths:
    description: "Space-separated test paths (used when markers is empty)"
    required: false
    default: ""
  markers:
    description: "pytest -m expression (takes precedence over test-paths)"
    required: false
    default: ""
  coverage-source:
    description: "Module/dir passed to --cov"
    required: false
    default: "."
  timeout:
    description: "Per-test timeout seconds"
    required: false
    default: "60"
  test-reruns:
    description: "Auto-rerun failed tests N times (flaky mitigation; 0 disables)"
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - name: Run pytest (collect coverage data, no report)
      shell: bash
      env:
        COVERAGE_FILE: .coverage.${{ inputs.shard-name }}
        SHARD: ${{ inputs.shard-name }}
        # Audit 2026-09-03 (Fund 1+2): Inputs nur ueber env, nie als Shell-Quelltext.
        # test-paths ist eine Liste — bewusste Wortzerlegung per read -ra (Array).
        TEST_PATHS: ${{ inputs.test-paths }}
        MARKERS: ${{ inputs.markers }}
        COV_SRC: ${{ inputs.coverage-source }}
        TEST_TIMEOUT: ${{ inputs.timeout }}
        RERUNS: ${{ inputs.test-reruns }}
      run: |
        # Portable coverage data: store RELATIVE source paths so a separate
        # coverage-gate job (different workspace) can resolve them. Apps that
        # ship their own coverage config must also set [run] relative_files = true.
        if [ ! -f .coveragerc ]; then
          printf '[run]\nrelative_files = true\n' > .coveragerc
        fi
        export COVERAGE_RCFILE=.coveragerc
        if [ -n "$MARKERS" ]; then
          SELECT=(-m "$MARKERS")
        else
          # Unquoted mit Absicht: Wortzerlegung UND Pathname-Expansion (Caller-Globs wie
          # `tests/test_features_*.py`, footballapp). `read -ra` liess den Glob woertlich
          # stehen (Regression 03.09., GEMESSEN). Kein eval — nur Bash-Globbing auf Daten.
          # shellcheck disable=SC2206
          SELECT=($TEST_PATHS)
          # Jeder Eintrag muss existieren: ein Glob ohne Treffer bleibt woertlich stehen und
          # wuerde pytest "file not found" liefern — hier klar benannt statt kryptisch (Codex).
          [ "${#SELECT[@]}" -gt 0 ] || { echo "::error::test-paths leer nach Expansion"; exit 1; }
          for p in "${SELECT[@]}"; do
            [ -e "$p" ] || { echo "::error::test path '$p' existiert nicht (Glob ohne Treffer / Tippfehler im Caller-Shard)"; exit 1; }
          done
        fi
        # Flaky mitigation: rerun failed tests (pytest-rerunfailures). NOTE: reruns do NOT
        # appear in --junitxml (verified pytest 9.1.1 + rerunfailures 16.4, xunit1+xunit2).
        # Der observe-only Flake-Radar (Plugin + Ledger) wurde 2026-09-04 entfernt: kein Konsument.
        # ACHTUNG Paketname: `pytest-rerunfailures` (ohne Bindestrich in der Mitte).
        # Bis 2026-07-15 stand hier `pytest-rerun-failures` — das gibt es auf PyPI NICHT
        # (404), der Install schlug jedes Mal still fehl und `test-reruns` war seit
        # v1.5.0 fleet-weit wirkungslos. Der Import-Check unten ist die Absicherung:
        # er meldet jetzt LAUT, statt Reruns kommentarlos wegzulassen.
        RERUN=()
        if [ "$RERUNS" != "0" ]; then
          pip install -q pytest-rerunfailures || echo "::warning::pytest-rerunfailures install failed — flaky reruns disabled"
          if python -c "import pytest_rerunfailures" 2>/dev/null; then
            RERUN=(--reruns "$RERUNS" --reruns-delay 1)
          else
            echo "::warning::pytest_rerunfailures not importable — running WITHOUT --reruns"
          fi
        fi
        pytest "${SELECT[@]}" \
          --timeout="$TEST_TIMEOUT" \
          "${RERUN[@]}" \
          --cov="$COV_SRC" --cov-report= \
          --junitxml="junit-${SHARD}.xml" \
          -p no:cacheprovider

    - name: Upload coverage data
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      continue-on-error: true
      with:
        name: covdata-${{ inputs.shard-name }}
        path: .coverage.${{ inputs.shard-name }}
        include-hidden-files: true
        retention-days: 1

    - name: Upload junit
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      continue-on-error: true
      with:
        name: junit-${{ inputs.shard-name }}
        path: junit-${{ inputs.shard-name }}.xml
        retention-days: 7
