# Run ONE pytest shard. Emits .coverage.<shard> (data file, for combine) + junit-<shard>.xml.
# Assumes a venv is already on PATH (setup-python-deps ran first) and that any DB/redis
# services + env vars are provided by the calling JOB (composites cannot declare services).
name: "Run pytest shard"
description: "Run one test shard, emit coverage data file + junit xml, upload both"

inputs:
  shard-name:
    description: "Unique shard id (used in artifact + file names)"
    required: true
  test-paths:
    description: "Space-separated test paths (used when markers is empty)"
    required: false
    default: ""
  markers:
    description: "pytest -m expression (takes precedence over test-paths)"
    required: false
    default: ""
  coverage-source:
    description: "Module/dir passed to --cov"
    required: false
    default: "."
  timeout:
    description: "Per-test timeout seconds"
    required: false
    default: "60"
  test-reruns:
    description: "Auto-rerun failed tests N times (flaky mitigation; 0 disables)"
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - name: Run pytest (collect coverage data, no report)
      shell: bash
      env:
        COVERAGE_FILE: .coverage.${{ inputs.shard-name }}
      run: |
        # Portable coverage data: store RELATIVE source paths so a separate
        # coverage-gate job (different workspace) can resolve them. Apps that
        # ship their own coverage config must also set [run] relative_files = true.
        if [ ! -f .coveragerc ]; then
          printf '[run]\nrelative_files = true\n' > .coveragerc
        fi
        export COVERAGE_RCFILE=.coveragerc
        if [ -n "${{ inputs.markers }}" ]; then
          SELECT=(-m "${{ inputs.markers }}")
        else
          SELECT=(${{ inputs.test-paths }})
        fi
        # Flaky mitigation: rerun failed tests (pytest-rerunfailures). Reruns appear in junit.
        # ACHTUNG Paketname: `pytest-rerunfailures` (ohne Bindestrich in der Mitte).
        # Bis 2026-07-15 stand hier `pytest-rerun-failures` — das gibt es auf PyPI NICHT
        # (404), der Install schlug jedes Mal still fehl und `test-reruns` war seit
        # v1.5.0 fleet-weit wirkungslos. Der Import-Check unten ist die Absicherung:
        # er meldet jetzt LAUT, statt Reruns kommentarlos wegzulassen.
        RERUN=()
        if [ "${{ inputs.test-reruns }}" != "0" ]; then
          pip install -q pytest-rerunfailures || echo "::warning::pytest-rerunfailures install failed — flaky reruns disabled"
          if python -c "import pytest_rerunfailures" 2>/dev/null; then
            RERUN=(--reruns "${{ inputs.test-reruns }}" --reruns-delay 1)
          else
            echo "::warning::pytest_rerunfailures not importable — running WITHOUT --reruns"
          fi
        fi
        pytest "${SELECT[@]}" \
          --timeout=${{ inputs.timeout }} \
          "${RERUN[@]}" \
          --cov=${{ inputs.coverage-source }} --cov-report= \
          --junitxml=junit-${{ inputs.shard-name }}.xml \
          -p no:cacheprovider

    - name: Upload coverage data
      if: always()
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
      continue-on-error: true
      with:
        name: covdata-${{ inputs.shard-name }}
        path: .coverage.${{ inputs.shard-name }}
        include-hidden-files: true
        retention-days: 1

    - name: Upload junit
      if: always()
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
      continue-on-error: true
      with:
        name: junit-${{ inputs.shard-name }}
        path: junit-${{ inputs.shard-name }}.xml
        retention-days: 7
