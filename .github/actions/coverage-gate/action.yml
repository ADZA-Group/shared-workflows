# Download every covdata-* artifact, coverage combine into a true union, gate on threshold.
# Replaces the legacy max()-line-rate heuristic that under-reported union coverage.
name: "Coverage gate"
description: "Combine per-shard coverage data, enforce a union-coverage threshold"

inputs:
  threshold:
    description: "Minimum total coverage percent"
    required: false
    default: "50"
  blocking:
    description: "Fail the job when below threshold (false => warn only)"
    required: false
    default: "true"
  diff-coverage-threshold:
    description: "Min coverage % on lines changed vs compare-branch (0 disables)"
    required: false
    default: "0"
  diff-coverage-compare-branch:
    description: "Ref to diff against for changed-line coverage (branch like origin/main, or a commit SHA — e.g. github.event.before on main pushes)"
    required: false
    default: "origin/main"
  diff-coverage-blocking:
    description: "Fail when diff-coverage below threshold (false => warn)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Download all shard coverage data
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        pattern: covdata-*
        path: .covdata
        merge-multiple: true

    - name: Combine + report + gate
      shell: bash
      env:
        THRESHOLD: ${{ inputs.threshold }}
        BLOCKING: ${{ inputs.blocking }}
      run: |
        shopt -s dotglob
        if ! ls .covdata/.coverage.* >/dev/null 2>&1; then
          echo "::error::no coverage data files found (covdata-* artifacts missing)"; exit 1
        fi
        cp .covdata/.coverage.* .
        if [ ! -f .coveragerc ]; then
          printf '[run]\nrelative_files = true\n' > .coveragerc
        fi
        export COVERAGE_RCFILE=.coveragerc
        coverage combine
        coverage xml -o coverage.xml
        # Den UNGERUNDETEN Wert nehmen. `--format=total` liefert eine Ganzzahl
        # (79,72 % -> "80"), und auch `--precision=2` rundet noch: 79,996 % wird
        # zu "80.00" und passiert eine Schwelle von 80. Beides GEMESSEN am
        # 11.09.2026. Nur die JSON-Ausgabe traegt den vollen Wert.
        TOTAL=$(coverage json -o - 2>/dev/null \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["totals"]["percent_covered"])' \
          2>/dev/null || true)
        if ! [[ "$TOTAL" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
          # Ein blockierendes Gate darf NICHT still auf einen gerundeten Wert
          # zurueckfallen — dann waere der Fehler wieder da, nur leiser.
          if [ "$BLOCKING" = "true" ]; then
            echo "::error::coverage total nicht exakt lesbar (coverage json) — ein blockierendes Gate faellt nicht auf gerundete Werte zurueck"; exit 1
          fi
          TOTAL=$(coverage report --format=total 2>/dev/null || true)
        fi
        if ! [[ "$TOTAL" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
          echo "::error::could not determine coverage total"; exit 1
        fi
        # Fuer die Anzeige runden, fuer die ENTSCHEIDUNG nie.
        ANZEIGE=$(python3 -c 'import sys; print(f"{float(sys.argv[1]):.2f}")' "$TOTAL")
        echo "## 📊 Coverage" >> "$GITHUB_STEP_SUMMARY"
        echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
        echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
        echo "| Union coverage | **${ANZEIGE}%** |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Threshold | ${THRESHOLD}% |" >> "$GITHUB_STEP_SUMMARY"
        coverage report >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
        # Numerisch in Python vergleichen: `[ -lt ]` kann kein Komma, und awk
        # braeuchte eine Aussage ueber Locale und Verfuegbarkeit. Python laeuft
        # hier ohnehin, coverage IST Python.
        if ! python3 -c 'import sys; sys.exit(0 if float(sys.argv[1]) >= float(sys.argv[2]) else 1)' "$TOTAL" "$THRESHOLD"; then
          if [ "$BLOCKING" = "true" ]; then
            echo "::error::coverage ${ANZEIGE}% < ${THRESHOLD}%"; exit 1
          else
            echo "::warning::coverage ${ANZEIGE}% < ${THRESHOLD}% (advisory)"
          fi
        fi

    - name: Diff coverage (new/changed lines)
      if: ${{ inputs.diff-coverage-threshold != '0' }}
      shell: bash
      env:
        THR: ${{ inputs.diff-coverage-threshold }}
        BLOCKING: ${{ inputs.diff-coverage-blocking }}
        BR: ${{ inputs.diff-coverage-compare-branch }}
      run: |
        pip install -q diff-cover || {
          echo "::warning::diff-cover install failed";
          if [ "$BLOCKING" = "true" ]; then
            echo "::error::diff-cover install failed on a blocking run (main/tag) — Gate NICHT stumm grün durchwinken"; exit 1;
          fi
          exit 0;
        }
        # Vergleichs-Ref validieren (Audit 2026-09-03, Fund B): gegen origin/main war das
        # Gate auf main-Pushes vakuum-gruen (HEAD == origin/main → leerer Diff → diff-cover
        # Exit 0, GEMESSEN). reusable-ci uebergibt dort github.event.before. Ist der Ref
        # ungueltig (0000…, force-push, nicht fetchbar) oder identisch mit HEAD, darf ein
        # BLOCKING Lauf nicht still auf origin/main zurueckfallen (Codex R-Fix-1) — nur
        # advisory-Laeufe fallen mit Warnung zurueck.
        case "$BR" in origin/*) git fetch origin "${BR#origin/}" --depth=200 2>/dev/null || true ;; esac
        if ! git rev-parse --verify --quiet "${BR}^{commit}" >/dev/null; then
          if [ "$BLOCKING" = "true" ]; then
            echo "::error::diff-coverage: compare ref '$BR' ist kein Commit — blocking Gate kann nicht messen"; exit 1
          fi
          echo "::warning::diff-coverage: compare ref '$BR' ungueltig — advisory, Fallback origin/main"
          git fetch origin main --depth=200 2>/dev/null || true
          BR=origin/main
        fi
        if [ "$(git rev-parse "${BR}^{commit}")" = "$(git rev-parse HEAD)" ]; then
          if [ "$BLOCKING" = "true" ]; then
            echo "::error::diff-coverage: compare ref '$BR' == HEAD — leerer Diff, Gate waere vakuum-gruen"; exit 1
          fi
          echo "::warning::diff-coverage: compare ref '$BR' == HEAD (leerer Diff) — advisory, keine Aussage"
        fi
        echo "## 🔬 Diff coverage (changed vs ${BR})" >> "$GITHUB_STEP_SUMMARY"
        if diff-cover coverage.xml --compare-branch="$BR" \
             --fail-under="$THR" \
             --markdown-report diff-cov.md; then
          echo "✅ changed-line coverage ≥ ${THR}%" >> "$GITHUB_STEP_SUMMARY"
        else
          tail -40 diff-cov.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ "$BLOCKING" = "true" ]; then
            echo "::error::diff-coverage on changed lines < ${THR}%"; exit 1
          else
            echo "::warning::diff-coverage on changed lines < ${THR}% (advisory)"
          fi
        fi
