# System Python + per-job venv + cached deps.
# Debian-13 self-hosted runners ship NO actions/setup-python binaries, and 5+
# test jobs share one runner (concurrent /usr/local site-packages corruption).
# Solution: use system python3, isolate each job in $RUNNER_TEMP venv, export to PATH.
name: "Setup Python Deps"
description: "System python3 + isolated per-job venv + cached pip deps (Debian-13 safe)"

inputs:
  python-version:
    description: >-
      Gewünschte Python-Version, z.B. "3.14". Genutzt wird `python<version>` vom PATH.
      Fehlt der Interpreter, wird auf System-python3 zurückgefallen — MIT Warnung, damit
      die Abweichung sichtbar ist (bis 2026-07-15 wurde die Version stillschweigend
      ignoriert: Tests liefen auf 3.13, Prod-Image auf 3.14.6). Leer = System-python3.
    required: false
    default: ""
  install-requirements:
    description: "Install requirements.txt if present"
    required: false
    default: "true"
  install-system-deps:
    description: "Install tesseract + poppler (PDF/OCR apps)"
    required: false
    default: "false"
  install-coverage:
    description: "Install pytest-cov + coverage + pytest-timeout"
    required: false
    default: "false"
  extra-packages:
    description: "Extra pip packages (space-separated)"
    required: false
    default: ""
  cache-key-suffix:
    description: "Namespaces the pip cache + venv per consumer (e.g. lint, pytest-auth)"
    required: false
    default: "default"

runs:
  using: composite
  steps:
    - name: Verify system Python
      id: py
      shell: bash
      env:
        WANT: ${{ inputs.python-version }}
      run: |
        for i in 1 2 3 4 5 6; do
          command -v python3 >/dev/null 2>&1 && break
          echo "python3 not yet on PATH (try $i) - waiting..."; sleep 3
        done
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 not found on runner after retries"; exit 1
        fi
        # Gewünschte Version bevorzugen, sonst System-python3 + laute Warnung.
        PY="$(command -v python3)"
        if [ -n "$WANT" ]; then
          if command -v "python${WANT}" >/dev/null 2>&1; then
            PY="$(command -v "python${WANT}")"
          else
            echo "::warning::python${WANT} nicht auf dem Runner — Tests laufen auf $(python3 --version). Abweichung zur angeforderten Version ${WANT}!"
          fi
        fi
        echo "interpreter=$PY" >> "$GITHUB_OUTPUT"
        echo "Using $("$PY" --version) at $PY"

    - name: Ensure pip + venv modules
      shell: bash
      run: |
        if ! python3 -m venv --help >/dev/null 2>&1 || ! python3 -m pip --version >/dev/null 2>&1; then
          # self-hosted runners often lack passwordless sudo → tolerate failure
          sudo -n apt-get update -qq \
            && sudo -n apt-get install -y -qq python3-venv python3-pip \
            || echo "::warning::python3-venv/pip missing and apt-get unavailable (no passwordless sudo?); venv creation may fail"
        fi

    - name: System dependencies (tesseract/poppler)
      if: inputs.install-system-deps == 'true'
      shell: bash
      run: |
        # Skip when already provisioned (self-hosted runners ship these) — avoids
        # an unnecessary `sudo apt-get` that hard-fails where sudo needs a password.
        if command -v tesseract >/dev/null 2>&1 && command -v pdftoppm >/dev/null 2>&1; then
          echo "::notice::tesseract + poppler already present — skipping apt-get"
        else
          sudo -n apt-get update -qq \
            && sudo -n apt-get install -y -qq tesseract-ocr tesseract-ocr-fra tesseract-ocr-deu poppler-utils \
            || echo "::warning::could not install tesseract/poppler (no passwordless sudo?); ensure they are pre-provisioned on the runner"
        fi

    # Nur auf ephemeren (hosted) Runnern sinnvoll: dort ist ~/.cache/pip nach dem
    # Job weg. Auf self-hosted ist es eine PERSISTENTE lokale Platte — der Restore
    # lud dort 905 MB mit 5.3 MB/s (173 s + 5 s untar) PRO JOB, um Dateien zu
    # "restaurieren", die längst dort lagen: 178 s von 208 s Setup für nichts,
    # ~8 GB Traffic pro CI-Lauf. Gemessen an rechnungsapp-Job 87319271043
    # (2026-07-15); pip selbst braucht danach 25 s. Der Post-Run-SAVE war aus
    # derselben Ursache schon deaktiviert — nur den Restore hatte nie jemand
    # hinterfragt. Merke: actions/cache ist für EPHEMERE Runner gebaut.
    - name: Cache pip downloads
      if: runner.environment == 'github-hosted'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5  # restore-only: vermeidet haengenden Post-Run-Save (10min-Timeout-Flake) auf self-hosted Runner
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-sys-${{ inputs.cache-key-suffix }}-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          pip-${{ runner.os }}-sys-${{ inputs.cache-key-suffix }}-
          pip-${{ runner.os }}-sys-

    - name: Create per-job venv and put it on PATH
      shell: bash
      env:
        SUFFIX: ${{ inputs.cache-key-suffix }}
        INTERP: ${{ steps.py.outputs.interpreter }}
      run: |
        VENV="$RUNNER_TEMP/venv-${SUFFIX}"
        "$INTERP" -m venv "$VENV"
        echo "$VENV/bin" >> "$GITHUB_PATH"
        echo "PIP_DEFAULT_TIMEOUT=90" >> "$GITHUB_ENV"
        "$VENV/bin/pip" install --upgrade pip --retries 5 --timeout 90

    - name: Install requirements
      if: inputs.install-requirements == 'true'
      shell: bash
      run: |
        if [ -f requirements.txt ]; then
          pip install --retries 5 --timeout 90 -r requirements.txt
        else
          echo "::notice::no requirements.txt — skipping"
        fi

    - name: Install coverage tooling
      if: inputs.install-coverage == 'true'
      shell: bash
      run: pip install --retries 5 --timeout 90 pytest-cov "coverage[toml]" pytest-timeout

    - name: Install extra packages
      if: inputs.extra-packages != ''
      shell: bash
      env:
        EXTRA: ${{ inputs.extra-packages }}   # Liste, bewusste Wortzerlegung per read -ra (Audit 2026-09-03, Fund 1+2)
      run: |
        read -ra PKGS <<< "$EXTRA"
        pip install --retries 5 --timeout 90 "${PKGS[@]}"
