# Launch an app in the background and poll its health endpoint until ready.
# App-agnostic: caller passes the boot command. Outputs the PID so caller can stop it.
name: "Start app"
description: "Background-launch an app and wait for its health endpoint"

inputs:
  boot-command:
    description: "Shell command that starts the app in the foreground (run via bash -c; pass a single foreground process — the PID returned is the bash wrapper)"
    required: true
  health-url:
    description: "URL polled until it returns 200"
    required: true
  max-retries:
    description: "Health poll attempts"
    required: false
    default: "30"
  retry-delay:
    description: "Seconds between attempts"
    required: false
    default: "1"

outputs:
  app-pid:
    description: "PID of the launched app"
    value: ${{ steps.launch.outputs.pid }}

runs:
  using: composite
  steps:
    - name: Launch + poll
      id: launch
      shell: bash
      env:
        # boot-command ist BEWUSST ausfuehrbarer Code (Vertrauensgrenze = Caller-Workflow);
        # er wird aber als Daten uebergeben und per bash -c ausgefuehrt, nicht in den
        # Step-Quelltext interpoliert (Audit 2026-09-03, Fund 1+2).
        BOOT: ${{ inputs.boot-command }}
        HEALTH: ${{ inputs.health-url }}
        MAX: ${{ inputs.max-retries }}
        DELAY: ${{ inputs.retry-delay }}
      run: |
        nohup bash -c "$BOOT" > app-boot.log 2>&1 &
        PID=$!
        echo "pid=$PID" >> "$GITHUB_OUTPUT"
        echo "Launched PID $PID; polling $HEALTH"
        for i in $(seq 1 "$MAX"); do
          if curl -fsS -o /dev/null --max-time 5 "$HEALTH"; then
            echo "✅ healthy after ${i} attempt(s)"; exit 0
          fi
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::app process died during startup"; cat app-boot.log; exit 1
          fi
          sleep "$DELAY"
        done
        echo "::error::health check never passed"; cat app-boot.log; exit 1
